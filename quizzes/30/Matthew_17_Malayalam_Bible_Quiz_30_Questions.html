'use strict';
const quiz={"range": "17", "title": "രൂപാന്തരവും വിശ്വാസവും", "questions": [{"type": "mc", "q": "രൂപാന്തരത്തിൽ മുഖവും വസ്ത്രവും ഉപമിക്കപ്പെട്ടത് യഥാക്രമം?", "options": ["മിന്നൽ; മഞ്ഞ്", "പ്രകാശം; സൂര്യൻ", "സൂര്യൻ; പ്രകാശം", "മഞ്ഞ്; മിന്നൽ"], "answer": 2, "refs": ["17:2"], "id": 1, "evidence": [{"ref": "17:2", "text": "അവന്‍ അവരുടെ മുമ്പില്‍വച്ചു രൂപാന്തരപ്പെട്ടു. അവന്റെ മുഖം സൂര്യനെപ്പോലെവെട്ടിത്തിളങ്ങി. അവന്റെ വസ്ത്രം പ്രകാശംപോലെ ധവളമായി."}]}, {"type": "mc", "q": "ശിഷ്യന്മാർ കമിഴ്ന്നുവീണതിനു പിന്നാലെ യേശു ചെയ്തത്?", "options": ["മേഘത്തിൽനിന്നു സംസാരിച്ചു", "സമീപിച്ച് അവരെ സ്പർശിച്ചു", "മലയിൽനിന്ന് ഉടനെ ഇറങ്ങി", "മൂന്നു കൂടാരങ്ങൾ നിർമിച്ചു"], "answer": 1, "refs": ["17:6", "17:7"], "id": 2, "evidence": [{"ref": "17:6", "text": "ഇതുകേട്ട ക്ഷണത്തില്‍ ശിഷ്യന്‍മാര്‍ കമിഴ്ന്നു വീണു; അവര്‍ ഭയവിഹ്വലരായി."}, {"ref": "17:7", "text": "യേശു സമീപിച്ച് അവരെ സ്പര്‍ശിച്ചുകൊണ്ടു പറഞ്ഞു: എഴുന്നേല്‍ക്കുവിന്‍, ഭയപ്പെടേണ്ടാ."}]}, {"type": "mc", "q": "ദർശനത്തെക്കുറിച്ചുള്ള മൗനനിർദ്ദേശത്തിന്റെ കാലപരിധി?", "options": ["മനുഷ്യപുത്രൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെടുന്നതുവരെ", "ഏലിയാ എല്ലാം പുനഃസ്ഥാപിക്കുന്നതുവരെ", "മനുഷ്യപുത്രൻ രാജ്യത്തിൽ വരുന്നതുവരെ", "മനുഷ്യപുത്രൻ ജറുസലെമിൽ എത്തുന്നതുവരെ"], "answer": 0, "refs": ["17:9"], "id": 3, "evidence": [{"ref": "17:9", "text": "മലയില്‍നിന്ന് ഇറങ്ങുമ്പോള്‍ യേശു അവരോട് ആജ്ഞാപിച്ചു: മനുഷ്യപുത്രന്‍മരിച്ചവരില്‍നിന്ന് ഉയിര്‍പ്പിക്കപ്പെടുന്നതുവരെ നിങ്ങള്‍ ഈ ദര്‍ശനത്തെപ്പറ്റി ആരോടും പറയരുത്."}]}, {"type": "mc", "q": "രോഗിയായ ബാലൻ പലപ്പോഴും വീഴുന്നത് എവിടെ?", "options": ["തീയിലും വെള്ളത്തിലും", "തീയിലും പാറയിലും", "വെള്ളത്തിലും കുഴിയിലും", "കുഴിയിലും പാറയിലും"], "answer": 0, "refs": ["17:15"], "id": 4, "evidence": [{"ref": "17:15", "text": "കര്‍ത്താവേ, എന്റെ പുത്രനില്‍ കനിയണമേ; അവന്‍ അപസ്മാരം പിടിപെട്ട് വല്ലാതെ കഷ്ടപ്പെടുന്നു. പലപ്പോഴും അവന്‍ തീയിലും വെള്ളത്തിലും വീഴുന്നു."}]}, {"type": "mc", "q": "പിശാചിനെ ബഹിഷ്കരിക്കാനാകാത്തതിന്റെ കാരണം ചോദിച്ച സാഹചര്യം?", "options": ["ശിഷ്യന്മാർ തനിച്ച് യേശുവിനെ സമീപിച്ചു", "മലയിൽവച്ച് പത്രോസ് ചോദിച്ചു", "ജനക്കൂട്ടത്തിന്റെ മുമ്പിൽ പിതാവ് ചോദിച്ചു", "നികുതിപിരിക്കുന്നവർ വീട്ടിൽവച്ച് ചോദിച്ചു"], "answer": 0, "refs": ["17:19"], "id": 5, "evidence": [{"ref": "17:19", "text": "അനന്തരം ശിഷ്യന്‍മാര്‍ തനിച്ച് യേശുവിനെ സമീപിച്ചു ചോദിച്ചു. എന്തുകൊണ്ടാണ് അതിനെ ബഹിഷ്‌കരിക്കാന്‍ ഞങ്ങള്‍ക്കു കഴിയാതെ പോയത്?"}]}, {"type": "mc", "q": "രണ്ടാം പീഡാനുഭവപ്രവചനം നൽകുമ്പോൾ അവർ ഒരുമിച്ചുകൂടിയത് എവിടെ?", "options": ["ജറുസലെമിൽ", "ഗലീലിയിൽ", "കേസറിയാഫിലിപ്പിയിൽ", "കഫർണാമിൽ"], "answer": 1, "refs": ["17:22"], "id": 6, "evidence": [{"ref": "17:22", "text": "അവര്‍ ഗലീലിയില്‍ ഒരുമിച്ചുകൂടിയപ്പോള്‍ യേശു അവരോടു പറഞ്ഞു: മനുഷ്യപുത്രന്‍മനുഷ്യരുടെ കൈകളില്‍ ഏല്‍പിക്കപ്പെടാന്‍ പോകുന്നു."}]}, {"type": "mc", "q": "ദേവാലയനികുതി പിരിക്കുന്നവർ ചോദ്യം ഉന്നയിച്ചത് ആരോട്?", "options": ["യാക്കോബിനോട്", "യേശുവിനോട്", "യോഹന്നാനോട്", "പത്രോസിനോട്"], "answer": 3, "refs": ["17:24"], "id": 7, "evidence": [{"ref": "17:24", "text": "അവര്‍ കഫര്‍ണാമിലെത്തിയപ്പോള്‍ ദേവാലയനികുതി പിരിക്കുന്നവര്‍ പത്രോസിന്റെ അടുത്തുചെന്നു ചോദിച്ചു: നിങ്ങളുടെ ഗുരു നികുതികൊടുക്കുന്നില്ലേ?"}]}, {"type": "mc", "q": "രാജാക്കന്മാർ നികുതി പിരിക്കുന്നതിനെക്കുറിച്ച് യേശു ചോദിച്ചത് എപ്പോൾ?", "options": ["നികുതിപിരിക്കുന്നവർ വന്നപ്പോൾ", "പത്രോസ് വീട്ടിലെത്തിയപ്പോൾ", "ഗലീലിയിൽ ഒരുമിച്ചുകൂടിയപ്പോൾ", "പത്രോസ് കടലിലെത്തിയപ്പോൾ"], "answer": 1, "refs": ["17:25"], "id": 8, "evidence": [{"ref": "17:25", "text": "അവന്‍ പറഞ്ഞു: ഉവ്വ്. പിന്നീടു വീട്ടിലെത്തിയപ്പോള്‍ യേശു ചോദിച്ചു: ശിമയോനേ, നിനക്കെന്തു തോന്നുന്നു, ഭൂമിയിലെ രാജാക്കന്‍മാര്‍ ആരില്‍ നിന്നാണ് നികുതിയോചുങ്കമോ പിരിക്കുന്നത്? തങ്ങളുടെ പുത്രന്‍മാരില്‍ നിന്നോ, അന്യരില്‍ നിന്നോ?"}]}, {"type": "mc", "q": "കൂടാരങ്ങൾ നിർമിക്കാനുള്ള പത്രോസിന്റെ നിർദേശത്തിലെ വ്യക്തികളുടെ ക്രമം?", "options": ["മോശ → യേശു → ഏലിയാ", "ഏലിയാ → മോശ → യേശു", "യേശു → ഏലിയാ → മോശ", "യേശു → മോശ → ഏലിയാ"], "answer": 3, "refs": ["17:4"], "evidence": [{"ref": "17:4", "text": "പത്രോസ് യേശുവിനോടു പറഞ്ഞു: കര്‍ത്താവേ, നാം ഇവിടെയായിരിക്കുന്നതു നല്ലതാണ്. നിനക്കു സമ്മതമാണെങ്കില്‍ ഞങ്ങള്‍ ഇവിടെ മൂന്നു കൂടാരങ്ങള്‍ ഉണ്ടാക്കാം - ഒന്നു നിനക്ക്, ഒന്നു മോശയ്ക്ക്, ഒന്ന് ഏലിയായ്ക്ക്."}], "id": 9}, {"type": "mc", "q": "ഏലിയാ ആദ്യം വരണമെന്നു പറയുന്നവരായി ശിഷ്യന്മാർ സൂചിപ്പിച്ചത്?", "options": ["നിയമജ്ഞർ", "ഫരിസേയർ", "നികുതിപിരിക്കുന്നവർ", "സദുക്കായർ"], "answer": 0, "refs": ["17:10"], "evidence": [{"ref": "17:10", "text": "ശിഷ്യന്‍മാര്‍ അവനോടു ചോദിച്ചു: ആദ്യം ഏലിയാ വരണമെന്ന് നിയമജ്ഞര്‍ പറയുന്നതെന്തുകൊണ്ട്?"}], "id": 10}, {"type": "mc", "q": "ഏലിയാ വന്നുകഴിഞ്ഞു എന്ന വചനത്തെ ശിഷ്യന്മാർ ആരുമായി ബന്ധപ്പെടുത്തി?", "options": ["ജറെമിയായുമായി", "സ്നാപകയോഹന്നാനുമായി", "പത്രോസുമായി", "മോശയുമായി"], "answer": 1, "refs": ["17:12", "17:13"], "evidence": [{"ref": "17:12", "text": "എന്നാല്‍, ഞാന്‍ നിങ്ങളോടു പറയുന്നു, ഏലിയാ വന്നു കഴിഞ്ഞു. എങ്കിലും അവര്‍ അവനെ മനസ്‌സിലാക്കിയില്ല. തങ്ങള്‍ക്കിഷ്ടമുള്ളതെല്ലാം അവര്‍ അവനോടു ചെയ്തു. അതുപോലെ മനുഷ്യപുത്രനും അവരില്‍നിന്നു പീഡകളേല്‍ക്കാന്‍ പോകുന്നു."}, {"ref": "17:13", "text": "സ്‌നാപകയോഹന്നാനെപ്പറ്റിയാണ് അവന്‍ തങ്ങളോടു സംസാരിച്ചതെന്ന് അപ്പോള്‍ ശിഷ്യന്‍മാര്‍ക്കു മനസ്‌സിലായി."}], "id": 11}, {"type": "mc", "q": "ബാലന്റെ പിതാവ് അപേക്ഷിക്കുന്നതിനുമുമ്പ് ചെയ്തത്?", "options": ["യേശുവിന്റെ വസ്ത്രത്തിൽ പിടിച്ചു", "ശിഷ്യന്മാരെ മാറ്റിനിറുത്തി", "ജനക്കൂട്ടത്തെ ശാസിച്ചു", "യേശുവിന്റെ സന്നിധിയിൽ പ്രണമിച്ചു"], "answer": 3, "refs": ["17:14"], "evidence": [{"ref": "17:14", "text": "അവര്‍ ജനക്കൂട്ടത്തിന്റെ അടുത്തേക്കു വന്നപ്പോള്‍ ഒരാള്‍ കടന്നുവന്ന് അവന്റെ സന്നിധിയില്‍ പ്രണമിച്ചുകൊണ്ടു പറഞ്ഞു:"}], "id": 12}, {"type": "mc", "q": "നാണയം കണ്ടെത്താൻ തുറക്കാൻ നിർദേശിച്ചത് ഏതു മത്സ്യത്തിന്റെ വായ്?", "options": ["രണ്ടാമതു ലഭിക്കുന്ന മത്സ്യത്തിന്റെ", "ഏറ്റവും വലിയ മത്സ്യത്തിന്റെ", "അവസാനം ലഭിക്കുന്ന മത്സ്യത്തിന്റെ", "ആദ്യം ലഭിക്കുന്ന മത്സ്യത്തിന്റെ"], "answer": 3, "refs": ["17:27"], "evidence": [{"ref": "17:27", "text": "എങ്കിലുംഅവര്‍ക്ക് ഇടര്‍ച്ചയുണ്ടാക്കാതിരിക്കാന്‍ നീ കടലില്‍പോയി ചൂണ്ടയിടുക; ആദ്യം ലഭിക്കുന്ന മത്‌സ്യത്തിന്റെ വായ് തുറക്കുമ്പോള്‍ ഒരു നാണയം കണ്ടെത്തും. അതെടുത്ത് എനിക്കും നിനക്കുംവേണ്ടി അവര്‍ക്കു കൊടുക്കുക."}], "id": 13}, {"type": "mc", "q": "കണ്ടെത്തുന്ന നാണയം ആരാർക്കുവേണ്ടി കൊടുക്കാൻ നിർദേശിച്ചു?", "options": ["പത്രോസിനും മറ്റു ശിഷ്യന്മാർക്കും", "യേശുവിനും മറ്റു ശിഷ്യന്മാർക്കും", "യാക്കോബിനും യോഹന്നാനും", "യേശുവിനും പത്രോസിനും"], "answer": 3, "refs": ["17:27"], "evidence": [{"ref": "17:27", "text": "എങ്കിലുംഅവര്‍ക്ക് ഇടര്‍ച്ചയുണ്ടാക്കാതിരിക്കാന്‍ നീ കടലില്‍പോയി ചൂണ്ടയിടുക; ആദ്യം ലഭിക്കുന്ന മത്‌സ്യത്തിന്റെ വായ് തുറക്കുമ്പോള്‍ ഒരു നാണയം കണ്ടെത്തും. അതെടുത്ത് എനിക്കും നിനക്കുംവേണ്ടി അവര്‍ക്കു കൊടുക്കുക."}], "id": 14}, {"type": "mc", "q": "മേഘത്തിലെ സ്വരം പ്രസാദിച്ചിരിക്കുന്നുവെന്നു പറഞ്ഞശേഷം നൽകിയ കൽപന ഏത്?", "options": ["ഇവനെ അനുഗമിക്കുവിൻ", "ഇവനെക്കുറിച്ച് പ്രസംഗിക്കുവിൻ", "ഇവന്റെ മുമ്പിൽ പ്രണമിക്കുവിൻ", "ഇവന്റെ വാക്കു ശ്രവിക്കുവിൻ"], "answer": 3, "refs": ["17:5"], "evidence": [{"ref": "17:5", "text": "അവന്‍ സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോള്‍ ശോഭയേറിയ ഒരുമേഘംവന്ന് അവരെ ആവരണം ചെയ്തു. മേഘത്തില്‍നിന്ന് ഇങ്ങനെയൊരു സ്വരമുണ്ടായി: ഇവന്‍ എന്റെ പ്രിയപുത്രന്‍; ഇവനില്‍ ഞാന്‍ പ്രസാദിച്ചിരിക്കുന്നു. ഇവന്റെ വാക്കു ശ്രവിക്കുവിന്‍."}], "id": 15}, {"type": "mc", "q": "നാണയം നൽകാനുള്ള നിർദേശത്തിൽ വ്യക്തമാക്കുന്ന ഉദ്ദേശ്യം ഏത്?", "options": ["അവർക്ക് ഇടർച്ചയുണ്ടാക്കാതിരിക്കാൻ", "അവരുടെ ചോദ്യത്തിന് മറുപടി പറയാൻ", "അവർക്ക് അടയാളം നൽകാൻ", "അവരുടെ വിശ്വാസം വർധിപ്പിക്കാൻ"], "answer": 0, "refs": ["17:27"], "evidence": [{"ref": "17:27", "text": "എങ്കിലുംഅവര്‍ക്ക് ഇടര്‍ച്ചയുണ്ടാക്കാതിരിക്കാന്‍ നീ കടലില്‍പോയി ചൂണ്ടയിടുക; ആദ്യം ലഭിക്കുന്ന മത്‌സ്യത്തിന്റെ വായ് തുറക്കുമ്പോള്‍ ഒരു നാണയം കണ്ടെത്തും. അതെടുത്ത് എനിക്കും നിനക്കുംവേണ്ടി അവര്‍ക്കു കൊടുക്കുക."}], "id": 16}, {"type": "fill", "q": "അവന്‍ സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോള്‍ ________ ഒരുമേഘംവന്ന് അവരെ ആവരണം ചെയ്തു. മേഘത്തില്‍നിന്ന് ഇങ്ങനെയൊരു സ്വരമുണ്ടായി: ഇവന്‍ എന്റെ പ്രിയപുത്രന്‍; ഇവനില്‍ ഞാന്‍ പ്രസാദിച്ചിരിക്കുന്നു. ഇവന്റെ വാക്കു ശ്രവിക്കുവിന്‍. (17:5)", "answer": "ശോഭയേറിയ", "refs": ["17:5"], "id": 17, "evidence": [{"ref": "17:5", "text": "അവന്‍ സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോള്‍ ശോഭയേറിയ ഒരുമേഘംവന്ന് അവരെ ആവരണം ചെയ്തു. മേഘത്തില്‍നിന്ന് ഇങ്ങനെയൊരു സ്വരമുണ്ടായി: ഇവന്‍ എന്റെ പ്രിയപുത്രന്‍; ഇവനില്‍ ഞാന്‍ പ്രസാദിച്ചിരിക്കുന്നു. ഇവന്റെ വാക്കു ശ്രവിക്കുവിന്‍."}], "options": ["വല if(count===total)showResults();else{$('results').hidden=true;$('results').innerHTML='';}}
function feedback(q,r){const parts=q.type==='match'?'<div>'+q.rows.map((row,i)=>`<p>${i+1}. ${esc(row[0])}: ${r.value[i]===i?'ശരിയാണ്':'തെറ്റാണ്'}</p>`).join('')+'</div>':'';
return `<div tabindex="-1" class="feedback ${r.correct?'':'wrong'}"><div class="feedback-heading"><span class="status-icon" aria-hidden="true">${r.correct?'✓':'✕'}</span><strong>${r.correct?'ശരിയാണ് — 1 മാർക്ക്':'തെറ്റാണ് — 0 മാർക്ക്'}</strong></div>${parts}<p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,r.value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div><details><summary>വചനാധാരം കാണുക</summary>${q.evidence.map(e=>`<div class="evidence"><strong>${esc(e.label||'മത്തായി '+e.ref)}</strong><p>${esc(e.text)}</p></div>`).join('')}</details></div>`;}
function check(){if(responses[current])return;saveDraft();const q=quiz.questions[current],a=drafts[current];if(a===null||(q.type==='match'&&a.some(x=>x===''))){$('notice').textContent=q.type==='match'?'എല്ലാ കൂട്ടുകളും തിരഞ്ഞെടുക്കുക.':'ആദ്യം നിങ്ങളുടെ ഉത്തരം നൽകുക.';return;}
let value,correct;if(q.type==='mc'){value=Number(a);correct=value===q.answer;}else if(q.type==='tf'){value=a==='0';correct=value===q.answer;}else if(q.type==='fill'){value=Number(a);correct=value===q.optionAnswer;}else{value=a.map(Number);correct=value.every((x,i)=>x===i);}
responses[current]={value,correct};render();const target=$('feedback').firstElementChild;requestAnimationFrame(()=>{if(!target.isConnected)return;target.focus({preventScroll:true});target.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});target.classList.add(correct?'celebrate':'try-again');});}
function showResults(){const n=responses.filter(x=>x.correct).length;$('results').hidden=false;$('results').innerHTML=`<h2 id="results-title">ക്വിസ് പൂർത്തിയായി</h2><p><strong>നിങ്ങളുടെ സ്കോർ: ${n} / ${total}</strong></p><p>ശരിയായ ഉത്തരങ്ങൾ: ${n}<br>തെറ്റായ ഉത്തരങ്ങൾ: ${total-n}<br>ശതമാനം: ${Math.round(n/total*100)}%</p><h3>ഉത്തരങ്ങൾ പരിശോധിക്കാം</h3>`+quiz.questions.map((q,i)=>`<div class="review"><h3>${i+1}. ${esc(q.q)}</h3><p>${responses[i].correct?'ശരിയാണ്':'തെറ്റാണ്'}</p><p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,responses[i].value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div></div>`).join('');}
function jumpTo(index){if(!Number.isInteger(index)||index<0||index>=total)return;saveDraft();current=index;render();$('question-title').focus({preventScroll:true});$('question-panel').scrollIntoView({block:'start'});}function move(step){jumpTo(current+step);}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reset').onclick=()=>{current=0;responses=quiz.questions.map(()=>null);drafts=quiz.questions.map(()=>null);render();$('question-title').focus();window.scrollTo(0,0);};render();
</script></body></html>
