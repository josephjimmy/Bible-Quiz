const quiz={"range": "26-27", "title": "പീഡാനുഭവം, മരണം, സംസ്കാരം", "questions": [{"type": "mc", "q": "തിരുനാൾ ദിവസം പിടികൂടേണ്ടെന്ന തീരുമാനത്തിനു പറഞ്ഞ കാരണം?", "options": ["ജനങ്ങൾ ബഹളമുണ്ടാക്കും", "ദേശാധിപതി സമ്മതിക്കില്ല", "സാക്ഷികൾ ലഭിക്കില്ല", "ശിഷ്യന്മാർ പ്രതിരോധിക്കും"], "answer": 0, "refs": ["26:5"], "id": 1, "evidence": [{"ref": "26:5", "text": "അവര്‍ പറഞ്ഞു: തിരുനാള്‍ ദിവസം വേണ്ടാ; ജനങ്ങള്‍ ബഹളമുണ്ടാക്കും."}]}, {"type": "mc", "q": "ശിരസ്സിൽ സുഗന്ധതൈലം ഒഴിച്ചതു കണ്ടു പാഴ്‌ചെലവിനെക്കുറിച്ച് പറഞ്ഞവർ?", "options": ["പ്രധാനപുരോഹിതന്മാർ", "ജനപ്രമാണികൾ", "ശിഷ്യന്മാർ", "പരിചാരകന്മാർ"], "answer": 2, "refs": ["26:7", "26:8"], "id": 2, "evidence": [{"ref": "26:7", "text": "വിലയേറിയ സുഗന്ധതൈലം നിറച്ച ഒരു വെണ്‍കല്‍പാത്രവുമായി ഒരു സ്ത്രീ അവനെ സമീപിച്ചു. അവന്‍ ഭക്ഷണത്തിനിരിക്കുമ്പോള്‍, അവള്‍ തൈലം അവന്റെ ശിരസ്‌സില്‍ ഒഴിച്ചു."}, {"ref": "26:8", "text": "ഇതു കണ്ട ശിഷ്യന്‍മാര്‍ കോപത്തോടെ പറഞ്ഞു: എന്തിന് ഈ പാഴ്‌ചെലവ്?"}]}, {"type": "mc", "q": "പെസഹാ ഒരുക്കേണ്ട സ്ഥലം ശിഷ്യന്മാർ അന്വേഷിച്ചത് എപ്പോൾ?", "options": ["പെസഹായ്ക്കു രണ്ടു ദിവസം മുമ്പ്", "പെസഹായുടെ വൈകുന്നേരം", "ഒരുക്കദിനത്തിന്റെ പിറ്റേന്ന്", "പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഒന്നാം ദിവസം"], "answer": 3, "refs": ["26:17"], "id": 3, "evidence": [{"ref": "26:17", "text": "പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഒന്നാം ദിവസം ശിഷ്യന്‍മാര്‍ യേശുവിന്റെ അടുത്തുവന്നു ചോദിച്ചു: നിനക്കു പെസഹാ എവിടെ ഒരുക്കണമെന്നാണ് നീ ആഗ്രഹിക്കുന്നത്?"}]}, {"type": "mc", "q": "ഒറ്റിക്കൊടുക്കലിനെക്കുറിച്ചുള്ള ചോദ്യത്തിൽ മറ്റുള്ളവരുടെയും യൂദാസിന്റെയും സംബോധനകൾ യഥാക്രമം?", "options": ["സ്‌നേഹിതാ; ഗുരോ", "കർ‍ത്താവേ; സ്‌നേഹിതാ", "കർ‍ത്താവേ; ഗുരോ", "ഗുരോ; കർത്താവേ"], "answer": 2, "refs": ["26:22", "26:25"], "id": 4, "evidence": [{"ref": "26:22", "text": "അവര്‍ അതീവ ദുഃഖിതരായി; കര്‍ത്താവേ, അതു ഞാന്‍ അല്ലല്ലോ എന്ന് ഓരോരുത്തരും അവനോടു ചോദിക്കാന്‍ തുടങ്ങി."}, {"ref": "26:25", "text": "അവനെ ഒറ്റിക്കൊടുക്കാനിരുന്ന യൂദാസ് അവനോടു ചോദിച്ചു: ഗുരോ, അതു ഞാനോ? അവന്‍ പറഞ്ഞു: നീ പറഞ്ഞുകഴിഞ്ഞു."}]}, {"type": "mc", "q": "പാനപാത്രം എടുത്തശേഷം കൊടുക്കുന്നതിനു മുമ്പ് ചെയ്തത്?", "options": ["കൃതജ്ഞതാസ്തോത്രം ചെയ്തു", "അപ്പത്തെപ്പോലെ മുറിച്ചു", "സ്തോത്രഗീതം ആലപിച്ചു", "കമിഴ്ന്നുവീണു പ്രാർഥിച്ചു"], "answer": 0, "refs": ["26:27"], "id": 5, "evidence": [{"ref": "26:27", "text": "അനന്തരം പാനപാത്രമെടുത്ത് കൃതജ്ഞതാസ്‌തോത്രം ചെയ്ത് അവര്‍ക്കുകൊടുത്തുകൊണ്ടു പറഞ്ഞു: നിങ്ങളെല്ലാവരും ഇതില്‍നിന്നു പാനം ചെയ്യുവിന്‍."}]}, {"type": "mc", "q": "ഒരു മണിക്കൂർ ഉണർന്നിരിക്കാനാകാത്തതിനെക്കുറിച്ച് നേരിട്ടു ചോദിച്ചത് ആരോട്?", "options": ["യാക്കോബിനോട്", "പത്രോസിനോട്", "യൂദാസിനോട്", "യോഹന്നാനോട്"], "answer": 1, "refs": ["26:40"], "id": 6, "evidence": [{"ref": "26:40", "text": "അനന്തരം അവന്‍ ശിഷ്യന്‍മാരുടെ അടുത്തേക്കുവന്നു. അപ്പോള്‍ അവര്‍ ഉറങ്ങുന്നതു കണ്ടു. അവന്‍ പത്രോസിനോടു ചോദിച്ചു: എന്നോടുകൂടെ ഒരു മണിക്കൂര്‍ ഉണര്‍ന്നിരിക്കാന്‍ നിങ്ങള്‍ക്കു കഴിഞ്ഞില്ലേ?"}]}, {"type": "mc", "q": "അയച്ചുതരാവുന്ന ദൂതന്മാരുടെ വ്യൂഹങ്ങളെക്കുറിച്ചുള്ള കൃത്യമായ സംഖ്യാവിവരണം?", "options": ["പതിനൊന്നു വ്യൂഹങ്ങൾ", "പന്ത്രണ്ടു വ്യൂഹങ്ങൾ മാത്രം", "പന്ത്രണ്ടിലേറെ വ്യൂഹങ്ങൾ", "പതിനായിരം വ്യൂഹങ്ങൾ"], "answer": 2, "refs": ["26:53"], "id": 7, "evidence": [{"ref": "26:53", "text": "എനിക്ക് എന്റെ പിതാവിനോട് അപേക്ഷിക്കാന്‍ കഴിയുകയില്ലെന്നും ഉടന്‍ തന്നെ അവിടുന്ന് എനിക്കു തന്റെ ദൂതന്‍മാരുടെ പന്ത്രണ്ടിലേറെ വ്യൂഹങ്ങളെ അയച്ചുതരുകയില്ലെന്നും നീ വിചാരിക്കുന്നുവോ?"}]}, {"type": "mc", "q": "അവസാനം ദേവാലയത്തെക്കുറിച്ച് സാക്ഷ്യം പറഞ്ഞവരുടെ എണ്ണം?", "options": ["ഒരാൾ", "മൂന്നുപേർ", "പന്ത്രണ്ടുപേർ", "രണ്ടുപേർ"], "answer": 3, "refs": ["26:61"], "id": 8, "evidence": [{"ref": "26:61", "text": "അവസാനം രണ്ടുപേര്‍ മുന്നോട്ടുവന്ന്, ഇപ്രകാരം പറഞ്ഞു: ഈ ദേവാലയം നശിപ്പിക്കാനും മൂന്നു ദിവസംകൊണ്ടു നിര്‍മിക്കാനും എനിക്കു സാധിക്കും എന്ന് ഇവന്‍ പറഞ്ഞിട്ടുണ്ട്."}]}, {"type": "mc", "q": "രണ്ടാമത്തെ പരിചാരിക പത്രോസിനെ കണ്ട സ്ഥലം?", "options": ["ദേവാലയം", "കവാടം", "മുറ്റം", "കൊട്ടാരത്തിനുള്ളിൽ"], "answer": 1, "refs": ["26:71"], "id": 9, "evidence": [{"ref": "26:71", "text": "അവന്‍ കവാടത്തിലേക്കു പോയപ്പോള്‍ മറ്റൊരു പരിചാരിക അവനെക്കണ്ടു. അവള്‍ അടുത്തു നിന്നവരോടു പറഞ്ഞു: ഈ മനുഷ്യനും നസറായനായ യേശുവിന്റെ കൂടെയായിരുന്നു."}]}, {"type": "mc", "q": "യൂദാസ് പണം മടക്കിനൽകിയത് ആരെ ഏൽപിച്ചാണ്?", "options": ["പ്രമാണിമാരെയും നിയമജ്ഞരെയും", "പ്രധാനപുരോഹിതന്മാരെയും പ്രമാണിമാരെയും", "പ്രധാനപുരോഹിതന്മാരെയും ഫരിസേയരെയും", "ഫരിസേയരെയും സദുക്കായരെയും"], "answer": 1, "refs": ["27:3"], "id": 10, "evidence": [{"ref": "27:3", "text": "അവനെ ഒറ്റിക്കൊടുത്ത യൂദാസ് അവന്‍ ശിക്ഷയ്ക്കു വിധിക്കപ്പെട്ടു എന്നറിഞ്ഞപ്പോള്‍ പശ്ചാത്തപിച്ച് ആ മുപ്പതുവെള്ളിനാണയങ്ങള്‍ പ്രധാനപുരോഹിതന്‍മാരെയും പ്രമാണിമാരെയും ഏല്‍പിച്ചുകൊണ്ടു പറഞ്ഞു:"}]}, {"type": "mc", "q": "ഗോൽഗോഥായിൽ ആദ്യം കുടിക്കാൻ കൊടുത്തത്?", "options": ["വെള്ളം കലർത്തിയ വീഞ്ഞ്", "കയ്പുകലർത്തിയ വെള്ളം", "വിനാഗിരിയിൽ മുക്കിയ നീർപ്പഞ്ഞി", "കയ്പുകലർത്തിയ വീഞ്ഞ്"], "answer": 3, "refs": ["27:34"], "id": 11, "evidence": [{"ref": "27:34", "text": "അവര്‍ അവനു കയ്പുകലര്‍ത്തിയ വീഞ്ഞ് കുടിക്കാന്‍ കൊടുത്തു. അവന്‍ അതു രുചിച്ചുനോക്കിയെങ്കിലും കുടിക്കാന്‍ ഇഷ്ടപ്പെട്ടില്ല."}]}, {"type": "mc", "q": "ഉയിർപ്പിക്കപ്പെട്ട വിശുദ്ധർ വിശുദ്ധനഗരത്തിൽ പ്രവേശിച്ച് പ്രത്യക്ഷപ്പെട്ടത് എപ്പോൾ?", "options": ["യേശുവിന്റെ പുനരുത്ഥാനത്തിനുശേഷം", "യേശു ജീവൻ വെടിഞ്ഞ ഉടനെ", "തിരശ്ശീല കീറിയ ഉടനെ", "യേശുവിന്റെ സംസ്കാരത്തിനു മുമ്പ്"], "answer": 0, "refs": ["27:53"], "id": 12, "evidence": [{"ref": "27:53", "text": "അവന്റെ പുനരുത്ഥാനത്തിനുശേഷം, അവര്‍ ശവകുടീരങ്ങളില്‍നിന്നു പുറത്തുവന്ന് വിശുദ്ധനഗരത്തില്‍ പ്രവേശിച്ച് പലര്‍ക്കും പ്രത്യക്ഷപ്പെട്ടു."}]}, {"type": "mc", "q": "കല്ലറയ്ക്ക് കാവൽ ആവശ്യപ്പെടാൻ പീലാത്തോസിന്റെ അടുത്തെത്തിയ രണ്ടു വിഭാഗങ്ങൾ?", "options": ["നിയമജ്ഞരും ശ്രേഷ്ഠന്മാരും", "പ്രധാനപുരോഹിതന്മാരും ഫരിസേയരും", "പ്രധാനപുരോഹിതന്മാരും നിയമജ്ഞരും", "ഫരിസേയരും സദുക്കായരും"], "answer": 1, "refs": ["27:62"], "id": 13, "evidence": [{"ref": "27:62", "text": "പിറ്റേദിവസം, അതായത്, ഒരുക്കദിനത്തിന്റെ പിറ്റേന്ന്, പ്രധാന പുരോഹിതന്‍മാരും ഫരിസേയരും പീലാത്തോസിന്റെ അടുക്കല്‍ ഒരുമിച്ചു കൂടി."}]}, {"type": "mc", "q": "പെസഹാ എത്ര ദിവസം കഴിഞ്ഞാണെന്നു യേശു ശിഷ്യന്മാരെ ഓർമിപ്പിച്ചു?", "options": ["ഒരു ദിവസം കഴിഞ്ഞ്", "മൂന്നു ദിവസം കഴിഞ്ഞ്", "ആറു ദിവസം കഴിഞ്ഞ്", "രണ്ടു ദിവസം കഴിഞ്ഞ്"], "answer": 3, "refs": ["26:2"], "evidence": [{"ref": "26:2", "text": "രണ്ടു ദിവസം കഴിഞ്ഞ് പെസഹായാണെന്നു നിങ്ങള്‍ക്കറിയാമല്ലോ. മനുഷ്യപുത്രന്‍ ക്രൂശിക്കപ്പെടാനായി ഏല്‍പിക്കപ്പെടും."}], "id": 14}, {"type": "mc", "q": "സ്ത്രീയുടെ പാത്രത്തിന് നൽകിയ കൃത്യമായ വസ്തുവിവരണം?", "options": ["മൺപാത്രം", "വെള്ളിപ്പാത്രം", "സ്വർണപാത്രം", "വെൺകൽപാത്രം"], "answer": 3, "refs": ["26:7"], "evidence": [{"ref": "26:7", "text": "വിലയേറിയ സുഗന്ധതൈലം നിറച്ച ഒരു വെണ്‍കല്‍പാത്രവുമായി ഒരു സ്ത്രീ അവനെ സമീപിച്ചു. അവന്‍ ഭക്ഷണത്തിനിരിക്കുമ്പോള്‍, അവള്‍ തൈലം അവന്റെ ശിരസ്‌സില്‍ ഒഴിച്ചു."}], "id": 15}, {"type": "mc", "q": "തൈലം പൂശിയതിനെ യേശു ഏതു ഒരുക്കമായി വ്യാഖ്യാനിച്ചു?", "options": ["സംസ്കരിക്കുന്നതിനുള്ള ഒരുക്കം", "പെസഹാ ആചരിക്കുന്നതിനുള്ള ഒരുക്കം", "ജറുസലെമിലേക്കു പോകുന്നതിനുള്ള ഒരുക്കം", "രാജാവായി അഭിഷേകം ചെയ്യുന്നതിനുള്ള ഒരുക്കം"], "answer": 0, "refs": ["26:12"], "evidence": [{"ref": "26:12", "text": "എന്നെ സംസ്‌കരിക്കുന്നതിനുള്ള ഒരുക്കമായിട്ടാണ് ഇവള്‍ എന്റെ ശരീരത്തില്‍തൈലം പൂശിയത്."}], "id": 16}, {"type": "mc", "q": "യൂദാസിന് മുപ്പതു വെള്ളിനാണയങ്ങൾ നൽകുന്നതിനെക്കുറിച്ച് ഇവിടെ രേഖപ്പെടുത്തുന്ന ക്രിയ?", "options": ["തിരിച്ചുവാങ്ങി", "വാഗ്ദാനം ചെയ്തു", "അപ്പോൾ കൊടുത്തു", "ഭണ്ഡാരത്തിൽ നിക്ഷേപിച്ചു"], "answer": 1, "refs": ["26:15"], "evidence": [{"ref": "26:15", "text": "ഞാന്‍ അവനെ നിങ്ങള്‍ക്ക് ഏല്‍പിച്ചു തന്നാല്‍ നിങ്ങള്‍ എനിക്ക് എന്തു തരും? അവര്‍ അവന് മുപ്പതുവെള്ളിനാണയങ്ങള്‍ വാഗ്ദാനം ചെയ്തു."}], "id": 17}, {"type": "mc", "q": "ഭക്ഷണത്തിനിരിക്കുമ്പോൾ പ്രത്യേകം നൽകിയ സമയസൂചന?", "options": ["പ്രഭാതമായപ്പോൾ", "വൈകുന്നേരമായപ്പോൾ", "ആറാം മണിക്കൂറായപ്പോൾ", "അർധരാത്രിയായപ്പോൾ"], "answer": 1, "refs": ["26:20"], "evidence": [{"ref": "26:20", "text": "വൈകുന്നേരമായപ്പോള്‍ അവന്‍ പന്ത്രണ്ടു ശിഷ്യന്‍മാരോടൊത്ത് ഭക്ഷണത്തിനിരുന്നു."}], "id": 18}, {"type": "mc", "q": "മുന്തിരിയുടെ ഫലം വീണ്ടും പാനം ചെയ്യുന്ന സന്ദർഭം?", "options": ["ദേവാലയത്തിൽ ശിഷ്യന്മാരോടൊത്തു നവമായി", "ഗലീലിയിൽ ശിഷ്യന്മാരോടൊത്തു നവമായി", "ജറുസലെമിൽ ശിഷ്യന്മാരോടൊത്തു നവമായി", "പിതാവിന്റെ രാജ്യത്തിൽ ശിഷ്യന്മാരോടൊത്തു നവമായി"], "answer": 3, "refs": ["26:29"], "evidence": [{"ref": "26:29", "text": "ഞാന്‍ നിങ്ങളോടു പറയുന്നു, എന്റെ പിതാവിന്റെ രാജ്യത്തില്‍ നിങ്ങളോടൊത്തു നവമായി ഇതു പാനം ചെയ്യുന്ന ദിവസംവരെ മുന്തിരിയുടെ ഈ ഫലത്തില്‍നിന്നു ഞാന്‍ വീണ്ടും കുടിക്കുകയില്ല."}], "id": 19}, {"type": "mc", "q": "ഒലിവുമലയിലേക്കു പോകുന്നതിനു തൊട്ടുമുമ്പ് ചെയ്തത്?", "options": ["പന്ത്രണ്ടുപേരെ വിളിച്ചു", "ശിഷ്യന്മാരെ സ്പർശിച്ചു", "മൂന്നാം പ്രാവശ്യം പ്രാർഥിച്ചു", "സ്തോത്രഗീതം ആലപിച്ചു"], "answer": 3, "refs": ["26:30"], "evidence": [{"ref": "26:30", "text": "സ്‌തോത്രഗീതം ആലപിച്ചശേഷം അവര്‍ ഒലിവുമലയിലേക്കു പോയി."}], "id": 20}, {"type": "mc", "q": "രണ്ടാം പ്രാർഥനയിൽ പാനപാത്രത്തെക്കുറിച്ചുള്ള നിബന്ധന?", "options": ["ഞാൻ കുടിക്കാതെ ഇതു കടന്നുപോകയില്ലെങ്കിൽ", "ശിഷ്യന്മാർ ഉണർന്നിരുന്നാൽ ഇതു കടന്നുപോയാൽ", "മറ്റുള്ളവർ കുടിച്ചശേഷം ഇതു കടന്നുപോയാൽ", "സാധ്യമെങ്കിൽ ഇതു കടന്നുപോയാൽ"], "answer": 0, "refs": ["26:42"], "evidence": [{"ref": "26:42", "text": "രണ്ടാം പ്രാവശ്യവും അവന്‍ പോയി പ്രാര്‍ഥിച്ചു: എന്റെ പിതാവേ, ഞാന്‍ കുടിക്കാതെ ഇതു കടന്നുപോകയില്ലെങ്കില്‍ അങ്ങയുടെ ഹിതം നിറവേറട്ടെ!"}], "id": 21}, {"type": "mc", "q": "യൂദാസിനോടൊപ്പം വന്ന ജനക്കൂട്ടത്തിന്റെ ആയുധങ്ങൾ?", "options": ["വടികളും കല്ലുകളും", "വാളും വടികളും", "ഞാങ്ങണകളും കല്ലുകളും", "വാളും ഞാങ്ങണകളും"], "answer": 1, "refs": ["26:47"], "evidence": [{"ref": "26:47", "text": "അവന്‍ സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോള്‍ത്തന്നെ പന്ത്രണ്ടുപേരില്‍ ഒരുവനായ യൂദാസ് അവിടെയെത്തി. അവനോടുകൂടെ പ്രധാനപുരോഹിതന്‍മാരുടെയും ജനപ്രമാണികളുടെയും അടുക്കല്‍നിന്ന് വാളും വടികളുമായി ഒരു ജനക്കൂട്ടവും വന്നിരുന്നു."}], "id": 22}, {"type": "mc", "q": "കയ്യാഫാസിന്റെ അടുത്ത് സമ്മേളിച്ചിരുന്നവരായി പറയുന്നവർ?", "options": ["പ്രധാനപുരോഹിതന്മാരും ജനപ്രമാണികളും", "നിയമജ്ഞരും പരിചാരകന്മാരും", "നിയമജ്ഞരും ശ്രേഷ്ഠന്മാരും", "ഫരിസേയരും സദുക്കായരും"], "answer": 2, "refs": ["26:57"], "evidence": [{"ref": "26:57", "text": "യേശുവിനെ പിടിച്ചു ബന്ധിച്ചവര്‍ പ്രധാന പുരോഹിതനായ കയ്യാഫാസിന്റെ അടുത്തേക്ക് അവനെ കൊണ്ടുപോയി. അവിടെ നിയമജ്ഞരും ശ്രേഷ്ഠന്‍മാരും സമ്മേളിച്ചിരുന്നു."}], "id": 23}, {"type": "mc", "q": "കുശവന്റെ പറമ്പു വാങ്ങിയതിന്റെ ഉദ്ദേശ്യം?", "options": ["പടയാളികളെ താമസിപ്പിക്കാൻ", "പ്രവാചകന്മാരെ സംസ്കരിക്കാൻ", "വിദേശീയരെ സംസ്കരിക്കാൻ", "ദരിദ്രരെ താമസിപ്പിക്കാൻ"], "answer": 2, "refs": ["27:7"], "evidence": [{"ref": "27:7", "text": "അതുകൊണ്ട്, അവര്‍ കൂടിയാലോചിച്ച്, ആ പണം കൊടുത്ത് വിദേശീയരെ സംസ്‌കരിക്കാന്‍ വേണ്ടി കുശവന്റെ പറമ്പു വാങ്ങി."}], "id": 24}, {"type": "mc", "q": "പീലാത്തോസിന്റെ ഭാര്യ സന്ദേശം അയയ്ക്കുമ്പോൾ പീലാത്തോസ് ഇരുന്നത്?", "options": ["കൊട്ടാരമുറ്റത്ത്", "ദേവാലയത്തിൽ", "ന്യായാസനത്തിൽ", "പ്രത്തോറിയത്തിൽ"], "answer": 2, "refs": ["27:19"], "evidence": [{"ref": "27:19", "text": "മാത്രമല്ല, അവന്‍ ന്യായാസനത്തില്‍ ഉപവിഷ്ടനായിരിക്കുമ്പോള്‍, അവന്റെ ഭാര്യ അവന്റെ അടുത്തേക്ക് ആളയച്ച് അറിയിച്ചു: ആ നീതിമാന്റെ കാര്യത്തില്‍ ഇടപെടരുത്. അവന്‍ മൂലം സ്വപ്നത്തില്‍ ഞാന്‍ ഇന്നു വളരെയേറെ ക്‌ളേശിച്ചു."}], "id": 25}, {"type": "mc", "q": "ദൈവപുത്രനായിരുന്നു എന്ന സാക്ഷ്യം പറഞ്ഞവരായി ഇവിടെ രേഖപ്പെടുത്തുന്നത്?", "options": ["പ്രധാനപുരോഹിതന്മാരും നിയമജ്ഞരും", "ശതാധിപൻ മാത്രം", "ശതാധിപനും അവന്റെ കൂടെ ഉണ്ടായിരുന്നവരും", "കവർച്ചക്കാരും കടന്നുപോയവരും"], "answer": 2, "refs": ["27:54"], "evidence": [{"ref": "27:54", "text": "യേശുവിന് കാവല്‍ നിന്നിരുന്ന ശതാധിപനും അവന്റെ കൂടെ ഉണ്ടായിരുന്നവരും ഭൂകമ്പവും മറ്റു സംഭവങ്ങളും കണ്ട് അത്യധികം ഭയപ്പെട്ടു, സത്യമായും ഇവന്‍ ദൈവപുത്രനായിരുന്നു എന്നുപറഞ്ഞു."}], "id": 26}, {"type": "fill", "q": "അവന്‍ പറഞ്ഞു: നിങ്ങള്‍ പട്ടണത്തില്‍ പോയി ഇന്നയാളുടെ അടുത്തു ചെന്ന് പറയുക: ഗുരു പറയുന്നു, എന്റെ സമയം ________; ഞാന്‍ എന്റെ ശിഷ്യന്‍മാരോടുകൂടെ നിന്റെ വീട്ടില്‍ പെസഹാ ആചരിക്കും. (26:18)", "answer": "സമാഗതമായി", "refs": ["26:18"], "id": 27, "evidence": [{"ref": "26:18", "text": "അവന്‍ പറഞ്ഞു: നിങ്ങള്‍ പട്ടണത്തില്‍ പോയി ഇന്നയാളുടെ അടുത്തു ചെന്ന് പറയുക: ഗുരു പറയുന്നു, എന്റെ സമയം സമാഗതമായി; ഞാന്‍ എന്റെ ശിഷ്യന്‍മാരോടുകൂടെ നിന്റെ വീട്ടില്‍ പെസഹാ ആചരിക്കും."}], "options": ["അവസാനമായി", "സമാഗതമായി", "നിറവേറി", "കടന്നുപോയി"], "optionAnswer": 1}, {"type": "fill", "q": "അവന്‍ വീണ്ടും വന്നപ്പോള്‍ അവര്‍ ഉറങ്ങുന്നതു കണ്ടു. അവരുടെ കണ്ണുകള്‍ ________. (26:43)", "answer": "നിദ്രാഭാരമുള്ളവയായിരുന്നു", "refs": ["26:43"], "id": 28, "evidence": [{"ref": "26:43", "text": "അവന്‍ വീണ്ടും വന്നപ്പോള ": ["തലയോടിടം", "കുശവന്റെ പറമ്പ്", "വിശുദ്ധനഗരം", "രക്തത്തിന്റെ പറമ്പ്"], "optionAnswer": 0, "refs": ["27:33"], "evidence": [{"ref": "27:33", "text": "തലയോടിടം എന്നര്‍ഥമുള്ള ഗോല്‍ഗോഥായിലെത്തിയപ്പോള്‍"}], "id": 40}, {"type": "match", "q": "സംഭവവും സ്ഥലവും യോജിപ്പിക്കുക.", "rows": [["സുഗന്ധതൈലം ഒഴിച്ച സംഭവം", "കുഷ്ഠരോഗിയായ ശിമയോന്റെ ഭവനം"], ["വധിക്കാൻ ആലോചിച്ച സമ്മേളനം", "കയ്യാഫാസിന്റെ കൊട്ടാരം"], ["പ്രാർഥിക്കുവോളം ഇരിക്കാൻ നിർദേശം", "ഗത്സേമനി"], ["പടയാളികൾ സൈന്യവിഭാഗത്തെ അണിനിരത്തി", "പ്രത്തോറിയം"]], "refs": ["26:6", "26:3", "26:4", "26:36", "27:27"], "id": 41, "evidence": [{"ref": "26:6", "text": "യേശു ബഥാനിയായില്‍ കുഷ്ഠരോഗിയായ ശിമയോന്റെ ഭവനത്തില്‍ ഇരിക്കുമ്പോള്‍,"}, {"ref": "26:3", "text": "പ്രധാനപുരോഹിതന്‍മാരും ജനപ്രമാണികളും കയ്യാഫാസ് എന്നു പേരായ പ്രധാനാചാര്യന്റെ കൊട്ടാരത്തില്‍ സമ്മേളിച്ച്,"}, {"ref": "26:4", "text": "യേശുവിനെ ചതിവില്‍ പിടികൂടി വധിക്കേണ്ടതെങ്ങനെയെന്ന് ആലോചിച്ചു."}, {"ref": "26:36", "text": "അനന്തരം യേശു അവരോടൊത്ത് ഗത്‌സേമനി എന്ന സ്ഥലത്തെത്തി. അവന്‍ ശിഷ്യന്‍മാരോടു പറഞ്ഞു: ഞാന്‍ പോയി പ്രാര്‍ഥിക്കുവോളം നിങ്ങള്‍ ഇവിടെ ഇരിക്കുക."}, {"ref": "27:27", "text": "അനന്തരം, ദേശാധിപതിയുടെ പടയാളികള്‍ യേശുവിനെ പ്രത്തോറിയത്തിലേക്കുകൊണ്ടു പോയി, സൈന്യവിഭാഗത്തെ മുഴുവന്‍ അവനെതിരേ അണിനിരത്തി,"}]}, {"type": "match", "q": "കുരിശിനടുത്തുള്ള വിശദാംശങ്ങളും അനുബന്ധവും യോജിപ്പിക്കുക.", "rows": [["കുരിശു ചുമക്കാൻ നിർബന്ധിക്കപ്പെട്ടവൻ", "കിറേനേക്കാരനായ ശിമയോൻ"], ["ശിരസ്സിനു മുകളിൽ എഴുതിയത്", "യഹൂദരുടെ രാജാവായ യേശു"], ["വിനാഗിരി കൊടുക്കാൻ നീർപ്പഞ്ഞി ചുറ്റിയത്", "ഞാങ്ങണ"], ["സ്ത്രീകളുടെ പട്ടികയിലെ അമ്മയുടെ മക്കൾ", "യാക്കോബും ജോസഫും"]], "refs": ["27:32", "27:37", "27:48", "27:56"], "id": 42, "evidence": [{"ref": "27:32", "text": "അവര്‍ പോകുന്നവഴി ശിമയോന്‍ എന്ന ഒരു കിറേനേക്കാരനെ കണ്ടുമുട്ടി. യേശുവിന്റെ കുരിശു ചുമക്കാന്‍ അവര്‍ അവനെ നിര്‍ബന്ധിച്ചു."}, {"ref": "27:37", "text": "ഇവന്‍ യഹൂദരുടെ രാജാവായ യേശുവാണ് എന്ന ആരോപണം അവര്‍ അവന്റെ ശിരസ്‌സിനു മുകളില്‍ എഴുതിവച്ചു."}, {"ref": "27:48", "text": "ഉടനെ അവരില്‍ ഒരാള്‍ ഓടിച്ചെന്ന് നീര്‍പ്പഞ്ഞിയെടുത്തു വിനാഗിരിയില്‍ മുക്കി, ഒരു ഞാങ്ങണമേല്‍ ചുറ്റി അവനു കുടിക്കാന്‍ കൊടുത്തു."}, {"ref": "27:56", "text": "അക്കൂട്ടത്തില്‍ മഗ്ദലേനമറിയവും യാക്കോബിന്റെയും ജോസഫിന്റെയും അമ്മയായ മറിയവും സെബദീപുത്രന്‍മാരുടെ അമ്മയും ഉണ്ടായിരുന്നു."}]}, {"type": "match", "q": "പീഡാനുഭവവിവരണത്തിലെ പ്രവൃത്തിയും അതിന്റെ അനുബന്ധവും യോജിപ്പിക്കുക.", "rows": [["പ്രധാനപുരോഹിതൻ കീറിയത്", "മേലങ്കി"], ["പടയാളികൾ യേശുവിന്റെ വലത്തുകൈയിൽ കൊടുത്തത്", "ഞാങ്ങണ"], ["കുരിശിൽ തറച്ചശേഷം കുറിയിട്ടു ഭാഗിച്ചത്", "വസ്ത്രങ്ങൾ"], ["കാവൽക്കാർ മുദ്രവച്ചത്", "കല്ല്"]], "refs": ["26:65", "27:29", "27:35", "27:66"], "evidence": [{"ref": "26:65", "text": "അപ്പോള്‍ പ്രധാന പുരോഹിതന്‍ മേലങ്കി കീറിക്കൊണ്ടു പറഞ്ഞു: ഇവന്‍ ദൈവദൂഷണം പറഞ്ഞിരിക്കുന്നു. ഇനി സാക്ഷികളെക്കൊണ്ടു നമുക്കെന്താവശ്യം? ഇതാ, ദൈവദൂഷണം നിങ്ങള്‍ ഇപ്പോള്‍ കേട്ടുവല്ലോ!"}, {"ref": "27:29", "text": "ഒരു മുള്‍ക്കിരീടം മെടഞ്ഞ് അവന്റെ ശിരസ്‌സില്‍ വച്ചു. വലത്തു കൈയില്‍ ഒരു ഞാങ്ങണയും കൊടുത്തു. അവന്റെ മുമ്പില്‍ മുട്ടുകുത്തിക്കൊണ്ട്, യഹൂദരുടെ രാജാവേ, സ്വസ്തി! എന്നു പറഞ്ഞ് അവര്‍ അവനെ പരിഹസിച്ചു."}, {"ref": "27:35", "text": "അവനെ കുരിശില്‍ തറച്ചതിനുശേഷം അവര്‍ അവന്റെ വസ്ത്രങ്ങള്‍ കുറിയിട്ടു ഭാഗിച്ചെടുത്തു."}, {"ref": "27:66", "text": "അവര്‍പോയി കല്ലിനു മുദ്രവച്ച്, കാവല്‍ക്കാരെ നിര്‍ത്തി കല്ലറ ഭദ്രമാക്കി."}], "id": 43}, {"type": "match", "q": "സംഭവവും രേഖപ്പെടുത്തിയ സമയസൂചനയും യോജിപ്പിക്കുക.", "rows": [["പീലാത്തോസിന് ഏൽപിക്കാൻ ആലോചന", "പ്രഭാതമായപ്പോൾ"], ["ഭൂമിയിലെങ്ങും അന്ധകാരം", "ആറാം മണിക്കൂർ മുതൽ ഒമ്പതാം മണിക്കൂർവരെ"], ["അരിമത്തെയാക്കാരൻ ജോസഫ് എത്തി", "വൈകുന്നേരമായപ്പോൾ"], ["പീലാത്തോസിനോട് കാവൽ ആവശ്യപ്പെട്ടു", "ഒരുക്കദിനത്തിന്റെ പിറ്റേന്ന്"]], "refs": ["27:1", "27:2", "27:45", "27:57", "27:62"], "evidence": [{"ref": "27:1", "text": "പ്രഭാതമായപ്പോള്‍ പ്രധാന പുരോഹിതന്‍മാരും ജനപ്രമാണികളും യേശുവിനെ വധിക്കേണ്ടതിന് അവനെതിരേ ആലോചന നടത്തി."}, {"ref": "27:2", "text": "അവര്‍ അവനെ ബന്ധിച്ചുകൊണ്ടുപോയി ദേശാധിപതിയായ പീലാത്തോസിനെ ഏല്‍പിച്ചു."}, {"ref": "27:45", "text": "ആറാം മണിക്കൂര്‍ മുതല്‍ ഒമ്പതാം മണിക്കൂര്‍വരെ ഭൂമിയിലെങ്ങും അന്ധകാരം വ്യാപിച്ചു."}, {"ref": "27:57", "text": "വൈകുന്നേരമായപ്പോള്‍, അരിമത്തെയാക്കാരന്‍ ജോസഫ് എന്ന ധനികന്‍ അവിടെയെത്തി. അവനും യേശുവിനു ശിഷ്യപ്പെട്ടിരുന്നു."}, {"ref": "27:62", "text": "പിറ്റേദിവസം, അതായത്, ഒരുക്കദിനത്തിന്റെ പിറ്റേന്ന്, പ്രധാന പുരോഹിതന്‍മാരും ഫരിസേയരും പീലാത്തോസിന്റെ അടുക്കല്‍ ഒരുമിച്ചു കൂടി."}], "id": 44}, {"type": "tf", "q": "സേവകന്റെ ചെവി ഛേദിച്ചവന്റെ പേര് മത്തായി 26-ൽ ഈ സംഭവവിവരണത്തിൽ വ്യക്തമാക്കുന്നു.", "answer": false, "refs": ["26:51"], "id": 45, "evidence": [{"ref": "26:51", "text": "യേശുവിനോടുകൂടെ ഉണ്ടായിരുന്നവരില്‍ ഒരുവന്‍ കൈനീട്ടി, വാള്‍ ഊരി പ്രധാന പുരോഹിതന്റെ സേവകനെ വെട്ടി, അവന്റെ ചെവി ഛേദിച്ചുകളഞ്ഞു."}]}, {"type": "tf", "q": "ദേവാലയത്തിലെ തിരശ്ശീല താഴെമുതൽ മുകൾവരെ കീറി എന്നാണ് പറയുന്നത്.", "answer": false, "refs": ["27:51"], "id": 46, "evidence": [{"ref": "27:51", "text": "അപ്പോള്‍ ദേവാലയത്തിലെ തിരശ്ശീല മുകള്‍മുതല്‍ താഴെവരെ രണ്ടായി കീറി; ഭൂമി കുലുങ്ങി; പാറകള്‍ പിളര്‍ന്നു; ശവകുടീരങ്ങള്‍ തുറക്കപ്പെട്ടു."}]}, {"type": "tf", "q": "യേശുവിനെ സംസ്കരിച്ച കല്ലറ പാറയിൽ വെട്ടിയുണ്ടാക്കിയ ജോസഫിന്റെ പുതിയ കല്ലറയായിരുന്നു.", "answer": true, "refs": ["27:60"], "id": 47, "evidence": [{"ref": "27:60", "text": "പാറയില്‍വെട്ടിയുണ്ടാക്കിയ തന്റെ പുതിയ കല്ലറയില്‍ സംസ്‌കരിച്ചു. കല്ലറയുടെ വാതില്‍ക്കല്‍ ഒരു വലിയ കല്ലുരുട്ടിവച്ചിട്ട് അവന്‍ പോയി."}]}, {"type": "tf", "q": "പത്രോസിനൊപ്പം മറ്റെല്ലാ ശിഷ്യന്മാരും യേശുവിനെ നിഷേധിക്കുകയില്ലെന്നു പറഞ്ഞു.", "answer": true, "refs": ["26:35"], "evidence": [{"ref": "26:35", "text": "പത്രോസ് പറഞ്ഞു: നിന്നോടുകൂടെ മരിക്കേണ്ടിവന്നാല്‍പ്പോലും ഞാന്‍ നിന്നെ നിഷേധിക്കുകയില്ല. ഇങ്ങനെതന്നെ മറ്റെല്ലാ ശിഷ്യന്‍മാരും പറഞ്ഞു."}], "id": 48}, {"type": "tf", "q": "യേശുവിനൊപ്പം ക്രൂശിക്കപ്പെട്ട കവർച്ചക്കാർ അവനെ പരിഹസിച്ചതായി മത്തായി രേഖപ്പെടുത്തുന്നില്ല.", "answer": false, "refs": ["27:44"], "evidence": [{"ref": "27:44", "text": "അവനോടൊപ്പം ക്രൂശിക്കപ്പെട്ട കവര്‍ച്ചക്കാരും ഇപ്രകാരം തന്നെ അവനെ പരിഹസിച്ചു."}], "id": 49}, {"type": "tf", "q": "ഗലീലിയിൽനിന്ന് അനുഗമിച്ച സ്ത്രീകൾ അകലെനിന്നാണ് സംഭവങ്ങൾ നോക്കിനിന്നത്.", "answer": true, "refs": ["27:55"], "evidence": [{"ref": "27:55", "text": "ഗലീലിയില്‍നിന്ന് യേശുവിനെ അനുഗമിച്ചവരും അവനു ശുശ്രൂഷ ചെയ്തിരുന്നവരുമായ അനേകം സ്ത്രീകള്‍ അകലെ ഇക്കാര്യങ്ങള്‍ നോക്കിക്കൊണ്ടു നിന്നിരുന്നു."}], "id": 50}]};

const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.normalize('NFC').trim().replace(/\s+/g,' ').replace(/\u200c|\u200d/g,'').replace(/ണ്/g,'ൺ').replace(/ന്/g,'ൻ').replace(/ര്/g,'ർ').replace(/ല്/g,'ൽ').replace(/ള്/g,'ൾ').replace(/ക്/g,'ൿ');
const labels={mc:'ശരിയായത് തിരഞ്ഞെടുക്കുക',fill:'വിട്ടുപോയ ഭാഗത്തിന് ശരിയായത് തിരഞ്ഞെടുക്കുക',match:'കൂട്ടിയിണക്കുക',tf:'ശരിയോ തെറ്റോ?'};
function right(q){return q.type==='mc'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.type==='tf'?(q.answer?'ശരി':'തെറ്റ്'):q.type==='match'?q.rows.map(r=>r[0]+' → '+r[1]).join('\n'):q.answer;}
function userText(q,a){return q.type==='mc'?String.fromCharCode(65+a)+'. '+q.options[a]:q.type==='tf'?(a?'ശരി':'തെറ്റ്'):q.type==='match'?q.rows.map((r,i)=>r[0]+' → '+q.rows[a[i]][1]).join('\n'):q.type==='fill'?q.options[a]:a;}
function saveDraft(){const q=quiz.questions[current];if(responses[current])return;drafts[current]=q.type==='match'?q.rows.map((_,i)=>$('match-'+i).value):document.querySelector('input[name="answer"]:checked')?.value??null;}
function answerSelected(){if(responses[current])return;saveDraft();const q=quiz.questions[current],a=drafts[current];if(q.type==='match'){const selected=a.filter(x=>x!=='').length;$('notice').textContent=selected<q.rows.length?`കൂട്ടിയിണക്കിയത്: ${selected} / ${q.rows.length}`:'';if(selected!==q.rows.length)return;}if(a!==null)check();}
function render(){const q=quiz.questions[current],r=responses[current],a=drafts[current];const count=responses.filter(Boolean).length,score=responses.filter(x=>x?.correct).length;
$('position').textContent=`ചോദ്യം ${current+1} / ${total}`;$('score').textContent=`നിങ്ങളുടെ സ്കോർ: ${score} / ${total}`;$('remaining').textContent=`ബാക്കി: ${total-count}`;$('progress').max=total;$('progress').value=count;$('checked-count').textContent=`പരിശോധിച്ചത്: ${count} / ${total}`;
$('question-jump').innerHTML=quiz.questions.map((item,i)=>{const response=responses[i],state=response?(response.correct?'ശരിയായ ഉത്തരം':'തെറ്റായ ഉത്തരം'):'പരിശോധിച്ചിട്ടില്ല';return `<button type="button" data-jump="${i}" class="${response?(response.correct?'done-correct':'done-wrong'):''}" ${i===current?'aria-current="step"':''} aria-label="ചോദ്യം ${i+1}, ${state}">${i+1}${response?(response.correct?' ✓':' ✕'):''}</button>`;}).join('');$('question-jump').querySelectorAll('button').forEach(button=>button.onclick=()=>jumpTo(Number(button.dataset.jump)));
$('type').textContent=labels[q.type];$('question-title').textContent=`${current+1}. ${q.q}`;$('notice').textContent='';
if(q.type==='mc'||q.type==='fill'||q.type==='tf'){const opts=q.type==='tf'?['ശരി','തെറ്റ്']:q.options;$('controls').innerHTML='<fieldset style="border:0;padding:0;margin:0"><legend>നിങ്ങളുടെ ഉത്തരം തിരഞ്ഞെടുക്കുക</legend>'+opts.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${String(a)===String(i)?'checked':''} ${r?'disabled':''}><span>${q.type!=='tf'?String.fromCharCode(65+i)+'. ':''}${esc(o)}</span></label>`).join('')+'</fieldset>';
}else{const order=q.rows.map((_,i)=>i).sort((x,y)=>((x*3+1)%q.rows.length)-((y*3+1)%q.rows.length));if(order.every((x,i)=>x===i))order.reverse();$('controls').innerHTML=q.rows.map((row,i)=>`<div class="match-row"><label for="match-${i}">${i+1}. ${esc(row[0])}</label><select id="match-${i}" ${r?'disabled':''}><option value="">തിരഞ്ഞെടുക്കുക</option>${order.map(j=>`<option value="${j}" ${a&&String(a[i])===String(j)?'selected':''}>${esc(q.rows[j][1])}</option>`).join('')}</select></div>`).join('');}
$('feedback').innerHTML=r?feedback(q,r):'';$('prev').disabled=current===0;$('next').disabled=current===total-1;$('controls').querySelectorAll('input,select').forEach(control=>{control.oninput=answerSelected;control.onchange=answerSelected;if(q.type==='match')control.onblur=answerSelected;});
if(count===total)showResults();else{$('results').hidden=true;$('results').innerHTML='';}}
function feedback(q,r){const parts=q.type==='match'?'<div>'+q.rows.map((row,i)=>`<p>${i+1}. ${esc(row[0])}: ${r.value[i]===i?'ശരിയാണ്':'തെറ്റാണ്'}</p>`).join('')+'</div>':'';
return `<div tabindex="-1" class="feedback ${r.correct?'':'wrong'}"><div class="feedback-heading"><span class="status-icon" aria-hidden="true">${r.correct?'✓':'✕'}</span><strong>${r.correct?'ശരിയാണ് — 1 മാർക്ക്':'തെറ്റാണ് — 0 മാർക്ക്'}</strong></div>${parts}<p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,r.value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div><details><summary>വചനാധാരം കാണുക</summary>${q.evidence.map(e=>`<div class="evidence"><strong>${esc(e.label||'മത്തായി '+e.ref)}</strong><p>${esc(e.text)}</p></div>`).join('')}</details></div>`;}
function check(){if(responses[current])return;saveDraft();const q=quiz.questions[current],a=drafts[current];if(a===null||(q.type==='match'&&a.some(x=>x===''))){$('notice').textContent=q.type==='match'?'എല്ലാ കൂട്ടുകളും തിരഞ്ഞെടുക്കുക.':'ആദ്യം നിങ്ങളുടെ ഉത്തരം നൽകുക.';return;}
let value,correct;if(q.type==='mc'){value=Number(a);correct=value===q.answer;}else if(q.type==='tf'){value=a==='0';correct=value===q.answer;}else if(q.type==='fill'){value=Number(a);correct=value===q.optionAnswer;}else{value=a.map(Number);correct=value.every((x,i)=>x===i);}
responses[current]={value,correct};render();const target=$('feedback').firstElementChild;requestAnimationFrame(()=>{if(!target.isConnected)return;target.focus({preventScroll:true});target.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});target.classList.add(correct?'celebrate':'try-again');});}
function showResults(){const n=responses.filter(x=>x.correct).length;$('results').hidden=false;$('results').innerHTML=`<h2 id="results-title">ക്വിസ് പൂർത്തിയായി</h2><p><strong>നിങ്ങളുടെ സ്കോർ: ${n} / ${total}</strong></p><p>ശരിയായ ഉത്തരങ്ങൾ: ${n}<br>തെറ്റായ ഉത്തരങ്ങൾ: ${total-n}<br>ശതമാനം: ${Math.round(n/total*100)}%</p><h3>ഉത്തരങ്ങൾ പരിശോധിക്കാം</h3>`+quiz.questions.map((q,i)=>`<div class="review"><h3>${i+1}. ${esc(q.q)}</h3><p>${responses[i].correct?'ശരിയാണ്':'തെറ്റാണ്'}</p><p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,responses[i].value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div></div>`).join('');}
function jumpTo(index){if(!Number.isInteger(index)||index<0||index>=total)return;saveDraft();current=index;render();$('question-title').focus({preventScroll:true});$('question-panel').scrollIntoView({block:'start'});}function move(step){jumpTo(current+step);}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reset').onclick=()=>{current=0;responses=quiz.questions.map(()=>null);drafts=quiz.questions.map(()=>null);render();$('question-title').focus();window.scrollTo(0,0);};render();
</script></body></html>
