'use strict';
const quiz={"range": "21-23", "title": "ജറുസലെമിലെ യേശുവും മതനേതാക്കളുമായുള്ള ഏറ്റുമുട്ടലും", "questions": [{"type": "mc", "q": "രണ്ടു ശിഷ്യന്മാരെ അയച്ചപ്പോൾ യേശു എത്തിയിരുന്നത് എവിടെ?", "options": ["ഗലീലിയിലെ നസറത്ത്", "ജറുസലെമിനുള്ളിലെ ദേവാലയം", "ഒലിവുമലയ്ക്കരികെയുള്ള ബഥ്ഫഗെ", "ബഥാനിയായിലെ ഭവനം"], "answer": 2, "refs": ["21:1"], "id": 1, "evidence": [{"ref": "21:1", "text": "അവര്‍ ജറുസലെമിനെ സമീപിക്കവേ, ഒലിവുമലയ്ക്കരികെയുള്ള ബഥ്ഫഗെയിലെത്തി. അപ്പോള്‍ യേശു തന്റെ രണ്ടു ശിഷ്യന്‍മാരെ ഇപ്രകാരം നിര്‍ദേശിച്ചയച്ചു:"}]}, {"type": "mc", "q": "തട്ടിമറിച്ച മേശകളും ഇരിപ്പിടങ്ങളും യഥാക്രമം ആരുടേതായിരുന്നു?", "options": ["നാണയമാറ്റക്കാരുടേത്; പ്രാവുവിൽപനക്കാരുടേത്", "പ്രാവുവിൽപനക്കാരുടേത്; നാണയമാറ്റക്കാരുടേത്", "നാണയമാറ്റക്കാരുടേത്; കൃഷിക്കാരുടേത്", "കൃഷിക്കാരുടേത്; നാണയമാറ്റക്കാരുടേത്"], "answer": 0, "refs": ["21:12"], "id": 2, "evidence": [{"ref": "21:12", "text": "യേശു ദേവാലയത്തില്‍ പ്രവേശിച്ച് അവിടെ ക്രയവിക്രയം ചെയ്തുകൊണ്ടിരുന്നവരെയെല്ലാം പുറത്താക്കി. നാണയമാറ്റക്കാരുടെ മേശകളും പ്രാവുവില്‍പനക്കാരുടെ ഇരിപ്പിടങ്ങളും അവന്‍ തട്ടിമറിച്ചിട്ടു."}]}, {"type": "mc", "q": "ബഥാനിയായിൽ താമസിച്ചതിനു ശേഷം പ്രഭാതത്തിൽ എങ്ങോട്ടു പോകുമ്പോഴാണ് വിശന്നത്?", "options": ["ബഥ്ഫഗെയിലേക്ക്", "ഒലിവുമലയിലേക്ക്", "ഗലീലിയിലേക്ക്", "നഗരത്തിലേക്ക്"], "answer": 3, "refs": ["21:17", "21:18"], "id": 3, "evidence": [{"ref": "21:17", "text": "അനന്തരം അവന്‍ അവരെ വിട്ട് നഗരത്തില്‍നിന്ന് ബഥാനിയായിലേക്കു പോയി അവിടെ താമസിച്ചു."}, {"ref": "21:18", "text": "പ്രഭാതത്തില്‍ നഗരത്തിലേക്കു പോകുമ്പോള്‍ അവനു വിശന്നു."}]}, {"type": "mc", "q": "യോഹന്നാന്റെ ജ്ഞാനസ്നാനം മനുഷ്യരിൽനിന്നാണെന്നു പറയാൻ അവർ മടിച്ചതെന്തുകൊണ്ട്?", "options": ["ജനക്കൂട്ടത്തെ ഭയപ്പെട്ടതിനാൽ", "ദേശാധിപതിയെ ഭയപ്പെട്ടതിനാൽ", "സദുക്കായരെ ഭയപ്പെട്ടതിനാൽ", "യേശുവിനെ ഭയപ്പെട്ടതിനാൽ"], "answer": 0, "refs": ["21:26"], "id": 4, "evidence": [{"ref": "21:26", "text": "മനുഷ്യരില്‍നിന്ന് എന്നു പറഞ്ഞാലോ! നാം ജനക്കൂട്ടത്തെ ഭയപ്പെടുന്നു. എന്തെന്നാല്‍, എല്ലാവരും യോഹന്നാനെ ഒരു പ്രവാചകനായി പരിഗണിക്കുന്നു."}]}, {"type": "mc", "q": "രണ്ടു പുത്രന്മാരുടെ ഉപമയിൽ POC രേഖപ്പെടുത്തുന്ന ക്രമം?", "options": ["ഒന്നാമൻ പോകാമെന്നു പറഞ്ഞു പോയി; രണ്ടാമൻ നിരസിച്ചു പോയില്ല", "ഒന്നാമൻ നിരസിച്ചു പിന്നെ പോയി; രണ്ടാമൻ പോകാമെന്നു പറഞ്ഞു പോയില്ല", "ഒന്നാമൻ നിരസിച്ചു പോയില്ല; രണ്ടാമൻ പോകാമെന്നു പറഞ്ഞു പോയി", "ഒന്നാമൻ പോകാമെന്നു പറഞ്ഞു പോയില്ല; രണ്ടാമൻ നിരസിച്ചു പിന്നെ പോയി"], "answer": 3, "refs": ["21:29", "21:30"], "id": 5, "evidence": [{"ref": "21:29", "text": "ഞാന്‍ പോകാം എന്ന് അവന്‍ പറഞ്ഞു; എങ്കിലും പോയില്ല."}, {"ref": "21:30", "text": "അവന്‍ രണ്ടാമന്റെ അടുത്തുചെന്ന് ഇതുതന്നെ പറഞ്ഞു. അവനാകട്ടെ, എനിക്കു മനസ്‌സില്ല എന്നു പറഞ്ഞു; എങ്കിലും പിന്നീടു പശ്ചാത്തപിച്ച് അവന്‍ പോയി."}]}, {"type": "mc", "q": "മുന്തിരിത്തോട്ടം ഏൽപിക്കുന്നതിനു മുമ്പുള്ള നിർമാണങ്ങളുടെ ക്രമം?", "options": ["വേലി → ഗോപുരം → മുന്തിരിച്ചക്ക്", "ഗോപുരം → വേലി → മുന്തിരിച്ചക്ക്", "മുന്തിരിച്ചക്ക് → ഗോപുരം → വേലി", "വേലി → മുന്തിരിച്ചക്ക് → ഗോപുരം"], "answer": 3, "refs": ["21:33"], "id": 6, "evidence": [{"ref": "21:33", "text": "മറ്റൊരു ഉപമ കേട്ടുകൊള്ളുക. ഒരു വീട്ടുടമസ്ഥന്‍ ഒരു മുന്തിരിത്തോട്ടം നട്ടുപിടിപ്പിച്ചു. അതിനുചുറ്റും വേലികെട്ടി. അതില്‍ ഒരു മുന്തിരിച്ചക്കു സ്ഥാപിക്കുകയും ഗോപുരം നിര്‍മിക്കുകയും ചെയ്തു. അനന്തരം അതു കൃഷിക്കാരെ ഏല്‍പിച്ചിട്ട് അവന്‍ പോയി."}]}, {"type": "mc", "q": "അവകാശിയായ പുത്രനെ കൃഷിക്കാർ എവിടെവച്ചാണ് കൊന്നത്?", "options": ["മുന്തിരിത്തോട്ടത്തിന്റെ ഗോപുരത്തിൽ", "മുന്തിരിച്ചക്കിന്റെ സമീപത്ത്", "മുന്തിരിത്തോട്ടത്തിനു വെളിയിൽ", "മുന്തിരിത്തോട്ടത്തിനുള്ളിൽ"], "answer": 2, "refs": ["21:39"], "id": 7, "evidence": [{"ref": "21:39", "text": "അവര്‍ അവനെ പിടിച്ച് മുന്തിരിത്തോട്ടത്തിനു വെളിയിലേക്കെറിഞ്ഞുകൊന്നുകളഞ്ഞു."}]}, {"type": "mc", "q": "വിവാഹവിരുന്ന് വകവയ്ക്കാതെ പോയ രണ്ടുപേരുടെ ലക്ഷ്യങ്ങൾ?", "options": ["ദേവാലയവും സിനഗോഗും", "വയലും വ്യാപാരവും", "വയലും സിനഗോഗും", "വ്യാപാരവും ദേവാലയവും"], "answer": 1, "refs": ["22:5"], "id": 8, "evidence": [{"ref": "22:5", "text": "എന്നാല്‍, ക്ഷണിക്കപ്പെട്ടവര്‍ അതു വകവയ്ക്കാതെ ഒരുവന്‍ വയലിലേക്കും, വേറൊരുവന്‍ വ്യാപാരത്തിനും പൊയ്ക്കളഞ്ഞു."}]}, {"type": "mc", "q": "സദുക്കായരുടെ തെറ്റിന് കാരണം മനസ്സിലാക്കാത്ത രണ്ടു കാര്യങ്ങൾ?", "options": ["വിശുദ്ധലിഖിതങ്ങളും ദൈവത്തിന്റെ ശക്തിയും", "പുനരുത്ഥാനവും ന്യായവിധിയും", "ദൈവരാജ്യവും ദൈവത്തിന്റെ അധികാരവും", "നിയമവും പ്രവാചകന്മാരും"], "answer": 0, "refs": ["22:29"], "id": 9, "evidence": [{"ref": "22:29", "text": "യേശു മറുപടി പറഞ്ഞു: വിശുദ്ധലിഖിതങ്ങളോ ദൈവത്തിന്റെ ശക്തിയോ മനസ്‌സിലാക്കാത്തതിനാല്‍ നിങ്ങള്‍ക്കു തെറ്റുപറ്റിയിരിക്കുന്നു."}]}, {"type": "mc", "q": "അതിപ്രധാന കൽപനയെക്കുറിച്ച് പരീക്ഷിക്കാൻ ചോദിച്ചത് ആരാണ്?", "options": ["ഒരു സദുക്കായൻ", "ഒരു നിയമപണ്ഡിതൻ", "ഒരു പ്രധാനപുരോഹിതൻ", "ഒരു ജനപ്രമാണി"], "answer": 1, "refs": ["22:35"], "id": 10, "evidence": [{"ref": "22:35", "text": "അവരില്‍ ഒരു നിയമപണ്ഡിതന്‍ അവനെ പരീക്ഷിക്കാന്‍ ചോദിച്ചു:"}]}, {"type": "mc", "q": "വീതിയും നീളവും കൂട്ടുന്നവ യഥാക്രമം?", "options": ["ഇരിപ്പിടങ്ങൾ; വസ്ത്രങ്ങൾ", "വസ്ത്രത്തിന്റെ തൊങ്ങലുകൾ; നെറ്റിപ്പട്ടകൾ", "നെറ്റിപ്പട്ടകൾ; വസ്ത്രത്തിന്റെ തൊങ്ങലുകൾ", "വസ്ത്രങ്ങൾ; ഇരിപ്പിടങ്ങൾ"], "answer": 2, "refs": ["23:5"], "id": 11, "evidence": [{"ref": "23:5", "text": "മറ്റുള്ളവര്‍ കാണുന്നതിനുവേണ്ടിയാണ്അവര്‍ തങ്ങളുടെ പ്രവൃത്തികളെല്ലാം ചെയ്യുന്നത്. അവര്‍ തങ്ങളുടെ നെറ്റിപ്പട്ടകള്‍ക്കു വീതിയും വസ്ത്രത്തിന്റെ തൊങ്ങലുകള്‍ക്കു നീളവും കൂട്ടുന്നു;"}]}, {"type": "mc", "q": "നിയമത്തിലെ ഗൗരവമേറിയ കാര്യങ്ങളുടെ കൃത്യമായ പട്ടിക?", "options": ["നീതി, കാരുണ്യം, വിശുദ്ധി", "നീതി, കാരുണ്യം, വിശ്വസ്തത", "നീതി, സ്നേഹം, വിശ്വസ്തത", "കാരുണ്യം, വിശ്വാസം, പ്രത്യാശ"], "answer": 1, "refs": ["23:23"], "id": 12, "evidence": [{"ref": "23:23", "text": "കപടനാട്യക്കാരായ നിയമജ്ഞരേ, ഫരിസേയരേ, നിങ്ങള്‍ക്കു ദുരിതം! നിങ്ങള്‍ തുളസി, ചതകുപ്പ, ജീരകം എന്നിവയ്ക്കു ദശാംശം കൊടുക്കുകയും നിയമത്തിലെ ഗൗരവമേറിയ കാര്യങ്ങളായ നീതി, കാരുണ്യം, വിശ്വസ്തത എന്നിവ അവഗണിക്കുകയും ചെയ്യുന്നു. ഇവയാണു നിങ്ങള്‍ ചെയ്യേണ്ടിയിരുന്നത് - മറ്റുള്ളവ അവഗണിക്കാതെതന്നെ."}]}, {"type": "mc", "q": "സഖറിയായുടെ വധസ്ഥലമായി പറയുന്ന രണ്ടു കാര്യങ്ങൾക്കിടയിലെ സ്ഥലം?", "options": ["നഗരത്തിനും ഒലിവുമലയ്ക്കും മധ്യേ", "ദേവാലയത്തിനും ബലിപീഠത്തിനും മധ്യേ", "ബലിപീഠത്തിനും സിനഗോഗിനും മധ്യേ", "ദേവാലയത്തിനും ഗോപുരത്തിനും മധ്യേ"], "answer": 1, "refs": ["23:35"], "id": 13, "evidence": [{"ref": "23:35", "text": "അങ്ങനെ, നിരപരാധനായ ആബേലിന്റെ രക്തം മുതല്‍ ദേവാലയത്തിനും ബലിപീഠത്തിനും മധ്യേ വച്ചു നിങ്ങള്‍ വധിച്ച ബറാക്കിയായുടെ പുത്രനായ സഖറിയായുടെ രക്തംവരെ, ഭൂമിയില്‍ ചൊരിയപ്പെട്ട എല്ലാ നീതിമാന്‍മാരുടെയും രക്തം നിങ്ങളുടെമേല്‍ പതിക്കും."}]}, {"type": "mc", "q": "കഴുതകളെക്കുറിച്ച് ചോദിക്കുന്നവരോട് പറയേണ്ട സന്ദേശം?", "options": ["കർത്താവിന് അവയെക്കൊണ്ട് ആവശ്യമുണ്ട്", "നഗരത്തിന് അവയെക്കൊണ്ട് ആവശ്യമുണ്ട്", "പ്രവാചകന് അവയെക്കൊണ്ട് ആവശ്യമുണ്ട്", "ശിഷ്യന്മാർക്ക് അവയെക്കൊണ്ട് ആവശ്യമുണ്ട്"], "answer": 0, "refs": ["21:3"], "evidence": [{"ref": "21:3", "text": "ആരെങ്കിലും നിങ്ങളോട് എന്തെങ്കിലുംചോദിച്ചാല്‍, കര്‍ത്താവിന് അവയെക്കൊണ്ട് ആവശ്യമുണ്ടെന്നു പറയുക, അവന്‍ ഉടനെ തന്നെ അവയെ വിട്ടുതരും."}], "id": 14}, {"type": "mc", "q": "കഴുതകളെ കൊണ്ടുവന്നശേഷം ശിഷ്യന്മാർ അവയുടെമേൽ വിരിച്ചത്?", "options": ["വസ്ത്രങ്ങൾ", "നെറ്റിപ്പട്ടകൾ", "മേലങ്കിയും ചില്ലകളും", "വൃക്ഷച്ചില്ലകൾ"], "answer": 0, "refs": ["21:7"], "evidence": [{"ref": "21:7", "text": "അവര്‍ കഴുതയെയും കഴുതക്കുട്ടിയെയുംകൊണ്ടുവന്ന് അവയുടെമേല്‍ വസ്ത്രങ്ങള്‍ വിരിച്ചു. അവന്‍ കയറി ഇരുന്നു."}], "id": 15}, {"type": "mc", "q": "വഴിയിൽ ചില്ലകൾ നിരത്തുന്നതിനു മുമ്പ് അവ എടുത്തത് എവിടെനിന്ന്?", "options": ["മുന്തിരിത്തോട്ടത്തിൽനിന്ന് പറിച്ചു", "ബഥാനിയായിൽനിന്ന് ശേഖരിച്ചു", "ദേവാലയത്തിൽനിന്ന് കൊണ്ടുവന്നു", "വൃക്ഷങ്ങളിൽനിന്ന് മുറിച്ചു"], "answer": 3, "refs": ["21:8"], "evidence": [{"ref": "21:8", "text": "ജനക്കൂട്ടത്തില്‍ വളരെപ്പേര്‍ വഴിയില്‍ തങ്ങളുടെ വസ്ത്രങ്ങള്‍ വിരിച്ചു; മറ്റു ചിലരാകട്ടെ വൃക്ഷങ്ങളില്‍ നിന്നു ചില്ലകള്‍ മുറിച്ച് വഴിയില്‍ നിരത്തി."}], "id": 16}, {"type": "mc", "q": "നഗരത്തിന്റെ «ആരാണിവൻ?» എന്ന ചോദ്യത്തിനു മറുപടി നൽകിയത്?", "options": ["ശിഷ്യന്മാർ", "നിയമജ്ഞർ", "ജനക്കൂട്ടം", "കുട്ടികൾ"], "answer": 2, "refs": ["21:10", "21:11"], "evidence": [{"ref": "21:10", "text": "അവന്‍ ജറുസലെമില്‍ പ്രവേശിച്ചപ്പോള്‍ നഗരം മുഴുവന്‍ ഇളകിവശായി, ആരാണിവന്‍ എന്നു ചോദിച്ചു."}, {"ref": "21:11", "text": "ജനക്കൂട്ടം പറഞ്ഞു: ഇവന്‍ ഗലീലിയിലെ നസറത്തില്‍ നിന്നുള്ള പ്രവാചകനായ യേശുവാണ്."}], "id": 17}, {"type": "mc", "q": "കുട്ടികളുടെ ആർപ്പുവിളിയും വിസ്മയകരമായ പ്രവൃത്തികളും കണ്ട് രോഷാകുലരായവർ?", "options": ["പ്രധാനപുരോഹിതന്മാരും നിയമജ്ഞരും", "നിയമജ്ഞരും ജനപ്രമാണികളും", "പ്രധാനപുരോഹിതന്മാരും ജനപ്രമാണികളും", "ഫരിസേയരും സദുക്കായരും"], "answer": 0, "refs": ["21:15"], "evidence": [{"ref": "21:15", "text": "അവന്‍ ചെയ്ത വിസ്മയകരമായ പ്രവൃത്തികളെയും ദാവീദിന്റെ പുത്രനു ഹോസാന എന്ന് ഉദ്‌ഘോഷിച്ച് ദേവാലയത്തില്‍ ആര്‍പ്പുവിളിക്കുന്ന കുട്ടികളെയും കണ്ടപ്പോള്‍ പ്രധാനപുരോഹിതന്‍മാരും നിയമജ്ഞരും രോഷാകുലരായി."}], "id": 18}, {"type": "mc", "q": "അത്തിവൃക്ഷത്തിൽ യേശു കണ്ടതായി രേഖപ്പെടുത്തുന്നത്?", "options": ["തളിരുകളല്ലാതെ ഒന്നും കണ്ടില്ല", "ഇലകളല്ലാതെ ഒന്നും കണ്ടില്ല", "പഴങ്ങളല്ലാതെ ഒന്നും കണ്ടില്ല", "ഉണങ്ങിയ കൊമ്പുകളല്ലാതെ ഒന്നും കണ്ടില്ല"], "answer": 1, "refs": ["21:19"], "evidence": [{"ref": "21:19", "text": "വഴിയരികില്‍ ഒരു അത്തിവൃക്ഷം കണ്ട് അവന്‍ അതിന്റെ അടുത്തെത്തി. എന്നാല്‍, അതില്‍ ഇലകളല്ലാതെ ഒന്നും കണ്ടില്ല. അവന്‍ അതിനോടു പറഞ്ഞു: ഇനി ഒരിക്കലും നിന്നില്‍ ഫലങ്ങളുണ്ടാകാതിരിക്കട്ടെ. ആ നിമിഷം തന്നെ ആ അത്തിവൃക്ഷം ഉണങ്ങിപ്പോയി."}], "id": 19}, {"type": "mc", "q": "ആദ്യമായി അയച്ച ഭൃത്യന്മാരോടുള്ള മൂന്നു പ്രവൃത്തികളുടെ ക്രമം?", "options": ["കല്ലെറിയുക → കൊല്ലുക → അടിക്കുക", "കൊല്ലുക → അടിക്കുക → കല്ലെറിയുക", "അടിക്കുക → കൊല്ലുക → കല്ലെറിയുക", "അടിക്കുക → കല്ലെറിയുക → കൊല്ലുക"], "answer": 2, "refs": ["21:35"], "evidence": [{"ref": "21:35", "text": "എന്നാല്‍, കൃഷിക്കാര്‍ ഭൃത്യന്‍മാരില്‍ ഒരുവനെ പിടിച്ച് അടിക്കുകയും മറ്റൊരുവനെ കൊല്ലുകയും വേറൊരുവനെ കല്ലെറിയുകയും ചെയ്തു."}], "id": 20}, {"type": "mc", "q": "വിവാഹവിരുന്ന് ഒരുക്കിയത് രാജാവ് ആരെപ്രതി?", "options": ["തന്റെ ഭൃത്യനെപ്രതി", "തന്റെ സഹോദരനെപ്രതി", "തന്റെ പുത്രനെപ്രതി", "തന്റെ അവകാശിയെ സ്വീകരിച്ചവരെപ്രതി"], "answer": 2, "refs": ["22:2"], "evidence": [{"ref": "22:2", "text": "സ്വര്‍ഗരാജ്യം, തന്റെ പുത്രനുവേണ്ടി വിവാഹവിരുന്നൊരുക്കിയരാജാവിനു സദൃശം."}], "id": 21}, {"type": "mc", "q": "കൊലപാതകികളെ നശിപ്പിച്ചശേഷം സൈന്യം അവരുടെ നഗരത്തോട് ചെയ്തത്?", "options": ["പുറത്തെ അന്ധകാരത്തിലാക്കി", "വിരുന്നിനു തുറന്നുകൊടുത്തു", "കൃഷിക്കാരെ ഏൽപിച്ചു", "അഗ്നിക്കിരയാക്കി"], "answer": 3, "refs": ["22:7"], "evidence": [{"ref": "22:7", "text": "രാജാവു ക്രുദ്ധനായി, സൈന്യത്തെ അയച്ച് ആ കൊലപാതകികളെ നശിപ്പിച്ചു; അവരുടെ നഗരം അഗ്‌നിക്കിരയാക്കി."}], "id": 22}, {"type": "mc", "q": "പുനരുത്ഥാനത്തിൽ വിവാഹം സംബന്ധിച്ച നിഷേധത്തിന്റെ രണ്ടു ഭാഗങ്ങൾ?", "options": ["വിവാഹം ചെയ്യുകയോ ചെയ്തുകൊടുക്കുകയോ ഇല്ല", "വിവാഹം ആഗ്രഹിക്കുകയോ ഉപേക്ഷിക്കുകയോ ഇല്ല", "വിവാഹം ചോദിക്കുകയോ അനുവദിക്കുകയോ ഇല്ല", "വിവാഹം ചെയ്യുകയോ ഉപേക്ഷിക്കുകയോ ഇല്ല"], "answer": 0, "refs": ["22:30"], "evidence": [{"ref": "22:30", "text": "പുനരുത്ഥാനത്തില്‍ അവര്‍ വിവാഹം ചെയ്യുകയോ ചെയ്തുകൊടുക്കുകയോ ഇല്ല. പിന്നെയോ, അവര്‍ സ്വര്‍ഗദൂതന്‍മാരെപ്പോലെയായിരിക്കും."}], "id": 23}, {"type": "mc", "q": "ദൈവത്തെക്കുറിച്ചുള്ള വചനത്തിൽ പിതാക്കന്മാരുടെ ക്രമം?", "options": ["യാക്കോബ് → ഇസഹാക്ക് → അബ്രാഹം", "ഇസഹാക്ക് → അബ്രാഹം → യാക്കോബ്", "അബ്രാഹം → ഇസഹാക്ക് → യാക്കോബ്", "അബ്രാഹം → യാക്കോബ് → ഇസഹാക്ക്"], "answer": 2, "refs": ["22:31"], "evidence": [{"ref": "22:31", "text": "ഞാന്‍ അബ്രാഹത്തിന്റെ ദൈവവും ഇസഹാക്കിന്റെ ദൈവവും യാക്കോബിന്റെ ദൈവവുമാണ് എന്നു മരിച്ചവരുടെ പുനരുത്ഥാനത്തെപ്പറ്റി ദൈവം നിങ്ങളോട് അരുളിച്ചെയ്തിരിക്കുന്നതു നിങ്ങള്‍ വായിച്ചിട്ടില്ലേ?"}], "id": 24}, {"type": "mc", "q": "ഭാരമുള്ള ചുമടുകൾ വെക്കുന്നവർ സഹായിക്കാനായി അനക്കാൻപോലും തയ്യാറാകാത്തത്?", "options": ["കാൽ", "ചുമൽ", "വലത്തുകൈ", "ചെറുവിരൽ"], "answer": 3, "refs": ["23:4"], "evidence": [{"ref": "23:4", "text": "അവര്‍ ഭാരമുള്ള ചുമടുകള്‍ മനുഷ്യരുടെ ചുമലില്‍ വച്ചുകൊടുക്കുന്നു. സഹായിക്കാന്‍ ചെറുവിരല്‍ അനക്കാന്‍പോലും തയ്യാറാകുന്നുമില്ല."}], "id": 25}, {"type": "mc", "q": "വെള്ളയടിച്ച കുഴിമാടങ്ങളുടെ ഉള്ളിൽ നിറഞ്ഞതായി പറയുന്ന ജോഡി?", "options": ["കവർച്ചയും ആർ‍ത്തിയും", "കാപട്യവും അനീതിയും", "സ്വർണവും കാഴ്ചവസ്തുക്കളും", "മരിച്ചവരുടെ അസ്ഥികളും സർവവിധ മാലിന്യങ്ങളും"], "answer": 3, "refs": ["23:27"], "evidence": [{"ref": "23:27", "text": "കപടനാട്യക്കാരായ നിയമജ്ഞരേ, ഫരിസേയരേ, നിങ്ങള്‍ക്കു ദുരിതം! നിങ്ങള്‍ വെള്ളയടിച്ച കുഴിമാടങ്ങള്‍ക്കു സദൃശരാണ്. അവ പുറമേ മനോഹരമായി കാണപ്പെടുന്നെങ്കിലും അവയ്ക്കുള്ളില്‍ മരിച്ചവരുടെ അസ്ഥികളും സര്‍വവിധ മാലിന്യങ്ങളും നിറഞ്ഞുകിടക്കുന്നു."}], "id": 26}, {"type": "fill", "q": "അവര്‍ അവനോടു പ ത്തിൽ"], "optionAnswer": 2, "refs": ["23:2"], "evidence": [{"ref": "23:2", "text": "നിയമജ്ഞരും ഫരിസേയരും മോശയുടെ സിംഹാസനത്തില്‍ ഇരിക്കുന്നു."}], "id": 38}, {"type": "fill", "q": "അന്ധരായ മാര്‍ഗദര്‍ശികളേ, ________ അരിച്ചു നീക്കുകയും ഒട്ടകത്തെ വിഴുങ്ങുകയുംചെയ്യുന്നവരാണു നിങ്ങള്‍! (23:24)", "answer": "കൊതുകിനെ", "options": ["ചതകുപ്പയെ", "ജീരകത്തെ", "കൊതുകിനെ", "പ്രാവിനെ"], "optionAnswer": 2, "refs": ["23:24"], "evidence": [{"ref": "23:24", "text": "അന്ധരായ മാര്‍ഗദര്‍ശികളേ, കൊതുകിനെ അരിച്ചു നീക്കുകയും ഒട്ടകത്തെ വിഴുങ്ങുകയുംചെയ്യുന്നവരാണു നിങ്ങള്‍!"}], "id": 39}, {"type": "fill", "q": "ജറുസലെം, ജറുസലെം, പ്രവാചകന്‍മാരെ വധിക്കുകയും നിന്റെ അടുത്തേക്ക് അയയ്ക്കപ്പെടുന്നവരെ കല്ലെറിയുകയും ചെയ്യുന്നവളേ, പിടക്കോഴി കുഞ്ഞുങ്ങളെ ________ കാത്തുകൊള്ളുന്നതുപോലെ നിന്റെ സന്തതികളെ ഒരുമിച്ചുകൂട്ടാന്‍ ഞാന്‍ എത്രയോ പ്രാവശ്യം ആഗ്രഹിച്ചു! പക്‌ഷേ, നിങ്ങള്‍ വിസമ്മതിച്ചു. (23:37)", "answer": "ചിറകുകള്‍ക്കുള്ളില്‍", "options": ["ഭവനത്തിനുള്ളിൽ", "കൂടിനുള്ളിൽ", "ചിറകുകള്‍ക്കുള്ളില്‍", "കരങ്ങളിൽ"], "optionAnswer": 2, "refs": ["23:37"], "evidence": [{"ref": "23:37", "text": "ജറുസലെം, ജറുസലെം, പ്രവാചകന്‍മാരെ വധിക്കുകയും നിന്റെ അടുത്തേക്ക് അയയ്ക്കപ്പെടുന്നവരെ കല്ലെറിയുകയും ചെയ്യുന്നവളേ, പിടക്കോഴി കുഞ്ഞുങ്ങളെ ചിറകുകള്‍ക്കുള്ളില്‍ കാത്തുകൊള്ളുന്നതുപോലെ നിന്റെ സന്തതികളെ ഒരുമിച്ചുകൂട്ടാന്‍ ഞാന്‍ എത്രയോ പ്രാവശ്യം ആഗ്രഹിച്ചു! പക്‌ഷേ, നിങ്ങള്‍ വിസമ്മതിച്ചു."}], "id": 40}, {"type": "match", "q": "ചോദ്യം അല്ലെങ്കിൽ പ്രസ്താവന ആരോടുള്ളതെന്ന് യോജിപ്പിക്കുക.", "rows": [["എന്തധികാരത്താലാണ് നീ ഇതൊക്കെ ചെയ്യുന്നത്?", "യേശുവിനോട് പ്രധാനപുരോഹിതന്മാരും ജനപ്രമാണികളും"], ["യോഹന്നാന്റെ ജ്ഞാനസ്നാനം എവിടെ നിന്നായിരുന്നു?", "അധികാരം ചോദിച്ചവരോട് യേശു"], ["നിയമത്തിലെ അതിപ്രധാനമായ കൽപന ഏതാണ്?", "യേശുവിനോട് നിയമപണ്ഡിതൻ"], ["അവൻ ആരുടെ പുത്രനാണ്?", "ഫരിസേയരോട് യേശു"]], "refs": ["21:23", "21:25", "22:35", "22:36", "22:41", "22:42"], "id": 41, "evidence": [{"ref": "21:23", "text": "അവന്‍ ദേവാലയത്തിലെത്തി പഠിപ്പിച്ചുകൊണ്ടിരിക്കുമ്പോള്‍ പ്രധാനപുരോഹിതന്‍മാരും ജനപ്രമാണികളും അവനെ സമീപിച്ചുചോദിച്ചു: എന്തധികാരത്താലാണ് നീ ഇതൊക്കെ ചെയ്യുന്നത്? നിനക്ക് ഈ അധികാരം നല്‍കിയത് ആരാണ്?"}, {"ref": "21:25", "text": "യോഹന്നാന്റെ ജ്ഞാനസ്‌നാനം എവിടെ നിന്നായിരുന്നു? സ്വര്‍ഗത്തില്‍ നിന്നോ മനുഷ്യരില്‍നിന്നോ? അവര്‍ പരസ്പരം ആലോചിച്ചു; സ്വര്‍ഗത്തില്‍ നിന്ന് എന്നു നാം പറഞ്ഞാല്‍, പിന്നെ എന്തുകൊണ്ട് നിങ്ങള്‍ അവനെ വിശ്വസിച്ചില്ല എന്ന് അവന്‍ ചോദിക്കും."}, {"ref": "22:35", "text": "അവരില്‍ ഒരു നിയമപണ്ഡിതന്‍ അവനെ പരീക്ഷിക്കാന്‍ ചോദിച്ചു:"}, {"ref": "22:36", "text": "ഗുരോ, നിയമത്തിലെ അതിപ്രധാനമായ കല്‍പന ഏതാണ്?"}, {"ref": "22:41", "text": "ഫരിസേയര്‍ ഒരുമിച്ചുകൂടിയപ്പോള്‍ യേശു അവരോടു ചോദിച്ചു:"}, {"ref": "22:42", "text": "നിങ്ങള്‍ ക്രിസ്തുവിനെപ്പറ്റി എന്തു വിചാരിക്കുന്നു? അവന്‍ ആരുടെ പുത്രനാണ്? ദാവീദിന്റെ, എന്ന് അവര്‍ പറഞ്ഞു."}]}, {"type": "match", "q": "ആണയിടുന്ന കാര്യവും അതുമായി ബന്ധിപ്പിക്കുന്നതും യോജിപ്പിക്കുക.", "rows": [["ബലിപീഠം", "അതും അതിന്മേലുള്ള എല്ലാ വസ്തുക്കളും"], ["ദേവാലയം", "അതും അതിൽ വസിക്കുന്നവനും"], ["സ്വർഗം", "ദൈവത്തിന്റെ സിംഹാസനവും അതിൽ ഇരിക്കുന്നവനും"], ["ബലിപീഠത്തിലെ കാഴ്ചവസ്തു", "അതിനെ പവിത്രമാക്കുന്ന ബലിപീഠം വലുത്"]], "refs": ["23:20", "23:21", "23:22", "23:19"], "id": 42, "evidence": [{"ref": "23:20", "text": "ബലിപീഠത്തെക്കൊണ്ട് ആണയിടുന്നവന്‍ അതിനെക്കൊണ്ടും അതിന്‍മേലുള്ള എല്ലാ വസ്തുക്കളെക്കൊണ്ടും ആണയിടുന്നു."}, {"ref": "23:21", "text": "ദേവാലയത്തെക്കൊണ്ട് ആണയിടുന്നവന്‍ അതിനെക്കൊണ്ടും അതില്‍ വസിക്കുന്നവനെക്കൊണ്ടും ആണയിടുന്നു."}, {"ref": "23:22", "text": "സ്വര്‍ഗത്തെക്കൊണ്ട് ആണയിടുന്നവന്‍ ദൈവത്തിന്റെ സിംഹാസനത്തെക്കൊണ്ടും അതില്‍ ഇരിക്കുന്നവനെക്കൊണ്ടും ആണയിടുന്നു."}, {"ref": "23:19", "text": "അന്ധരേ, ഏതാണു വലുത്? കാഴ്ചവസ്തുവോ കാഴ്ചവസ്തുവിനെ പവിത്രമാക്കുന്ന ബലിപീഠമോ?"}]}, {"type": "match", "q": "പ്രസ്താവനയും അനുബന്ധമായ ദൈവരാജ്യവിവരണവും യോജിപ്പിക്കുക.", "rows": [["ചുങ്കക്കാരും വേശ്യകളും", "നിങ്ങൾക്കു മുമ്പേ പ്രവേശിക്കും"], ["ഫലം പുറപ്പെടുവിക്കുന്ന ജനത", "നിങ്ങളിൽനിന്ന് എടുത്ത ദൈവരാജ്യം ലഭിക്കും"], ["ക്ഷണിക്കപ്പെട്ടവർ", "വിവാഹവിരുന്നിനു യോഗ്യരായില്ല"], ["നിയമജ്ഞരും ഫരിസേയരും", "മനുഷ്യരുടെ മുമ്പിൽ സ്വർഗരാജ്യം അടച്ചുകളയുന്നു"]], "refs": ["21:31", "21:43", "22:8", "23:13"], "evidence": [{"ref": "21:31", "text": "ഈ രണ്ടുപേരില്‍ ആരാണ് പിതാവിന്റെ ഇഷ്ടം നിറവേറ്റിയത്? അവര്‍ പറഞ്ഞു: രണ്ടാമന്‍. യേശു പറഞ്ഞു: സത്യമായി ഞാന്‍ നിങ്ങളോടു പറയുന്നു, ചുങ്കക്കാരും വേശ്യകളുമായിരിക്കും നിങ്ങള്‍ക്കു മുമ്പേ സ്വര്‍ഗരാജ്യത്തില്‍ പ്രവേശിക്കുക."}, {"ref": "21:43", "text": "അതുകൊണ്ടു ഞാന്‍ നിങ്ങളോടു പറയുന്നു, ദൈവരാജ്യം നിങ്ങളില്‍ നിന്ന് എടുത്തു ഫലം പുറപ്പെടുവിക്കുന്ന ജനതയ്ക്കു നല്‍കപ്പെടും."}, {"ref": "22:8", "text": "അനന്തരം, അവന്‍ ഭൃത്യന്‍മാരോടു പറഞ്ഞു: വിവാഹ വിരുന്നു തയ്യാറാക്കിയിരിക്കുന്നു; എന്നാല്‍ ക്ഷണിക്കപ്പെട്ടവര്‍ അയോഗ്യരായിരുന്നു."}, {"ref": "23:13", "text": "കപടനാട്യക്കാരായ നിയമജ്ഞരേ, ഫരിസേയരേ, നിങ്ങള്‍ക്കു ദുരിതം! നിങ്ങള്‍ മനുഷ്യരുടെ മുമ്പില്‍ സ്വര്‍ഗരാജ്യം അടച്ചുകളയുന്നു."}], "id": 43}, {"type": "match", "q": "പ്രവൃത്തികളിലെ പുറവും അകവും സംബന്ധിച്ച താരതമ്യങ്ങൾ യോജിപ്പിക്കുക.", "rows": [["അവർ പറയുന്നു", "പ്രവർത്തിക്കുന്നില്ല"], ["പാനപാത്രത്തിന്റെ പുറം വെടിപ്പാക്കുന്നു", "ഉള്ള് കവർച്ചയും ആർ‍ത്തിയുംകൊണ്ട് നിറഞ്ഞിരിക്കുന്നു"], ["കുഴിമാടങ്ങൾ പുറമേ മനോഹരം", "ഉള്ളിൽ അസ്ഥികളും മാലിന്യങ്ങളും"], ["ബാഹ്യമായി മനുഷ്യർക്കു നല്ലവർ", "ഉള്ളിൽ കാപട്യവും അനീതിയും"]], "refs": ["23:3", "23:25", "23:27", "23:28"], "evidence": [{"ref": "23:3", "text": "അതിനാല്‍, അവര്‍ നിങ്ങളോടു പറയുന്നതെല്ലാം അനുസരിക്കുകയും അനുഷ്ഠിക്കുകയും ചെയ്യുവിന്‍. എന്നാല്‍, അവരുടെ പ്രവൃത്തികള്‍ നിങ്ങള്‍ അനുകരിക്കരുത്. അവര്‍ പറയുന്നു; പ്രവര്‍ത്തിക്കുന്നില്ല."}, {"ref": "23:25", "text": "കപടനാട്യക്കാരായ നിയമജ്ഞരേ, ഫരിസേയരേ, നിങ്ങള്‍ക്കു ദുരിതം! നിങ്ങള്‍ പാനപാത്രത്തിന്റെയും ഭക്ഷണപാത്രത്തിന്റെയും പുറംവെടിപ്പാക്കുന്നു; എന്നാല്‍, അവയുടെ ഉള്ള് കവര്‍ച്ചയും ആര്‍ത്തിയുംകൊണ്ട് നിറഞ്ഞിരിക്കുന്നു."}, {"ref": "23:27", "text": "കപടനാട്യക്കാരായ നിയമജ്ഞരേ, ഫരിസേയരേ, നിങ്ങള്‍ക്കു ദുരിതം! നിങ്ങള്‍ വെള്ളയടിച്ച കുഴിമാടങ്ങള്‍ക്കു സദൃശരാണ്. അവ പുറമേ മനോഹരമായി കാണപ്പെടുന്നെങ്കിലും അവയ്ക്കുള്ളില്‍ മരിച്ചവരുടെ അസ്ഥികളും സര്‍വവിധ മാലിന്യങ്ങളും നിറഞ്ഞുകിടക്കുന്നു."}, {"ref": "23:28", "text": "അതുപോലെ, ബാഹ്യമായി മനുഷ്യര്‍ക്കു നല്ലവരായി കാണപ്പെടുന്ന നിങ്ങള്‍ ഉള്ളില്‍ കാപട്യവും അനീതിയും നിറഞ്ഞ വരാണ്."}], "id": 44}, {"type": "tf", "q": "ദേവാലയത്തിൽ സുഖപ്പെടുത്തപ്പെട്ടവരായി അന്ധന്മാരെയും മുടന്തന്മാരെയും പേരെടുത്തു പറയുന്നു.", "answer": true, "refs": ["21:14"], "id": 45, "evidence": [{"ref": "21:14", "text": "അന്ധന്മാരും മുടന്തന്‍മാരും ദേവാലയത്തില്‍ അവന്റെ അടുത്തെത്തി. അവന്‍ അവരെ സുഖപ്പെടുത്തി."}]}, {"type": "tf", "q": "അന്നുമുതൽ യേശുവിനോട് എന്തെങ്കിലും ചോദിക്കാൻ ആരും ധൈര്യപ്പെട്ടില്ല എന്ന് രേഖപ്പെടുത്തുന്നു.", "answer": true, "refs": ["22:46"], "id": 46, "evidence": [{"ref": "22:46", "text": "അവനോട് ഉത്തരമായി ഒരു വാക്കുപോലും പറയാന്‍ ആര്‍ക്കും കഴിഞ്ഞില്ല. അന്നുമുതല്‍ അവനോട് എന്തെങ്കിലും ചോദിക്കാന്‍ ആരും ധൈര്യപ്പെട്ടതുമില്ല."}]}, {"type": "tf", "q": "അയയ്ക്കുന്നവരുടെ പട്ടികയിൽ പ്രവാചകന്മാർ, ജ്ഞാനികൾ, പ്രധാനപുരോഹിതന്മാർ എന്നാണ് പറയുന്നത്.", "answer": false, "refs": ["23:34"], "id": 47, "evidence": [{"ref": "23:34", "text": "അതുകൊണ്ട്, ഇതാ, പ്രവാചകന്‍മാരെയും ജ്ഞാനികളെയും നിയമജ്ഞരെയും ഞാന്‍ നിങ്ങളുടെ അടുക്കലേക്കയയ്ക്കുന്നു. അവരില്‍ ചിലരെ നിങ്ങള്‍ വധിക്കുകയും ക്രൂശിക്കുകയുംചെയ്യും; ചിലരെ നിങ്ങള്‍ നിങ്ങളുടെ സിനഗോഗുകളില്‍ വച്ച്, ചമ്മട്ടി കൊണ്ടടിക്കുകയും പട്ടണംതോറും പിന്തുടര്‍ന്നു പീഡിപ്പിക്കുകയും ചെയ്യും."}]}, {"type": "tf", "q": "രണ്ടാം പ്രാവശ്യം അയച്ച ഭൃത്യന്മാർ ആദ്യത്തേതിനെക്കാൾ എണ്ണത്തിൽ കൂടുതലായിരുന്നു.", "answer": true, "refs": ["21:36"], "evidence": [{"ref": "21:36", "text": "വീണ്ടും അവന്‍ ആദ്യത്തേതില്‍ കൂടുതല്‍ ഭൃത്യന്‍മാരെ അയച്ചു. അവരോടും കൃഷിക്കാര്‍ അപ്രകാരംതന്നെപ്രവര്‍ത്തിച്ചു."}], "id": 48}, {"type": "tf", "q": "യേശു ഫരിസേയരെ വാക്കുമുട്ടിച്ചെന്നു കേട്ടാണ് സദുക്കായർ ഒന്നിച്ചുകൂടിയത്.", "answer": false, "refs": ["22:34"], "evidence": [{"ref": "22:34", "text": "യേശു സദുക്കായരെ വാക്കുമുട്ടിച്ചെന്നു കേട്ടപ്പോള്‍ ഫരിസേയര്‍ ഒന്നിച്ചുകൂടി."}], "id": 49}, {"type": "tf", "q": "പാനപാത്രത്തിന്റെയും ഭക്ഷണപാത്രത്തിന്റെയും ശുദ്ധീകരണത്തിൽ ആദ്യം പുറം ശുദ്ധിയാക്കാനാണ് നിർദേശം.", "answer": false, "refs": ["23:26"], "evidence": [{"ref": "23:26", "text": "അന്ധനായ ഫരിസേയാ, പാനപാത്രത്തിന്റെയും ഭക്ഷണപാത്രത്തിന്റെയും പുറംകൂടി ശുദ്ധിയാകാന്‍വേണ്ടി ആദ്യമേ അകം ശുദ്ധിയാക്കുക."}], "id": 50}]};

const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.normalize('NFC').trim().replace(/\s+/g,' ').replace(/\u200c|\u200d/g,'').replace(/ണ്/g,'ൺ').replace(/ന്/g,'ൻ').replace(/ര്/g,'ർ').replace(/ല്/g,'ൽ').replace(/ള്/g,'ൾ').replace(/ക്/g,'ൿ');
const labels={mc:'ശരിയായത് തിരഞ്ഞെടുക്കുക',fill:'വിട്ടുപോയ ഭാഗത്തിന് ശരിയായത് തിരഞ്ഞെടുക്കുക',match:'കൂട്ടിയിണക്കുക',tf:'ശരിയോ തെറ്റോ?'};
function right(q){return q.type==='mc'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.type==='tf'?(q.answer?'ശരി':'തെറ്റ്'):q.type==='match'?q.rows.map(r=>r[0]+' → '+r[1]).join('\n'):q.answer;}
function userText(q,a){return q.type==='mc'?String.fromCharCode(65+a)+'. '+q.options[a]:q.type==='tf'?(a?'ശരി':'തെറ്റ്'):q.type==='match'?q.rows.map((r,i)=>r[0]+' → '+q.rows[a[i]][1]).join('\n'):q.type==='fill'?q.options[a]:a;}
function saveDraft(){const q=quiz.questions[current];if(responses[current])return;drafts[current]=q.type==='match'?q.rows.map((_,i)=>$('match-'+i).value):document.querySelector('input[name="answer"]:checked')?.value??null;}
function answerSelected(){if(responses[current])return;saveDraft();const q=quiz.questions[current],a=drafts[current];if(q.type==='match'){const selected=a.filter(x=>x!=='').length;$('notice').textContent=selected<q.rows.length?`കൂട്ടിയിണക്കിയത്: ${selected} / ${q.rows.length}`:'';if(selected!==q.rows.length)return;}if(a!==null)check();}
function render(){const q=quiz.questions[current],r=responses[current],a=drafts[current];const count=responses.filter(Boolean).length,score=responses.filter(x=>x?.correct).length;
$('position').textContent=`ചോദ്യം ${current+1} / ${total}`;$('score').textContent=`നിങ്ങളുടെ സ്കോർ: ${score} / ${total}`;$('remaining').textContent=`ബാക്കി: ${total-count}`;$('progress').max=total;$('progress').value=count;$('checked-count').textContent=`പരിശോധിച്ചത്: ${count} / ${total}`;
$('question-jump').innerHTML=quiz.questions.map((item,i)=>{const response=responses[i],state=response?(response.correct?'ശരിയായ ഉത്തരം':'തെറ്റായ ഉത്തരം'):'പരിശോധിച്ചിട്ടില്ല';return `<button type="button" data-jump="${i}" class="${response?(response.correct?'done-correct':'done-wrong'):''}" ${i===current?'aria-current="step"':''} aria-label="ചോദ്യം ${i+1}, ${state}">${i+1}${response?(response.correct?' ✓':' ✕'):''}</button>`;}).join('');$('question-jump').querySelectorAll('button').forEach(button=>button.onclick=()=>jumpTo(Number(button.dataset.jump)));
$('type').textContent=labels[q.type];$('question-title').textContent=`${current+1}. ${q.q}`;$('notice').textContent='';
if(q.type==='mc'||q.type==='fill'||q.type==='tf'){const opts=q.type==='tf'?['ശരി','തെറ്റ്']:q.options;$('controls').innerHTML='<fieldset style="border:0;padding:0;margin:0"><legend>നിങ്ങളുടെ ഉത്തരം തിരഞ്ഞെടുക്കുക</legend>'+opts.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${String(a)===String(i)?'checked':''} ${r?'disabled':''}><span>${q.type!=='tf'?String.fromCharCode(65+i)+'. ':''}${esc(o)}</span></label>`).join('')+'</fieldset>';
}else{const order=q.rows.map((_,i)=>i).sort((x,y)=>((x*3+1)%q.rows.length)-((y*3+1)%q.rows.length));if(order.every((x,i)=>x===i))order.reverse();$('controls').innerHTML=q.rows.map((row,i)=>`<div class="match-row"><label for="match-${i}">${i+1}. ${esc(row[0])}</label><select id="match-${i}" ${r?'disabled':''}><option value="">തിരഞ്ഞെടുക്കുക</option>${order.map(j=>`<option value="${j}" ${a&&String(a[i])===String(j)?'selected':''}>${esc(q.rows[j][1])}</option>`).join('')}</select></div>`).join('');}
$('feedback').innerHTML=r?feedback(q,r):'';$('prev').disabled=current===0;$('next').disabled=current===total-1;$('controls').querySelectorAll('input,select').forEach(control=>{control.oninput=answerSelected;control.onchange=answerSelected;if(q.type==='match')control.onblur=answerSelected;});
if(count===total)showResults();else{$('results').hidden=true;$('results').innerHTML='';}}
function feedback(q,r){const parts=q.type==='match'?'<div>'+q.rows.map((row,i)=>`<p>${i+1}. ${esc(row[0])}: ${r.value[i]===i?'ശരിയാണ്':'തെറ്റാണ്'}</p>`).join('')+'</div>':'';
return `<div tabindex="-1" class="feedback ${r.correct?'':'wrong'}"><div class="feedback-heading"><span class="status-icon" aria-hidden="true">${r.correct?'✓':'✕'}</span><strong>${r.correct?'ശരിയാണ് — 1 മാർക്ക്':'തെറ്റാണ് — 0 മാർക്ക്'}</strong></div>${parts}<p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,r.value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div><details><summary>വചനാധാരം കാണുക</summary>${q.evidence.map(e=>`<div class="evidence"><strong>${esc(e.label||'മത്തായി '+e.ref)}</strong><p>${esc(e.text)}</p></div>`).join('')}</details></div>`;}
function check(){if(responses[current])return;saveDraft();const q=quiz.questions[current],a=drafts[current];if(a===null||(q.type==='match'&&a.some(x=>x===''))){$('notice').textContent=q.type==='match'?'എല്ലാ കൂട്ടുകളും തിരഞ്ഞെടുക്കുക.':'ആദ്യം നിങ്ങളുടെ ഉത്തരം നൽകുക.';return;}
let value,correct;if(q.type==='mc'){value=Number(a);correct=value===q.answer;}else if(q.type==='tf'){value=a==='0';correct=value===q.answer;}else if(q.type==='fill'){value=Number(a);correct=value===q.optionAnswer;}else{value=a.map(Number);correct=value.every((x,i)=>x===i);}
responses[current]={value,correct};render();const target=$('feedback').firstElementChild;requestAnimationFrame(()=>{if(!target.isConnected)return;target.focus({preventScroll:true});target.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});target.classList.add(correct?'celebrate':'try-again');});}
function showResults(){const n=responses.filter(x=>x.correct).length;$('results').hidden=false;$('results').innerHTML=`<h2 id="results-title">ക്വിസ് പൂർത്തിയായി</h2><p><strong>നിങ്ങളുടെ സ്കോർ: ${n} / ${total}</strong></p><p>ശരിയായ ഉത്തരങ്ങൾ: ${n}<br>തെറ്റായ ഉത്തരങ്ങൾ: ${total-n}<br>ശതമാനം: ${Math.round(n/total*100)}%</p><h3>ഉത്തരങ്ങൾ പരിശോധിക്കാം</h3>`+quiz.questions.map((q,i)=>`<div class="review"><h3>${i+1}. ${esc(q.q)}</h3><p>${responses[i].correct?'ശരിയാണ്':'തെറ്റാണ്'}</p><p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,responses[i].value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div></div>`).join('');}
function jumpTo(index){if(!Number.isInteger(index)||index<0||index>=total)return;saveDraft();current=index;render();$('question-title').focus({preventScroll:true});$('question-panel').scrollIntoView({block:'start'});}function move(step){jumpTo(current+step);}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reset').onclick=()=>{current=0;responses=quiz.questions.map(()=>null);drafts=quiz.questions.map(()=>null);render();$('question-title').focus();window.scrollTo(0,0);};render();
</script></body></html>
