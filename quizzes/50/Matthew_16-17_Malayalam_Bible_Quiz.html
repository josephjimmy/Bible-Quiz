'use strict';
const quiz={"range": "16-17", "title": "മിശിഹായുടെ വെളിപ്പെടുത്തലും കുരിശിന്റെ വഴിയും", "questions": [{"type": "mc", "q": "രാവിലെ ആകാശം ചെമന്നു മൂടിയിരിക്കുന്നതിനെക്കുറിച്ചുള്ള വിലയിരുത്തൽ ഏത്?", "options": ["ഇന്നു മഴയും മഞ്ഞും ഉണ്ടാകും", "കാലാവസ്ഥ പ്രസന്നമായിരിക്കും", "കാലത്തിന്റെ അടയാളം തെളിഞ്ഞിരിക്കുന്നു", "ഇന്നു കാറ്റും കോളും ഉണ്ടാകും"], "answer": 3, "refs": ["16:3"], "id": 1, "evidence": [{"ref": "16:3", "text": "രാവിലെ നിങ്ങള്‍ പറയുന്നു: ആകാശം ചെമന്നു മൂടിയിരിക്കുന്നു; ഇന്നു കാറ്റും കോളും ഉണ്ടാകും. ആകാശത്തിന്റെ ഭാവഭേദങ്ങള്‍ തിരിച്ചറിയാന്‍ നിങ്ങള്‍ക്കു കഴിയുന്നു. എന്നാല്‍, കാലത്തിന്റെ അടയാളങ്ങള്‍ തിരിച്ചറിയാന്‍ നിങ്ങള്‍ക്കു കഴിയുകയില്ലേ?"}]}, {"type": "mc", "q": "മനുഷ്യപുത്രനെക്കുറിച്ചുള്ള ജനാഭിപ്രായത്തിൽ പേരെടുത്തു പറയാത്ത പ്രവാചകൻ ആര്?", "options": ["സ്‌നാപകയോഹന്നാന്‍", "മോശ", "ഏലിയാ", "ജറെമിയാ"], "answer": 1, "refs": ["16:14"], "id": 2, "evidence": [{"ref": "16:14", "text": "അവര്‍ പറഞ്ഞു: ചിലര്‍ സ്‌നാപകയോഹന്നാന്‍ എന്നും മറ്റു ചിലര്‍ ഏലിയാ എന്നും വേറെ ചിലര്‍ ജറെമിയാ അല്ലെങ്കില്‍ പ്രവാചകന്‍മാരിലൊരുവന്‍ എന്നും പറയുന്നു."}]}, {"type": "mc", "q": "ആദ്യ പീഡാനുഭവപ്രവചനത്തിൽ സഹനത്തിനു കാരണക്കാരായവരുടെ ശരിയായ ക്രമം?", "options": ["ശ്രേഷ്ഠന്മാർ → നിയമജ്ഞർ → പ്രധാനപുരോഹിതന്മാർ", "പ്രധാനപുരോഹിതന്മാർ → നിയമജ്ഞർ → ശ്രേഷ്ഠന്മാർ", "ശ്രേഷ്ഠന്മാർ → പ്രധാനപുരോഹിതന്മാർ → നിയമജ്ഞർ", "നിയമജ്ഞർ → ശ്രേഷ്ഠന്മാർ → പ്രധാനപുരോഹിതന്മാർ"], "answer": 2, "refs": ["16:21"], "id": 3, "evidence": [{"ref": "16:21", "text": "അപ്പോള്‍ മുതല്‍ യേശു, തനിക്കു ജറുസലെമിലേക്കു പോകേണ്ടിയിരിക്കുന്നുവെന്നും ശ്രേഷ്ഠന്‍മാരില്‍നിന്നും പ്രധാനപുരോഹിതന്‍മാരില്‍നിന്നും നിയമജ്ഞരില്‍നിന്നും വളരെയേറെ സഹിക്കേണ്ടിവരുമെന്നും താന്‍ വധിക്കപ്പെടുമെന്നും എന്നാല്‍ മൂന്നാം ദിവസം ഉയിര്‍പ്പിക്കപ്പെടുമെന്നും ശിഷ്യന്‍മാരെ അറിയിച്ചുതുടങ്ങി."}]}, {"type": "mc", "q": "പത്രോസ് തടസ്സം പറയാൻ തുടങ്ങുന്നതിനുമുമ്പ് എന്തു ചെയ്തു?", "options": ["യേശുവിന്റെ മുമ്പിൽ പ്രണമിച്ചു", "ജനക്കൂട്ടത്തോട് സംസാരിച്ചു", "ശിഷ്യന്മാരെ അടുത്തുവിളിച്ചു", "യേശുവിനെ മാറ്റിനിറുത്തി"], "answer": 3, "refs": ["16:22"], "id": 4, "evidence": [{"ref": "16:22", "text": "പത്രോസ് അവനെ മാറ്റിനിറുത്തി തടസ്‌സം പറയാന്‍ തുടങ്ങി: ദൈവം കനിയട്ടെ! കര്‍ത്താവേ, ഇതൊരിക്കലും നിനക്കു സംഭവിക്കാതിരിക്കട്ടെ."}]}, {"type": "mc", "q": "അനുഗമിക്കാനുള്ള നിർദ്ദേശത്തിലെ ക്രമം?", "options": ["അനുഗമിക്കുക → പരിത്യജിക്കുക → കുരിശെടുക്കുക", "കുരിശെടുക്കുക → അനുഗമിക്കുക → പരിത്യജിക്കുക", "തന്നെത്തന്നെ പരിത്യജിക്കുക → കുരിശെടുക്കുക → അനുഗമിക്കുക", "പരിത്യജിക്കുക → അനുഗമിക്കുക → കുരിശെടുക്കുക"], "answer": 2, "refs": ["16:24"], "id": 5, "evidence": [{"ref": "16:24", "text": "യേശു ശിഷ്യന്‍മാരോട് അരുളിച്ചെയ്തു: ആരെങ്കിലും എന്നെ അനുഗമിക്കാന്‍ ആഗ്രഹിക്കുന്നെങ്കില്‍ അവന്‍ തന്നെത്തന്നെ പരിത്യജിച്ച് തന്റെ കുരിശുമെടുത്ത് എന്നെ അനുഗമിക്കട്ടെ."}]}, {"type": "mc", "q": "രൂപാന്തരത്തിൽ മുഖവും വസ്ത്രവും ഉപമിക്കപ്പെട്ടത് യഥാക്രമം?", "options": ["മിന്നൽ; മഞ്ഞ്", "പ്രകാശം; സൂര്യൻ", "സൂര്യൻ; പ്രകാശം", "മഞ്ഞ്; മിന്നൽ"], "answer": 2, "refs": ["17:2"], "id": 6, "evidence": [{"ref": "17:2", "text": "അവന്‍ അവരുടെ മുമ്പില്‍വച്ചു രൂപാന്തരപ്പെട്ടു. അവന്റെ മുഖം സൂര്യനെപ്പോലെവെട്ടിത്തിളങ്ങി. അവന്റെ വസ്ത്രം പ്രകാശംപോലെ ധവളമായി."}]}, {"type": "mc", "q": "ശിഷ്യന്മാർ കമിഴ്ന്നുവീണതിനു പിന്നാലെ യേശു ചെയ്തത്?", "options": ["മേഘത്തിൽനിന്നു സംസാരിച്ചു", "സമീപിച്ച് അവരെ സ്പർശിച്ചു", "മലയിൽനിന്ന് ഉടനെ ഇറങ്ങി", "മൂന്നു കൂടാരങ്ങൾ നിർമിച്ചു"], "answer": 1, "refs": ["17:6", "17:7"], "id": 7, "evidence": [{"ref": "17:6", "text": "ഇതുകേട്ട ക്ഷണത്തില്‍ ശിഷ്യന്‍മാര്‍ കമിഴ്ന്നു വീണു; അവര്‍ ഭയവിഹ്വലരായി."}, {"ref": "17:7", "text": "യേശു സമീപിച്ച് അവരെ സ്പര്‍ശിച്ചുകൊണ്ടു പറഞ്ഞു: എഴുന്നേല്‍ക്കുവിന്‍, ഭയപ്പെടേണ്ടാ."}]}, {"type": "mc", "q": "ദർശനത്തെക്കുറിച്ചുള്ള മൗനനിർദ്ദേശത്തിന്റെ കാലപരിധി?", "options": ["മനുഷ്യപുത്രൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെടുന്നതുവരെ", "ഏലിയാ എല്ലാം പുനഃസ്ഥാപിക്കുന്നതുവരെ", "മനുഷ്യപുത്രൻ രാജ്യത്തിൽ വരുന്നതുവരെ", "മനുഷ്യപുത്രൻ ജറുസലെമിൽ എത്തുന്നതുവരെ"], "answer": 0, "refs": ["17:9"], "id": 8, "evidence": [{"ref": "17:9", "text": "മലയില്‍നിന്ന് ഇറങ്ങുമ്പോള്‍ യേശു അവരോട് ആജ്ഞാപിച്ചു: മനുഷ്യപുത്രന്‍മരിച്ചവരില്‍നിന്ന് ഉയിര്‍പ്പിക്കപ്പെടുന്നതുവരെ നിങ്ങള്‍ ഈ ദര്‍ശനത്തെപ്പറ്റി ആരോടും പറയരുത്."}]}, {"type": "mc", "q": "രോഗിയായ ബാലൻ പലപ്പോഴും വീഴുന്നത് എവിടെ?", "options": ["തീയിലും വെള്ളത്തിലും", "തീയിലും പാറയിലും", "വെള്ളത്തിലും കുഴിയിലും", "കുഴിയിലും പാറയിലും"], "answer": 0, "refs": ["17:15"], "id": 9, "evidence": [{"ref": "17:15", "text": "കര്‍ത്താവേ, എന്റെ പുത്രനില്‍ കനിയണമേ; അവന്‍ അപസ്മാരം പിടിപെട്ട് വല്ലാതെ കഷ്ടപ്പെടുന്നു. പലപ്പോഴും അവന്‍ തീയിലും വെള്ളത്തിലും വീഴുന്നു."}]}, {"type": "mc", "q": "പിശാചിനെ ബഹിഷ്കരിക്കാനാകാത്തതിന്റെ കാരണം ചോദിച്ച സാഹചര്യം?", "options": ["ശിഷ്യന്മാർ തനിച്ച് യേശുവിനെ സമീപിച്ചു", "മലയിൽവച്ച് പത്രോസ് ചോദിച്ചു", "ജനക്കൂട്ടത്തിന്റെ മുമ്പിൽ പിതാവ് ചോദിച്ചു", "നികുതിപിരിക്കുന്നവർ വീട്ടിൽവച്ച് ചോദിച്ചു"], "answer": 0, "refs": ["17:19"], "id": 10, "evidence": [{"ref": "17:19", "text": "അനന്തരം ശിഷ്യന്‍മാര്‍ തനിച്ച് യേശുവിനെ സമീപിച്ചു ചോദിച്ചു. എന്തുകൊണ്ടാണ് അതിനെ ബഹിഷ്‌കരിക്കാന്‍ ഞങ്ങള്‍ക്കു കഴിയാതെ പോയത്?"}]}, {"type": "mc", "q": "രണ്ടാം പീഡാനുഭവപ്രവചനം നൽകുമ്പോൾ അവർ ഒരുമിച്ചുകൂടിയത് എവിടെ?", "options": ["ജറുസലെമിൽ", "ഗലീലിയിൽ", "കേസറിയാഫിലിപ്പിയിൽ", "കഫർണാമിൽ"], "answer": 1, "refs": ["17:22"], "id": 11, "evidence": [{"ref": "17:22", "text": "അവര്‍ ഗലീലിയില്‍ ഒരുമിച്ചുകൂടിയപ്പോള്‍ യേശു അവരോടു പറഞ്ഞു: മനുഷ്യപുത്രന്‍മനുഷ്യരുടെ കൈകളില്‍ ഏല്‍പിക്കപ്പെടാന്‍ പോകുന്നു."}]}, {"type": "mc", "q": "ദേവാലയനികുതി പിരിക്കുന്നവർ ചോദ്യം ഉന്നയിച്ചത് ആരോട്?", "options": ["യാക്കോബിനോട്", "യേശുവിനോട്", "യോഹന്നാനോട്", "പത്രോസിനോട്"], "answer": 3, "refs": ["17:24"], "id": 12, "evidence": [{"ref": "17:24", "text": "അവര്‍ കഫര്‍ണാമിലെത്തിയപ്പോള്‍ ദേവാലയനികുതി പിരിക്കുന്നവര്‍ പത്രോസിന്റെ അടുത്തുചെന്നു ചോദിച്ചു: നിങ്ങളുടെ ഗുരു നികുതികൊടുക്കുന്നില്ലേ?"}]}, {"type": "mc", "q": "രാജാക്കന്മാർ നികുതി പിരിക്കുന്നതിനെക്കുറിച്ച് യേശു ചോദിച്ചത് എപ്പോൾ?", "options": ["നികുതിപിരിക്കുന്നവർ വന്നപ്പോൾ", "പത്രോസ് വീട്ടിലെത്തിയപ്പോൾ", "ഗലീലിയിൽ ഒരുമിച്ചുകൂടിയപ്പോൾ", "പത്രോസ് കടലിലെത്തിയപ്പോൾ"], "answer": 1, "refs": ["17:25"], "id": 13, "evidence": [{"ref": "17:25", "text": "അവന്‍ പറഞ്ഞു: ഉവ്വ്. പിന്നീടു വീട്ടിലെത്തിയപ്പോള്‍ യേശു ചോദിച്ചു: ശിമയോനേ, നിനക്കെന്തു തോന്നുന്നു, ഭൂമിയിലെ രാജാക്കന്‍മാര്‍ ആരില്‍ നിന്നാണ് നികുതിയോചുങ്കമോ പിരിക്കുന്നത്? തങ്ങളുടെ പുത്രന്‍മാരില്‍ നിന്നോ, അന്യരില്‍ നിന്നോ?"}]}, {"type": "mc", "q": "പരീക്ഷിക്കാൻ വന്നവർ ആവശ്യപ്പെട്ട അടയാളത്തിന്റെ ഉറവിടം?", "options": ["ദേവാലയത്തിൽനിന്ന്", "ജറുസലെമിൽനിന്ന്", "ഭൂമിയിൽനിന്ന്", "സ്വർഗത്തിൽനിന്ന്"], "answer": 3, "refs": ["16:1"], "evidence": [{"ref": "16:1", "text": "ഫരിസേയരും സദുക്കായരും യേശുവിനെ പരീക്ഷിക്കാന്‍ വന്നു. തങ്ങള്‍ക്കു സ്വര്‍ഗത്തില്‍നിന്ന് ഒരടയാളം നല്‍കണമെന്ന് അവര്‍ അവനോട് ആവശ്യപ്പെട്ടു."}], "id": 14}, {"type": "mc", "q": "പുളിമാവിനെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിനു മുമ്പ് മറുകരയിലേക്കുള്ള യാത്രയിൽ ശിഷ്യന്മാർ മറന്നത്?", "options": ["അപ്പം എടുക്കാൻ", "ആഹാരം കഴിക്കാൻ", "അപ്പക്കഷണങ്ങൾ ശേഖരിക്കാൻ", "കുട്ടകൾ നിറയ്ക്കാൻ"], "answer": 0, "refs": ["16:5", "16:6"], "evidence": [{"ref": "16:5", "text": "മറുകരയിലേക്കു പോകുമ്പോള്‍ അപ്പംഎടുക്കാന്‍ ശിഷ്യന്‍മാര്‍ മറന്നിരുന്നു."}, {"ref": "16:6", "text": "യേശു പറഞ്ഞു: ശ്രദ്ധിക്കുവിന്‍; ഫരിസേയരുടെയും സദുക്കായരുടെയും പുളിമാവിനെ സൂക്ഷിച്ചുകൊള്ളുവിന്‍."}], "id": 15}, {"type": "mc", "q": "പുളിമാവിനെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിനു ശിഷ്യന്മാർ ആദ്യം നൽകിയ വിശദീകരണം?", "options": ["ഫരിസേയരെ വിട്ടുപോയതുകൊണ്ടായിരിക്കാം", "സദുക്കായരെ വിശ്വസിച്ചതുകൊണ്ടായിരിക്കാം", "സ്വർഗത്തിലെ അടയാളം കാണാത്തതുകൊണ്ടായിരിക്കാം", "അപ്പമൊന്നും എടുക്കാത്തതുകൊണ്ടായിരിക്കാം"], "answer": 3, "refs": ["16:7"], "evidence": [{"ref": "16:7", "text": "നാം അപ്പമൊന്നും എടുക്കാത്തതുകൊണ്ടായിരിക്കാം എന്ന് അവര്‍ പരസ്പരം പറഞ്ഞു."}], "id": 16}, {"type": "mc", "q": "കേസറിയാഫിലിപ്പിയിലെ സംഭാഷണത്തിലെ ചോദ്യങ്ങളുടെ ക്രമം?", "options": ["നിങ്ങൾ പറയുന്നത് → ജനങ്ങൾ പറയുന്നത്", "ജനങ്ങൾ പറയുന്നത് → നിയമജ്ഞർ പറയുന്നത്", "ജനങ്ങൾ പറയുന്നത് → നിങ്ങൾ പറയുന്നത്", "നിയമജ്ഞർ പറയുന്നത് → ജനങ്ങൾ പറയുന്നത്"], "answer": 2, "refs": ["16:13", "16:15"], "evidence": [{"ref": "16:13", "text": "യേശു കേസറിയാഫിലിപ്പിപ്രദേശത്ത് എത്തിയപ്പോള്‍ ശിഷ്യന്‍മാരോടു ചോദിച്ചു: മനുഷ്യപുത്രന്‍ ആരെന്നാണ് ജനങ്ങള്‍ പറയുന്നത്?"}, {"ref": "16:15", "text": "അവന്‍ അവരോടു ചോദിച്ചു: എന്നാല്‍, ഞാന്‍ ആരെന്നാണ് നിങ്ങള്‍ പറയുന്നത്?"}], "id": 17}, {"type": "mc", "q": "പത്രോസിന്റെ പ്രഖ്യാപനത്തിലെ ദൈവത്തെ വിശേഷിപ്പിക്കുന്ന കൃത്യമായ പദം?", "options": ["സ്വർഗസ്ഥനായ", "ജീവനുള്ള", "നിത്യനായ", "സർവശക്തനായ"], "answer": 1, "refs": ["16:16"], "evidence": [{"ref": "16:16", "text": "ശിമയോന്‍ പത്രോസ് പറഞ്ഞു: നീ ജീവനുള്ള ദൈവത്തിന്റെ പുത്രനായ ക്രിസ്തുവാണ്."}], "id": 18}, {"type": "mc", "q": "സഭ സ്ഥാപിക്കുമെന്ന വചനത്തിൽ അതിനെതിരേ പ്രബലപ്പെടുകയില്ലെന്ന് പറയുന്നത്?", "options": ["ഫരിസേയരുടെ പ്രബോധനങ്ങൾ", "നരകകവാടങ്ങൾ", "മാനുഷികചിന്തകൾ", "കാലത്തിന്റെ അടയാളങ്ങൾ"], "answer": 1, "refs": ["16:18"], "evidence": [{"ref": "16:18", "text": "ഞാന്‍ നിന്നോടു പറയുന്നു: നീ പത്രോസാണ്; ഈ പാറമേല്‍ എന്റെ സഭ ഞാന്‍ സ്ഥാപിക്കും. നരകകവാടങ്ങള്‍ അതിനെതിരേ പ്രബലപ്പെടുകയില്ല."}], "id": 19}, {"type": "mc", "q": "കെട്ടലും അഴിക്കലും സംബന്ധിച്ച വചനത്തിൽ ആദ്യം പറയുന്ന പ്രവൃത്തി?", "options": ["ഭൂമിയിൽ കെട്ടുന്നത്", "സ്വർഗത്തിൽ അഴിക്കുന്നത്", "സ്വർഗത്തിൽ കെട്ടുന്നത്", "ഭൂമിയിൽ അഴിക്കുന്നത്"], "answer": 0, "refs": ["16:19"], "evidence": [{"ref": "16:19", "text": "സ്വര്‍ഗരാജ്യത്തിന്റെ താക്കോലുകള്‍ നിനക്കു ഞാന്‍ തരും. നീ ഭൂമിയില്‍ കെട്ടുന്നതെല്ലാം സ്വര്‍ഗത്തിലും കെട്ടപ്പെട്ടിരിക്കും; നീ ഭൂമിയില്‍ അഴിക്കുന്നതെല്ലാം സ്വര്‍ഗത്തിലും അഴിക്കപ്പെട്ടിരിക്കും."}], "id": 20}, {"type": "mc", "q": "കൂടാരങ്ങൾ നിർമിക്കാനുള്ള പത്രോസിന്റെ നിർദേശത്തിലെ വ്യക്തികളുടെ ക്രമം?", "options": ["മോശ → യേശു → ഏലിയാ", "ഏലിയാ → മോശ → യേശു", "യേശു → ഏലിയാ → മോശ", "യേശു → മോശ → ഏലിയാ"], "answer": 3, "refs": ["17:4"], "evidence": [{"ref": "17:4", "text": "പത്രോസ് യേശുവിനോടു പറഞ്ഞു: കര്‍ത്താവേ, നാം ഇവിടെയായിരിക്കുന്നതു നല്ലതാണ്. നിനക്കു സമ്മതമാണെങ്കില്‍ ഞങ്ങള്‍ ഇവിടെ മൂന്നു കൂടാരങ്ങള്‍ ഉണ്ടാക്കാം - ഒന്നു നിനക്ക്, ഒന്നു മോശയ്ക്ക്, ഒന്ന് ഏലിയായ്ക്ക്."}], "id": 21}, {"type": "mc", "q": "ഏലിയാ ആദ്യം വരണമെന്നു പറയുന്നവരായി ശിഷ്യന്മാർ സൂചിപ്പിച്ചത്?", "options": ["നിയമജ്ഞർ", "ഫരിസേയർ", "നികുതിപിരിക്കുന്നവർ", "സദുക്കായർ"], "answer": 0, "refs": ["17:10"], "evidence": [{"ref": "17:10", "text": "ശിഷ്യന്‍മാര്‍ അവനോടു ചോദിച്ചു: ആദ്യം ഏലിയാ വരണമെന്ന് നിയമജ്ഞര്‍ പറയുന്നതെന്തുകൊണ്ട്?"}], "id": 22}, {"type": "mc", "q": "ഏലിയാ വന്നുകഴിഞ്ഞു എന്ന വചനത്തെ ശിഷ്യന്മാർ ആരുമായി ബന്ധപ്പെടുത്തി?", "options": ["ജറെമിയായുമായി", "സ്നാപകയോഹന്നാനുമായി", "പത്രോസുമായി", "മോശയുമായി"], "answer": 1, "refs": ["17:12", "17:13"], "evidence": [{"ref": "17:12", "text": "എന്നാല്‍, ഞാന്‍ നിങ്ങളോടു പറയുന്നു, ഏലിയാ വന്നു കഴിഞ്ഞു. എങ്കിലും അവര്‍ അവനെ മനസ്‌സിലാക്കിയില്ല. തങ്ങള്‍ക്കിഷ്ടമുള്ളതെല്ലാം അവര്‍ അവനോടു ചെയ്തു. അതുപോലെ മനുഷ്യപുത്രനും അവരില്‍നിന്നു പീഡകളേല്‍ക്കാന്‍ പോകുന്നു."}, {"ref": "17:13", "text": "സ്‌നാപകയോഹന്നാനെപ്പറ്റിയാണ് അവന്‍ തങ്ങളോടു സംസാരിച്ചതെന്ന് അപ്പോള്‍ ശിഷ്യന്‍മാര്‍ക്കു മനസ്‌സിലായി."}], "id": 23}, {"type": "mc", "q": "ബാലന്റെ പിതാവ് അപേക്ഷിക്കുന്നതിനുമുമ്പ് ചെയ്തത്?", "options": ["യേശുവിന്റെ വസ്ത്രത്തിൽ പിടിച്ചു", "ശിഷ്യന്മാരെ മാറ്റിനിറുത്തി", "ജനക്കൂട്ടത്തെ ശാസിച്ചു", "യേശുവിന്റെ സന്നിധിയിൽ പ്രണമിച്ചു"], "answer": 3, "refs": ["17:14"], "evidence": [{"ref": "17:14", "text": "അവര്‍ ജനക്കൂട്ടത്തിന്റെ അടുത്തേക്കു വന്നപ്പോള്‍ ഒരാള്‍ കടന്നുവന്ന് അവന്റെ സന്നിധിയില്‍ പ്രണമിച്ചുകൊണ്ടു പറഞ്ഞു:"}], "id": 24}, {"type": "mc", "q": "നാണയം കണ്ടെത്താൻ തുറക്കാൻ നിർദേശിച്ചത് ഏതു മത്സ്യത്തിന്റെ വായ്?", "options": ["രണ്ടാമതു ലഭിക്കുന്ന മത്സ്യത്തിന്റെ", "ഏറ്റവും വലിയ മത്സ്യത്തിന്റെ", "അവസാനം ലഭിക്കുന്ന മത്സ്യത്തിന്റെ", "ആദ്യം ലഭിക്കുന്ന മത്സ്യത്തിന്റെ"], "answer": 3, "refs": ["17:27"], "evidence": [{"ref": "17:27", "text": "എങ്കിലുംഅവര്‍ക്ക് ഇടര്‍ച്ചയുണ്ടാക്കാതിരിക്കാന്‍ നീ കടലില്‍പോയി ചൂണ്ടയിടുക; ആദ്യം ലഭിക്കുന്ന മത്‌സ്യത്തിന്റെ വായ് തുറക്കുമ്പോള്‍ ഒരു നാണയം കണ്ടെത്തും. അതെടുത്ത് എനിക്കും നിനക്കുംവേണ്ടി അവര്‍ക്കു കൊടുക്കുക."}], "id": 25}, {"type": "mc", "q": "കണ്ടെത്തുന്ന നാണയം ആരാർക്കുവേണ്ടി കൊടുക്കാൻ നിർദേശിച്ചു?", "options": ["പത്രോസിനും മറ്റു ശിഷ്യന്മാർക്കും", "യേശുവിനും മറ്റു ശിഷ്യന്മാർക്കും", "യാക്കോബിനും യോഹന്നാനും", "യേശുവിനും പത്രോസിനും"], "answer": 3, "refs": ["17:27"], "evidence": [{"ref": "17:27", "text": "എങ്കിലുംഅവര്‍ക്ക് ഇടര്‍ച്ചയുണ്ടാക്കാതിരിക്കാന്‍ നീ കടലില്‍പോയി ചൂണ്ടയിടുക; ആദ്യം ലഭിക്കുന്ന മത്‌സ്യത്തിന്റെ വായ് തുറക്കുമ്പോള്‍ ഒരു നാണയം കണ്ടെത്തും. അതെടുത്ത് എനിക്കും നിനക്കുംവേണ്ടി അവര്‍ക്കു കൊടുക്കുക."}], "id": 26}, {"type": "fill", "q": "ദുഷിച്ചതും ________ തലമുറ അടയാളം അന്വേഷിക്കുന്നു. യോനായുടെ അടയാളമല്ലാതെ മറ്റൊരടയാളവും അതിനു നല്‍കപ്പെടുകയില്ല. അനന്തരം അവന്‍ അവരെ വിട്ടുപോയി. (16:4)", "answer": "അവിശ്വസ്തവുമായ", "refs": ["16:4"], "id": 27, "evidence": [{"ref": "16:4", "text": "ദുഷിച്ചതും അവിശ്വസ്തവുമായ തലമുറ അടയാളം അന്വേഷിക്കുന്നു. യോനായുടെ അടയാളമല്ലാതെ മറ്റൊരടയാളവും അതിനു നല്‍കപ്പെടുകയില്ല. അനന്തരം അവന്‍ അവരെ വിട്ടുപോയി."}], "options": ["വിശ്വാസമില്ലാത്തതുമായ", "വഴിപിഴച്ചതുമായ", "കപടനാട്യമുള്ളതുമായ", "അവിശ്വസ്തവുമായ"], "optionAnswer": 3}, {"type": "fill", "q": "യേശു ഇതറിഞ്ഞ് അവരോടുചോദിച്ചു: ________, അപ്പം ഇല്ലാത്തതിനെപ്പറ്റി നിങ്ങള്‍ പരസ്പരം സംസാരിക്കുന്നതെന്തിന്? (16:8)", "answer": "അല്‍പവിശ്വാസികളേ", "refs": ["16:8"], "id": 28, "evidence": [{"ref": "16:8", "text": "യേശു ഇതറിഞ്ഞ് അവരോടുചോദിച്ചു: അല്‍പവിശ്വാസികളേ, അപ്പം ഇല്ലാത്തതിനെപ്പറ്റി നിങ്ങള്‍ പരസ്പരം സംസാരിക്കുന്നതെന്തിന്?"}], "options": ["അല്‍പവിശ്വാസികളേ", "വിശ്വാസമില്ലാത്തവരേ", "വഴിപിഴച്ചവരേ", "അന്ധരായവരേ"], "optionAnswer": 0}, {"type": "fill", "q": "യേശു അവനോട് അരുളിച്ചെയ്തു: യോനായുടെ പുത്രനായ ശിമയോനേ, നീ ഭാഗ്യവാന്‍! ________, സ്വര്‍ഗസ്ഥനായ എന്റെ പിതാവാണ് നിനക്ക് ഇതു വെളിപ്പെടുത്തിത്തന്നത്. (16:17)", "answer": "മാംസരക്തങ്ങളല്ല", "refs": ["16:17"], "id": 29, "evidence": [{"ref": "16:17", "text": "യേശു അവനോട് അരുളിച്ചെയ്തു: യോനായുടെ പുത്രനായ ശിമയോനേ, നീ ഭാഗ്യവാന്‍! മാംസരക്തങ്ങളല്ല, സ്വര്‍ഗസ്ഥനായ എന്റെ പിതാവാണ് നിനക്ക് ഇതു വെളിപ്പെടുത്തിത്തന്നത്."}], "options": ["നിന്റെ ചിന്തയല്ല", "പ്രവാചകന്മാരല്ല", "മനുഷ്യരുടെ ശക്തിയല്ല", "മാംസരക്തങ്ങളല്ല"], "optionAnswer": 3}, {"type": "fill", "q": "യേശു തിരിഞ്ഞ് പത്രോസിനോടു പറഞ്ഞു: സാത്താനേ, എന്റെ മുമ്പില്‍ നിന്നുപോകൂ, നീ എനിക്കു ________. നിന്റെ ചിന്ത ദൈവികമല്ല, മാനുഷികമാണ്. (16:23)", "answer": "പ്രതിബന്ധമാണ്", "refs": ["16:23"], "id": 30, "evidence": [{"ref": "16:23", "text": "യേശു തിരിഞ്ഞ് പത്രോസിനോടു പറഞ്ഞു: സാത്താനേ, എന്റെ മുമ്പില്‍ നിന്നുപോകൂ, നീ എനിക്കു പ്രതിബന്ധമാണ്. നിന്റെ ചിന്ത ദൈവികമല്ല, മാനുഷികമാണ്."}], "options": ["മാർഗദർശിയാണ്", "ശുശ്രൂഷകനാണ്", "പ്രതിബന്ധമാണ്", "അവകാശിയാണ്"], "optionAnswer": 2}, {"type": "fill", "q": "മനുഷ്യപുത്രന്‍ സ്വപിതാവിന്റെ മഹത്വത്തില്‍ തന്റെ ദൂതന്‍മാരോടൊത്തു വരാനിരിക്കുന്നു. അപ്പോള്‍ അവന്‍ ഓരോരുത്തര്‍ക്കും ________ പ്രതിഫലം നല്‍കും. (16:27)", "answer": "താന്താങ്ങളുടെ പ്രവൃത്തിക്കനുസരിച്ചു", "refs": ["16:27"], "id": 31, "evidence": [{"ref": "16:27", "text": "മനുഷ്യപുത്രന്‍ സ്വപിതാവിന്റെ മഹത്വത്തില്‍ തന്റെ ദൂതന്‍മാരോടൊത്തു വരാനിരിക്കുന്നു. അപ്പോള്‍ അവന്‍ ഓരോരുത്തര്‍ക്കും താന്താങ്ങളുടെ പ്രവൃത്തിക്കനുസരിച്ചു പ്രതിഫലം നല്‍കും."}], "options": ["താന്താങ്ങളുടെ പ്രവൃത്തിക്കനുസരിച്ചു", "താന്താങ്ങളുടെ അപേക്ഷയ്ക്കനുസരിച്ചു", "താന്താങ്ങളുടെ അറിവിനനുസരിച്ചു", "താന്താങ്ങളുടെ വിശ്വാസത്തിനനുസരിച്ചു"], "optionAnswer": 0}, {"type": "fill", "q": "അവന്‍ സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോള്‍ ________ ഒരുമേഘംവന്ന് അവരെ ആവരണം ചെയ്തു. മേഘത്തില്‍നിന്ന് ഇങ്ങനെയൊരു സ്വരമുണ്ടായി: ഇവന്‍ എന്റെ പ്രിയപുത്രന്‍; ഇവനില്‍ ഞാന്‍ പ്രസാദിച്ചിരിക്കുന്നു. ഇവന്റെ വാക്കു ശ്രവിക്കുവിന്‍. (17:5)", "answer": "ശോഭയേറിയ", "refs": ["17:5"], "id": 32, "evidence": [{"ref": "17:5", "text": "അവന്‍ സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോള്‍ ശോഭയേറിയ ഒരുമേഘംവന്ന് അവരെ ആവരണം ചെയ്തു. മേഘത്തില്‍നിന്ന് ഇങ്ങനെയൊരു സ്വരമുണ്ടായി: ഇവന്‍ എന്റെ പ്രിയപുത്രന്‍; ഇവനില്‍ ഞാന്‍ പ്രസാദിച്ചിരിക്കുന്നു. ഇവന്റെ വാക്കു ശ്രവിക്കുവിന്‍."}], "options": ["വലിയ", "ഇരുണ്ട", "ശോഭയേറിയ", "ചെമന്ന"], "optionAnswer": 2}, {"type": "fill", "q": "യേശു പ്രതിവചിച്ചു: വിശ്വാസമില്ലാത്തതും ________ തലമുറയേ, എത്രനാള്‍ ഞാന്‍ നിങ്ങളുടെ കൂടെയുണ്ടായിരിക്കും! എത്രനാള്‍ ഞാന്‍ നിങ്ങളോടു ക്ഷമിച്ചിരിക്കും! അവനെ ഇവിടെ എന്റെ അടുത്തു കൊണ്ടുവരിക. (17:17)", "answer": "വഴിപിഴച്ചതുമായ", "refs": ["17:17"], "id": 33, "evidence": [{"ref": "17:17", "text": "യേശു പ്രതിവചിച്ചു: വിശ്വാസമില്ലാത്തതും വഴിപിഴച്ചതുമായ തലമുറയേ, എത്രനാള്‍ ഞാന്‍ നിങ്ങളുടെ കൂടെയുണ്ടായിരിക്കും! എത്രനാള്‍ ഞാന്‍ നിങ്ങളോടു ക്ഷമിച്ചിരിക്കും! അവനെ ഇവിടെ എന്റെ അടുത്തു കൊണ്ടുവരിക."}], "options": ["അവിശ്വസ്തവുമായ", "ദുഷിച്ചതുമായ", "വഴിപിഴച്ചതുമായ", "കപടനാട്യമുള്ളതുമായ"], "optionAnswer": 2}, {"type": "fill", "q": "അവന്‍ പ്രതിവചിച്ചു: വൈകുന്നേരം നിങ്ങള്‍ പറയുന്നു: ആകാശംചെമന്നിരിക്കുന്നു; കാലാവസ്ഥ ________. (16:2)", "answer": "പ്രസന്നമായിരിക്കും", "options": ["മൂടിയിരിക്കും", "ശോഭയേറിയതായിരിക്കും", "പ്രസന്നമായിരിക്കും", "ചെമന്നിരിക്കും"], "optionAnswer": 2, "refs": ["16:2"], "evidence": [{"ref": "16:2", "text": "അവന്‍ പ്രതിവചിച്ചു: വൈകുന്നേരം നിങ്ങള്‍ പറയുന്നു: ആകാശംചെമന്നിരിക്കുന്നു; കാലാവസ്ഥ പ്രസന്നമായിരിക്കും."}], "id": 34}, {"type": "fill", "q": "ഞാന്‍ ________ സംസാരിച്ചതെന്നു നിങ്ങള്‍ മനസ്‌സിലാക്കാത്തതെന്തുകൊണ്ട്? ഫരിസേയരുടെയും സദുക്കായരുടെയും പുളിമാവിനെ സൂക്ഷിച്ചുകൊള്ളുവിന്‍. (16:11)", "answer": "അപ്പത്തെപ്പറ്റിയല്ല", "options": ["പ്രബോധനത്തെപ്പറ്റിയല്ല", "പുളിമാവിനെപ്പറ്റിയല്ല", "അടയാളത്തെപ്പറ്റിയല്ല", "അപ്പത്തെപ്പറ്റിയല്ല"], "optionAnswer": 3, "refs": ["16:11"], "evidence": [{"ref": "16:11", "text": "ഞാന്‍ അപ്പത്തെപ്പറ്റിയല്ല സംസാരിച്ചതെന്നു നിങ്ങള്‍ മനസ്‌സിലാക്കാത്തതെന്തുകൊണ്ട്? ഫരിസേയരുടെയും സദുക്കായരുടെയും പുളിമാവിനെ സൂക്ഷിച്ചുകൊള്ളുവിന്‍."}], "id": 35}, {"type": "fill", "q": "സ്വന്തം ജീവന്‍ രക്ഷിക്കുവാന്‍ ആഗ്രഹിക്കുന്നവന്‍ അതു നഷ്ടപ്പെടുത്തും; എന്നാല്‍, ആരെങ്കിലും ________ സ്വജീവന്‍ നഷ്ടപ്പെടുത്തിയാല്‍ അവന്‍ അതു കണ്ടെത്തും. (16:25)", "answer": "എനിക്കുവേണ്ടി", "options": ["സ്വന്തം ആത്മാവിനുവേണ്ടി", "എനിക്കുവേണ്ടി", "ജനങ്ങൾക്കുവേണ്ടി", "ശിഷ്യന്മാർക്കുവേണ്ടി"], "optionAnswer": 1, "refs": ["16:25"], "evidence": [{"ref": "16:25", "text": "സ്വന്തം ജീവന്‍ രക്ഷിക്കുവാന്‍ ആഗ്രഹിക്കുന്നവന്‍ അതു നഷ്ടപ്പെടുത്തും; എന്നാല്‍, ആരെങ്കിലും എനിക്കുവേണ്ടി സ്വജീവന്‍ നഷ്ടപ്പെടുത്തിയാല്‍ അവന്‍ അതു കണ്ടെത്തും."}], "id": 36}, {"type": "fill", "q": "മോശയും ഏലിയായും അവനോടു ________ അവര്‍ കണ്ടു. (17:3)", "answer": "സംസാരിക്കുന്നതായി", "options": ["രൂപാന്തരപ്പെടുന്നതായി", "പ്രണമിക്കുന്നതായി", "സംസാരിക്കുന്നതായി", "പ്രാർഥിക്കുന്നതായി"], "optionAnswer": 2, "refs": ["17:3"], "evidence": [{"ref": "17:3", "text": "മോശയും ഏലിയായും അവനോടു സംസാരിക്കുന്നതായി അവര്‍ കണ്ടു."}], "id": 37}, {"type": "fill", "q": "അവര്‍ ________ യേശുവിനെയല്ലാതെ മറ്റാരെയും കണ്ടില്ല. (17:8)", "answer": "കണ്ണുകളുയര്‍ത്തിനോക്കിയപ്പോള്‍", "options": ["കണ്ണുകളുയര്‍ത്തിനോക്കിയപ്പോള്‍", "മലയിൽനിന്നിറങ്ങിയപ്പോൾ", "മേഘം മറഞ്ഞപ്പോൾ", "കമിഴ്ന്നുവീണപ്പോൾ"], "optionAnswer": 0, "refs": ["17:8"], "evidence": [{"ref": "17:8", "text": "അവര്‍ കണ്ണുകളുയര്‍ത്തിനോക്കിയപ്പോള്‍ യേശുവിനെയല്ലാതെ മറ്റാരെയും കണ്ടില്ല."}], "id": 38}, {"type": "fill", "q": "ഞാന്‍ അവനെ നിന്റെ ശിഷ്യന്‍മാരുടെ അടുത്തുകൊണ്ടുവന്നു. പക്‌ഷേ, അവനെ ________ അവര്‍ക്കു കഴിഞ്ഞില്ല. (17:16)", "answer": "സുഖപ്പെടുത്താന്‍", "options": ["വിശ്വസിക്കാൻ", "സുഖപ്പെടുത്താന്‍", "ക്ഷമിക്കാൻ", "ബഹിഷ്കരിക്കാൻ"], "optionAnswer": 1, "refs": ["17:16"], "evidence": [{"ref": "17:16", "text": "ഞാന്‍ അവനെ നിന്റെ ശിഷ്യന്‍മാരുടെ അടുത്തുകൊണ്ടുവന്നു. പക്‌ഷേ, അവനെ സുഖപ്പെടുത്താന്‍ അവര്‍ക്കു കഴിഞ്ഞില്ല."}], "id": 39}, {"type": "fill", "q": "നിങ്ങള്‍ക്ക്‌യാതൊന്നും ________. (17:21)", "answer": "അസാധ്യമായിരിക്കുകയില്ല", "options": ["അവസാനമായിരിക്കുകയില്ല", "മാനുഷികമായിരിക്കുകയില്ല", "പ്രസന്നമായിരിക്കുകയില്ല", "അസാധ്യമായിരിക്കുകയില്ല"], "optionAnswer": 3, "refs": ["17:21"], "evidence": [{"ref": "17:21", "text": "നിങ്ങള്‍ക്ക്‌യാതൊന്നും അസാധ്യമായിരിക്കുകയില്ല."}], "id": 40}, {"type": "match", "q": "വചനവും അതിന്റെ സന്ദർഭവും യോജിപ്പിക്കുക.", "rows": [["അപ്പത്തിന്റെ പുളിമാവിനെപ്പറ്റിയല്ല", "പ്രബോധനത്തെക്കുറിച്ചുള്ള തിരിച്ചറിവ്"], ["സ്വന്തം ആത്മാവിനുപകരമായി", "ലോകം മുഴുവൻ നേടുന്നതിന്റെ പ്രയോജനം"], ["എല്ലാം പുനഃസ്ഥാപിക്കുക", "ഏലിയായെക്കുറിച്ചുള്ള മറുപടി"], ["പുത്രന്‍മാര്‍ സ്വതന്ത്രരാണല്ലോ", "നികുതിയോ ചുങ്കമോ പിരിക്കുന്നത്"]], "refs": ["16:12", "16:26", "17:11", "17:26"], "id": 41, "evidence": [{"ref": "16:12", "text": "അപ്പത്തിന്റെ പുളിമാവിനെപ്പറ്റിയല്ല ഫരിസേയരുടെയും സദുക്കായരുടെയും പ്രബോധനത്തെപ്പറ്റിയാണ് സൂക്ഷിച്ചുകൊള്ളാന്‍ അവന്‍ അരുളിച്ചെയ്തതെന്ന് അവര്‍ക്ക് അപ്പോള്‍ മനസ്‌സിലായി."}, {"ref": "16:26", "text": "ഒരുവന്‍ ലോകം മുഴുവന്‍ നേടിയാലും സ്വന്തം ആത്മാവിനെ നഷ്ടപ്പെടുത്തിയാല്‍ അവന് എന്തു പ്രയോജനം? ഒരുവന്‍ സ്വന്തം ആത്മാവിനുപകരമായി എന്തു കൊടുക്കും?"}, {"ref": "17:11", "text": "അവന്‍ പറഞ്ഞു: ഏലിയാ വന്ന് എല്ലാം പുനഃസ്ഥാപിക്കുക തന്നെ ചെയ്യും."}, {"ref": "17:26", "text": "അന്യരില്‍ നിന്ന് വ പത്രോസ് മറുപടി പറഞ്ഞു. യേശു തുടര്‍ന്നു: അപ്പോള്‍ പുത്രന്‍മാര്‍ സ്വതന്ത്രരാണല്ലോ;"}]}, {"type": "match", "q": "പ്രസ്താവനയിലെ സംഖ്യയോ അളവോ യോജിപ്പിക്കുക.", "rows": [["അയ്യായിരം പേരുടെ അപ്പം", "അഞ്ച്"], ["നാലായിരം പേരുടെ അപ്പം", "ഏഴ്"], ["രൂപാന്തരത്തിനു മുമ്പുള്ള ഇടവേള", "ആറു ദിവസം"], ["വിശ്വാസത്തിന് നൽകിയ ഉപമ", "കടുകുമണി"]], "refs": ["16:9", "16:10", "17:1", "17:20"], "id": 42, "evidence": [{"ref": "16:9", "text": "നിങ്ങള്‍ ഗ്രഹിക്കുന്നില്ലയോ? അയ്യായിരം പേരുടെ അഞ്ചപ്പം നിങ്ങള്‍ ഓര്‍മിക്കുന്നില്ലേ? എത്ര കുട്ട അപ്പക്കഷണങ്ങള്‍ നിങ്ങള്‍ശേഖരിച്ചു?"}, {"ref": "16:10", "text": "നാലായിരം പേരുടെ ഏഴപ്പവും നിങ്ങള്‍ ഓര്‍മിക്കുന്നില്ലേ? അന്ന് എത്ര കുട്ടകളാണ് നിങ്ങള്‍ നിറച്ചത്?"}, {"ref": "17:1", "text": "യേശു, ആറു ദിവസം കഴിഞ്ഞ് പത്രോസ്, യാക്കോബ്, അവന്റെ സഹോദരന്‍ യോഹന്നാന്‍ എന്നിവരെ മാത്രം കൂട്ടിക്കൊണ്ട് ഒരു ഉയര്‍ന്ന മലയിലേക്കുപോയി."}, {"ref": "17:20", "text": "യേശു പറഞ്ഞു: നിങ്ങളുടെ അല്‍പവിശ്വാസം കൊണ്ടു തന്നെ. സത്യമായി ഞാന്‍ നിങ്ങളോടു പറയുന്നു: നിങ്ങള്‍ക്കു കടുകുമണിയോളം വിശ്വാസമുണ്ടെങ്കില്‍ ഈ മലയോട്, ഇവിടെ നിന്നു മാറി മറ്റൊരു സ്ഥലത്തേക്കു പോവുക, എന്നു പറഞ്ഞാല്‍ അതു മാറിപ്പോകും."}]}, {"type": "match", "q": "വചനങ്ങളുടെ തുടക്കവും അവസാനവും യോജിപ്പിക്കുക.", "rows": [["ആകാശത്തിന്റെ ഭാവഭേദങ്ങൾ തിരിച്ചറിയാൻ കഴിയുന്നു", "കാലത്തിന്റെ അടയാളങ്ങൾ തിരിച്ചറിയാൻ കഴിയുകയില്ലേ?"], ["ലോകം മുഴുവൻ നേടിയാലും", "സ്വന്തം ആത്മാവിനെ നഷ്ടപ്പെടുത്തിയാൽ എന്തു പ്രയോജനം?"], ["സ്വപിതാവിന്റെ മഹത്വത്തിൽ", "തന്റെ ദൂതന്മാരോടൊത്തു വരാനിരിക്കുന്നു"], ["മനുഷ്യപുത്രൻ മനുഷ്യരുടെ", "കൈകളിൽ ഏൽപിക്കപ്പെടാൻ പോകുന്നു"]], "refs": ["16:3", "16:26", "16:27", "17:22"], "evidence": [{"ref": "16:3", "text": "രാവിലെ നിങ്ങള്‍ പറയുന്നു: ആകാശം ചെമന്നു മൂടിയിരിക്കുന്നു; ഇന്നു കാറ്റും കോളും ഉണ്ടാകും. ആകാശത്തിന്റെ ഭാവഭേദങ്ങള്‍ തിരിച്ചറിയാന്‍ നിങ്ങള്‍ക്കു കഴിയുന്നു. എന്നാല്‍, കാലത്തിന്റെ അടയാളങ്ങള്‍ തിരിച്ചറിയാന്‍ നിങ്ങള്‍ക്കു കഴിയുകയില്ലേ?"}, {"ref": "16:26", "text": "ഒരുവന്‍ ലോകം മുഴുവന്‍ നേടിയാലും സ്വന്തം ആത്മാവിനെ നഷ്ടപ്പെടുത്തിയാല്‍ അവന് എന്തു പ്രയോജനം? ഒരുവന്‍ സ്വന്തം ആത്മാവിനുപകരമായി എന്തു കൊടുക്കും?"}, {"ref": "16:27", "text": "മനുഷ്യപുത്രന്‍ സ്വപിതാവിന്റെ മഹത്വത്തില്‍ തന്റെ ദൂതന്‍മാരോടൊത്തു വരാനിരിക്കുന്നു. അപ്പോള്‍ അവന്‍ ഓരോരുത്തര്‍ക്കും താന്താങ്ങളുടെ പ്രവൃത്തിക്കനുസരിച്ചു പ്രതിഫലം നല്‍കും."}, {"ref": "17:22", "text": "അവര്‍ ഗലീലിയില്‍ ഒരുമിച്ചുകൂടിയപ്പോള്‍ യേശു അവരോടു പറഞ്ഞു: മനുഷ്യപുത്രന്‍മനുഷ്യരുടെ കൈകളില്‍ ഏല്‍പിക്കപ്പെടാന്‍ പോകുന്നു."}], "id": 43}, {"type": "match", "q": "ഇരുഅധ്യായങ്ങളിലെ പ്രതികരണവും തുടർന്നുള്ള വചനവും യോജിപ്പിക്കുക.", "rows": [["അപ്പം ഇല്ലാത്തതിനെക്കുറിച്ചു സംസാരിക്കുന്നു", "നിങ്ങൾ ഗ്രഹിക്കുന്നില്ലയോ?"], ["പത്രോസ് തടസ്സം പറയുന്നു", "നിന്റെ ചിന്ത ദൈവികമല്ല, മാനുഷികമാണ്"], ["ശിഷ്യന്മാർ ദർശനത്തെക്കുറിച്ച് കേൾക്കുന്നു", "എഴുന്നേൽക്കുവിൻ, ഭയപ്പെടേണ്ടാ"], ["എന്തുകൊണ്ട് ബഹിഷ്കരിക്കാനായില്ല?", "നിങ്ങളുടെ അൽപവിശ്വാസം കൊണ്ടു തന്നെ"]], "refs": ["16:8", "16:9", "16:22", "16:23", "17:6", "17:7", "17:19", "17:20"], "evidence": [{"ref": "16:8", "text": "യേശു ഇതറിഞ്ഞ് അവരോടുചോദിച്ചു: അല്‍പവിശ്വാസികളേ, അപ്പം ഇല്ലാത്തതിനെപ്പറ്റി നിങ്ങള്‍ പരസ്പരം സംസാരിക്കുന്നതെന്തിന്?"}, {"ref": "16:9", "text": "നിങ്ങള്‍ ഗ്രഹിക്കുന്നില്ലയോ? അയ്യായിരം പേരുടെ അഞ്ചപ്പം നിങ്ങള്‍ ഓര്‍മിക്കുന്നില്ലേ? എത്ര കുട്ട അപ്പക്കഷണങ്ങള്‍ നിങ്ങള്‍ശേഖരിച്ചു?"}, {"ref": "16:22", "text": "പത്രോസ് അവനെ മാറ്റിനിറുത്തി തടസ്‌സം പറയാന്‍ തുടങ്ങി: ദൈവം കനിയട്ടെ! കര്‍ത്താവേ, ഇതൊരിക്കലും നിനക്കു സംഭവിക്കാതിരിക്കട്ടെ."}, {"ref": "16:23", "text": "യേശു തിരിഞ്ഞ് പത്രോസിനോടു പറഞ്ഞു: സാത്താനേ, എന്റെ മുമ്പില്‍ നിന്നുപോകൂ, നീ എനിക്കു പ്രതിബന്ധമാണ്. നിന്റെ ചിന്ത ദൈവികമല്ല, മാനുഷികമാണ്."}, {"ref": "17:6", "text": "ഇതുകേട്ട ക്ഷണത്തില്‍ ശിഷ്യന്‍മാര്‍ കമിഴ്ന്നു വീണു; അവര്‍ ഭയവിഹ്വലരായി."}, {"ref": "17:7", "text": "യേശു സമീപിച്ച് അവരെ സ്പര്‍ശിച്ചുകൊണ്ടു പറഞ്ഞു: എഴുന്നേല്‍ക്കുവിന്‍, ഭയപ്പെടേണ്ടാ."}, {"ref": "17:19", "text": "അനന്തരം ശിഷ്യന്‍മാര്‍ തനിച്ച് യേശുവിനെ സമീപിച്ചു ചോദിച്ചു. എന്തുകൊണ്ടാണ് അതിനെ ബഹിഷ്‌കരിക്കാന്‍ ഞങ്ങള്‍ക്കു കഴിയാതെ പോയത്?"}, {"ref": "17:20", "text": "യേശു പറഞ്ഞു: നിങ്ങളുടെ അല്‍പവിശ്വാസം കൊണ്ടു തന്നെ. സത്യമായി ഞാന്‍ നിങ്ങളോടു പറയുന്നു: നിങ്ങള്‍ക്കു കടുകുമണിയോളം വിശ്വാസമുണ്ടെങ്കില്‍ ഈ മലയോട്, ഇവിടെ നിന്നു മാറി മറ്റൊരു സ്ഥലത്തേക്കു പോവുക, എന്നു പറഞ്ഞാല്‍ അതു മാറിപ്പോകും."}], "id": 44}, {"type": "tf", "q": "താൻ ക്രിസ്തുവാണെന്ന് ആരോടും പറയരുതെന്ന് യേശു ശിഷ്യന്മാരോട് കൽപിച്ചു.", "answer": true, "refs": ["16:20"], "id": 45, "evidence": [{"ref": "16:20", "text": "അനന്തരം അവന്‍ , താന്‍ ക്രിസ്തുവാണെന്ന് ആരോടും പറയരുതെന്നു ശിഷ്യന്‍മാരോടു കല്‍പിച്ചു."}]}, {"type": "tf", "q": "ഇവിടെ നിൽക്കുന്നവരിൽ എല്ലാവരും മനുഷ്യപുത്രൻ രാജ്യത്തിൽ വരുന്നതു ദർശിക്കുന്നതിനുമുമ്പ് മരിക്കുകയില്ല എന്നാണ് പറഞ്ഞത്.", "answer": false, "refs": ["16:28"], "id": 46, "evidence": [{"ref": "16:28", "text": "മനുഷ്യപുത്രന്‍ തന്റെ രാജ്യത്തില്‍ വരുന്നതു ദര്‍ശിക്കുന്നതിനുമുമ്പ് ഇവിടെ നില്‍ക്കുന്നവരില്‍ ചിലര്‍ മരിക്കുകയില്ലെന്നു സത്യമായി ഞാന്‍ നിങ്ങളോടു പറയുന്നു."}]}, {"type": "tf", "q": "രണ്ടാം പീഡാനുഭവപ്രവചനം കേട്ട് ശിഷ്യന്മാർ അതീവ ദുഃഖിതരായി.", "answer": true, "refs": ["17:23"], "id": 47, "evidence": [{"ref": "17:23", "text": "അവര്‍ അവനെ വധിക്കും; എന്നാല്‍ മൂന്നാം ദിവസം അവന്‍ ഉയിര്‍പ്പിക്കപ്പെടും. ഇതുകേട്ട് അവര്‍ അതീവ ദുഃഖിതരായിത്തീര്‍ന്നു."}]}, {"type": "tf", "q": "പുളിമാവിനെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിലെ ആദ്യ കൽപന «ശ്രദ്ധിക്കുവിൻ» ആണ്.", "answer": true, "refs": ["16:6"], "evidence": [{"ref": "16:6", "text": "യേശു പറഞ്ഞു: ശ്രദ്ധിക്കുവിന്‍; ഫരിസേയരുടെയും സദുക്കായരുടെയും പുളിമാവിനെ സൂക്ഷിച്ചുകൊള്ളുവിന്‍."}], "id": 48}, {"type": "tf", "q": "പിശാച് ബാലനെ വിട്ടുപോയശേഷം അടുത്ത ദിവസം ബാലൻ സുഖംപ്രാപിച്ചു എന്നാണ് രേഖപ്പെടുത്തുന്നത്.", "answer": false, "refs": ["17:18"], "evidence": [{"ref": "17:18", "text": "യേശു അവനെ ശാസിച്ചു. പിശാച് അവനെ വിട്ടുപോയി. തത്ക്ഷണം ബാലന്‍ സുഖംപ്രാപിച്ചു."}], "id": 49}, {"type": "tf", "q": "ദേവാലയനികുതി നൽകാനുള്ള നിർദേശത്തിൽ വല വീശാനാണ് പത്രോസിനോട് പറയുന്നത്.", "answer": false, "refs": ["17:27"], "evidence": [{"ref": "17:27", "text": "എങ്കിലുംഅവര്‍ക്ക് ഇടര്‍ച്ചയുണ്ടാക്കാതിരിക്കാന്‍ നീ കടലില്‍പോയി ചൂണ്ടയിടുക; ആദ്യം ലഭിക്കുന്ന മത്‌സ്യത്തിന്റെ വായ് തുറക്കുമ്പോള്‍ ഒരു നാണയം കണ്ടെത്തും. അതെടുത്ത് എനിക്കും നിനക്കുംവേണ്ടി അവര്‍ക്കു കൊടുക്കുക."}], "id": 50}]};

const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.normalize('NFC').trim().replace(/\s+/g,' ').replace(/\u200c|\u200d/g,'').replace(/ണ്/g,'ൺ').replace(/ന്/g,'ൻ').replace(/ര്/g,'ർ').replace(/ല്/g,'ൽ').replace(/ള്/g,'ൾ').replace(/ക്/g,'ൿ');
const labels={mc:'ശരിയായത് തിരഞ്ഞെടുക്കുക',fill:'വിട്ടുപോയ ഭാഗത്തിന് ശരിയായത് തിരഞ്ഞെടുക്കുക',match:'കൂട്ടിയിണക്കുക',tf:'ശരിയോ തെറ്റോ?'};
function right(q){return q.type==='mc'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.type==='tf'?(q.answer?'ശരി':'തെറ്റ്'):q.type==='match'?q.rows.map(r=>r[0]+' → '+r[1]).join('\n'):q.answer;}
function userText(q,a){return q.type==='mc'?String.fromCharCode(65+a)+'. '+q.options[a]:q.type==='tf'?(a?'ശരി':'തെറ്റ്'):q.type==='match'?q.rows.map((r,i)=>r[0]+' → '+q.rows[a[i]][1]).join('\n'):q.type==='fill'?q.options[a]:a;}
function saveDraft(){const q=quiz.questions[current];if(responses[current])return;drafts[current]=q.type==='match'?q.rows.map((_,i)=>$('match-'+i).value):document.querySelector('input[name="answer"]:checked')?.value??null;}
function answerSelected(){if(responses[current])return;saveDraft();const q=quiz.questions[current],a=drafts[current];if(q.type==='match'){const selected=a.filter(x=>x!=='').length;$('notice').textContent=selected<q.rows.length?`കൂട്ടിയിണക്കിയത്: ${selected} / ${q.rows.length}`:'';if(selected!==q.rows.length)return;}if(a!==null)check();}
function render(){const q=quiz.questions[current],r=responses[current],a=drafts[current];const count=responses.filter(Boolean).length,score=responses.filter(x=>x?.correct).length;
$('position').textContent=`ചോദ്യം ${current+1} / ${total}`;$('score').textContent=`നിങ്ങളുടെ സ്കോർ: ${score} / ${total}`;$('remaining').textContent=`ബാക്കി: ${total-count}`;$('progress').max=total;$('progress').value=count;$('checked-count').textContent=`പരിശോധിച്ചത്: ${count} / ${total}`;
$('question-jump').innerHTML=quiz.questions.map((item,i)=>{const response=responses[i],state=response?(response.correct?'ശരിയായ ഉത്തരം':'തെറ്റായ ഉത്തരം'):'പരിശോധിച്ചിട്ടില്ല';return `<button type="button" data-jump="${i}" class="${response?(response.correct?'done-correct':'done-wrong'):''}" ${i===current?'aria-current="step"':''} aria-label="ചോദ്യം ${i+1}, ${state}">${i+1}${response?(response.correct?' ✓':' ✕'):''}</button>`;}).join('');$('question-jump').querySelectorAll('button').forEach(button=>button.onclick=()=>jumpTo(Number(button.dataset.jump)));
$('type').textContent=labels[q.type];$('question-title').textContent=`${current+1}. ${q.q}`;$('notice').textContent='';
if(q.type==='mc'||q.type==='fill'||q.type==='tf'){const opts=q.type==='tf'?['ശരി','തെറ്റ്']:q.options;$('controls').innerHTML='<fieldset style="border:0;padding:0;margin:0"><legend>നിങ്ങളുടെ ഉത്തരം തിരഞ്ഞെടുക്കുക</legend>'+opts.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${String(a)===String(i)?'checked':''} ${r?'disabled':''}><span>${q.type!=='tf'?String.fromCharCode(65+i)+'. ':''}${esc(o)}</span></label>`).join('')+'</fieldset>';
}else{const order=q.rows.map((_,i)=>i).sort((x,y)=>((x*3+1)%q.rows.length)-((y*3+1)%q.rows.length));if(order.every((x,i)=>x===i))order.reverse();$('controls').innerHTML=q.rows.map((row,i)=>`<div class="match-row"><label for="match-${i}">${i+1}. ${esc(row[0])}</label><select id="match-${i}" ${r?'disabled':''}><option value="">തിരഞ്ഞെടുക്കുക</option>${order.map(j=>`<option value="${j}" ${a&&String(a[i])===String(j)?'selected':''}>${esc(q.rows[j][1])}</option>`).join('')}</select></div>`).join('');}
$('feedback').innerHTML=r?feedback(q,r):'';$('prev').disabled=current===0;$('next').disabled=current===total-1;$('controls').querySelectorAll('input,select').forEach(control=>{control.oninput=answerSelected;control.onchange=answerSelected;if(q.type==='match')control.onblur=answerSelected;});
if(count===total)showResults();else{$('results').hidden=true;$('results').innerHTML='';}}
function feedback(q,r){const parts=q.type==='match'?'<div>'+q.rows.map((row,i)=>`<p>${i+1}. ${esc(row[0])}: ${r.value[i]===i?'ശരിയാണ്':'തെറ്റാണ്'}</p>`).join('')+'</div>':'';
return `<div tabindex="-1" class="feedback ${r.correct?'':'wrong'}"><div class="feedback-heading"><span class="status-icon" aria-hidden="true">${r.correct?'✓':'✕'}</span><strong>${r.correct?'ശരിയാണ് — 1 മാർക്ക്':'തെറ്റാണ് — 0 മാർക്ക്'}</strong></div>${parts}<p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,r.value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div><details><summary>വചനാധാരം കാണുക</summary>${q.evidence.map(e=>`<div class="evidence"><strong>${esc(e.label||'മത്തായി '+e.ref)}</strong><p>${esc(e.text)}</p></div>`).join('')}</details></div>`;}
function check(){if(responses[current])return;saveDraft();const q=quiz.questions[current],a=drafts[current];if(a===null||(q.type==='match'&&a.some(x=>x===''))){$('notice').textContent=q.type==='match'?'എല്ലാ കൂട്ടുകളും തിരഞ്ഞെടുക്കുക.':'ആദ്യം നിങ്ങളുടെ ഉത്തരം നൽകുക.';return;}
let value,correct;if(q.type==='mc'){value=Number(a);correct=value===q.answer;}else if(q.type==='tf'){value=a==='0';correct=value===q.answer;}else if(q.type==='fill'){value=Number(a);correct=value===q.optionAnswer;}else{value=a.map(Number);correct=value.every((x,i)=>x===i);}
responses[current]={value,correct};render();const target=$('feedback').firstElementChild;requestAnimationFrame(()=>{if(!target.isConnected)return;target.focus({preventScroll:true});target.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});target.classList.add(correct?'celebrate':'try-again');});}
function showResults(){const n=responses.filter(x=>x.correct).length;$('results').hidden=false;$('results').innerHTML=`<h2 id="results-title">ക്വിസ് പൂർത്തിയായി</h2><p><strong>നിങ്ങളുടെ സ്കോർ: ${n} / ${total}</strong></p><p>ശരിയായ ഉത്തരങ്ങൾ: ${n}<br>തെറ്റായ ഉത്തരങ്ങൾ: ${total-n}<br>ശതമാനം: ${Math.round(n/total*100)}%</p><h3>ഉത്തരങ്ങൾ പരിശോധിക്കാം</h3>`+quiz.questions.map((q,i)=>`<div class="review"><h3>${i+1}. ${esc(q.q)}</h3><p>${responses[i].correct?'ശരിയാണ്':'തെറ്റാണ്'}</p><p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,responses[i].value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div></div>`).join('');}
function jumpTo(index){if(!Number.isInteger(index)||index<0||index>=total)return;saveDraft();current=index;render();$('question-title').focus({preventScroll:true});$('question-panel').scrollIntoView({block:'start'});}function move(step){jumpTo(current+step);}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reset').onclick=()=>{current=0;responses=quiz.questions.map(()=>null);drafts=quiz.questions.map(()=>null);render();$('question-title').focus();window.scrollTo(0,0);};render();
</script></body></html>
