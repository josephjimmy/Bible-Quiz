'use strict';
const quiz={"range": "19-20", "title": "ജറുസലെമിലേക്കുള്ള യാത്ര: ശിഷ്യത്വവും ദൈവരാജ്യവും", "questions": [{"type": "mc", "q": "ഗലീലിവിട്ട യേശു എത്തിയ അതിർത്തി ഏത്?", "options": ["ഗലീലിക്കടുത്ത സമരിയായുടെ അതിർത്തി", "ജോർദാന് അക്കരെ യൂദയായുടെ അതിർത്തി", "ജറീക്കോയ്ക്കപ്പുറം ഗലീലിയുടെ അതിർത്തി", "ജോർദാന് ഇക്കരെ യൂദയായുടെ അതിർത്തി"], "answer": 1, "refs": ["19:1"], "id": 1, "evidence": [{"ref": "19:1", "text": "ഈ വാക്കുകള്‍ അവസാനിപ്പിച്ചശേഷം, യേശു ഗലീലിവിട്ട് ജോര്‍ദാന് അക്കരെയൂദയായുടെ അതിര്‍ത്തിയിലെത്തി."}]}, {"type": "mc", "q": "ഉപേക്ഷാപത്രത്തെക്കുറിച്ചുള്ള ചോദ്യം ആരാണ് ഉന്നയിച്ചത്?", "options": ["ശിഷ്യന്മാർ", "പത്രോസ്", "ആ യുവാവ്", "ഫരിസേയർ"], "answer": 3, "refs": ["19:7"], "id": 2, "evidence": [{"ref": "19:7", "text": "അവര്‍ അവനോടു ചോദിച്ചു: അങ്ങനെയെങ്കില്‍ ഉപേക്ഷാപത്രം നല്‍കി ഭാര്യയെ ഉപേക്ഷിക്കാമെന്നു മോശ വിധിച്ചതെന്തുകൊണ്ട്?"}]}, {"type": "mc", "q": "ഈ ഉപദേശം ഗ്രഹിക്കുന്നവരെ വിശേഷിപ്പിക്കുന്നത് എങ്ങനെ?", "options": ["കൃപലഭിച്ചവർ", "സമ്പത്ത് ഉപേക്ഷിച്ചവർ", "പ്രമാണങ്ങൾ അനുസരിച്ചവർ", "ശിശുക്കളെ സ്വീകരിച്ചവർ"], "answer": 0, "refs": ["19:11"], "id": 3, "evidence": [{"ref": "19:11", "text": "അവന്‍ പറഞ്ഞു: കൃപലഭിച്ചവരല്ലാതെ മറ്റാരും ഈ ഉപദേശം ഗ്രഹിക്കുന്നില്ല."}]}, {"type": "mc", "q": "ഷണ്ഡരെക്കുറിച്ചുള്ള മൂന്നു വിഭാഗങ്ങളിൽ ഉൾപ്പെടാത്തത്?", "options": ["സ്വർഗ്ഗരാജ്യത്തെപ്രതി തങ്ങളെത്തന്നെ ഷണ്ഡരാക്കുന്നവർ", "ഷണ്ഡരായി ജനിച്ചവർ", "മനുഷ്യരാൽ ഷണ്ഡരാക്കപ്പെട്ടവർ", "ദാരിദ്ര്യംമൂലം ഷണ്ഡരായവർ"], "answer": 3, "refs": ["19:12"], "id": 4, "evidence": [{"ref": "19:12", "text": "എന്തെന്നാല്‍, ഷണ്ഡരായി ജനിക്കുന്നവരുണ്ട്; മനുഷ്യരാല്‍ ഷണ്ഡരാക്കപ്പെടുന്നവരുണ്ട്; സ്വര്‍ഗ്ഗരാജ്യത്തെപ്രതി തങ്ങളെത്തന്നെ ഷണ്ഡരാക്കുന്നവരുണ്ട്. ഗ്രഹിക്കാന്‍ കഴിവുള്ളവന്‍ ഗ്രഹിക്കട്ടെ."}]}, {"type": "mc", "q": "ശിശുക്കളെ കൊണ്ടുവന്നവരുടെ ഉദ്ദേശ്യം?", "options": ["യേശു അവർക്കു ജ്ഞാനസ്നാനം നൽകുക", "യേശു കൈകൾവച്ചു പ്രാർഥിക്കുക", "യേശു അവരെ ശിഷ്യപ്പെടുത്തുക", "യേശു അവരെ അനുഗമിക്കാൻ വിളിക്കുക"], "answer": 1, "refs": ["19:13"], "id": 5, "evidence": [{"ref": "19:13", "text": "യേശു കൈകള്‍വച്ചു പ്രാര്‍ഥിക്കുന്നതിനുവേണ്ടി ചിലര്‍ ശിശുക്കളെ അവന്റെ അടുത്തുകൊണ്ടുവന്നു. ശിഷ്യന്‍മാര്‍ അവരെ ശകാരിച്ചു."}]}, {"type": "mc", "q": "യുവാവിനുള്ള മറുപടിയിൽ «കള്ളസാക്ഷ്യം നൽകരുത്» എന്നതിനു പിന്നാലെയുള്ള കൽപന?", "options": ["വ്യഭിചാരം ചെയ്യരുത്", "പിതാവിനെയും മാതാവിനെയും ബഹുമാനിക്കുക", "മോഷ്ടിക്കരുത്", "നിന്നെപ്പോലെ അയൽക്കാരനെ സ്നേഹിക്കുക"], "answer": 1, "refs": ["19:18", "19:19"], "id": 6, "evidence": [{"ref": "19:18", "text": "അവന്‍ ചോദിച്ചു: ഏതെല്ലാം? യേശു പ്രതിവചിച്ചു: കൊല്ലരുത്, വ്യഭിചാരം ചെയ്യരുത്, മോഷ്ടിക്കരുത്, കള്ളസാക്ഷ്യം നല്‍കരുത്."}, {"ref": "19:19", "text": "പിതാവിനെയും മാതാവിനെയും ബഹുമാനിക്കുക, നിന്നെപ്പോലെ നിന്റെ അയല്‍ക്കാരനെ സ്‌നേഹിക്കുക."}]}, {"type": "mc", "q": "«അങ്ങനെയെങ്കിൽ രക്ഷപെടാൻ ആർക്കു സാധിക്കും?» എന്നു ചോദിച്ചവർ?", "options": ["ശിഷ്യന്മാർ", "ജനക്കൂട്ടം", "സെബദീപുത്രന്മാർ", "ഫരിസേയർ"], "answer": 0, "refs": ["19:25"], "id": 7, "evidence": [{"ref": "19:25", "text": "ശിഷ്യന്‍മാര്‍ ഇതുകേട്ട് വിസ്മയഭരിതരായി അവനോടുചോദിച്ചു: അങ്ങനെയെങ്കില്‍ രക്ഷപെടാന്‍ ആര്‍ക്കു സാധിക്കും?"}]}, {"type": "mc", "q": "പരിത്യജിക്കുന്നവർക്കുള്ള വാഗ്ദാനത്തിന്റെ പട്ടികയിൽ ഉൾപ്പെടാത്തത്?", "options": ["ഭാര്യ", "മക്കൾ", "വയലുകൾ", "സഹോദരികൾ"], "answer": 0, "refs": ["19:29"], "id": 8, "evidence": [{"ref": "19:29", "text": "എന്റെ നാമത്തെപ്രതി ഭവനത്തെയോ സഹോദരന്‍മാരെയോ സഹോദരികളെയോ പിതാവിനെയോ മാതാവിനെയോ മക്കളെയോ വയലുകളെയോ പരിത്യജിക്കുന്ന ഏതൊരുവനും നൂറിരട്ടി ലഭിക്കും; അവന്‍ നിത്യജീവന്‍ അവകാശമാക്കുകയും ചെയ്യും."}]}, {"type": "mc", "q": "മൂന്നാം മണിക്കൂറിൽ അലസരായി നിന്നവരെ കണ്ട സ്ഥലം?", "options": ["വീടിന്റെ മുറ്റം", "ചന്തസ്ഥലം", "മുന്തിരിത്തോട്ടം", "വഴിയരികു"], "answer": 1, "refs": ["20:3"], "id": 9, "evidence": [{"ref": "20:3", "text": "മൂന്നാം മണിക്കൂറില്‍ അവന്‍ പുറത്തേക്കിറങ്ങിയപ്പോള്‍ ചിലര്‍ ചന്തസ്ഥലത്ത് അലസരായി നില്‍ക്കുന്നതുകണ്ട് അവരോടു പറഞ്ഞു:"}]}, {"type": "mc", "q": "കൂലി കൊടുക്കാൻ ഉടമസ്ഥൻ നിർദേശിച്ചത് ആരോട്?", "options": ["ആദ്യം വന്നവനോട്", "ജോലിക്കാരിലെ പ്രമാണിയോട്", "കാര്യസ്ഥനോട്", "അവസാനം വന്നവനോട്"], "answer": 2, "refs": ["20:8"], "id": 10, "evidence": [{"ref": "20:8", "text": "വൈകുന്നേരമായപ്പോള്‍ മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമസ്ഥന്‍ കാര്യസ്ഥനോടു പറഞ്ഞു: ജോലിക്കാരെ വിളിച്ച് അവസാനം വന്നവര്‍ക്കു തുടങ്ങി ആദ്യം വന്നവര്‍ക്കുവരെ കൂലി കൊടുക്കുക."}]}, {"type": "mc", "q": "ആദ്യം വന്നവരുടെ പരാതിയിൽ അവർ സഹിച്ചതായി പറഞ്ഞ ജോഡി?", "options": ["പകലിന്റെ ചൂടും വിശപ്പും", "പകലിന്റെ വിശപ്പും ദാഹവും", "പകലിന്റെ അധ്വാനവും ദാഹവും", "പകലിന്റെ അധ്വാനവും ചൂടും"], "answer": 3, "refs": ["20:12"], "id": 11, "evidence": [{"ref": "20:12", "text": "അവസാനം വന്ന ഇവര്‍ ഒരു മണിക്കൂറേ ജോലി ചെയ്തുള്ളൂ; എന്നിട്ടും പകലിന്റെ അധ്വാനവും ചൂടും സഹിച്ച ഞങ്ങളോട് അവരെ നീ തുല്യരാക്കിയല്ലോ."}]}, {"type": "mc", "q": "വിജാതീയരുടെ പ്രവൃത്തികളുടെ പറഞ്ഞിരിക്കുന്ന ക്രമം?", "options": ["പരിഹസിക്കുക → ക്രൂശിക്കുക → പ്രഹരിക്കുക", "പ്രഹരിക്കുക → ക്രൂശിക്കുക → പരിഹസിക്കുക", "പരിഹസിക്കുക → പ്രഹരിക്കുക → ക്രൂശിക്കുക", "ക്രൂശിക്കുക → പരിഹസിക്കുക → പ്രഹരിക്കുക"], "answer": 2, "refs": ["20:19"], "id": 12, "evidence": [{"ref": "20:19", "text": "അവര്‍ അവനെ മരണത്തിനു വിധിക്കുകയും വിജാതീയര്‍ക്ക് ഏല്‍പിച്ചുകൊടുക്കുകയും ചെയ്യും. അവര്‍ അവനെ പരിഹസിക്കുകയും പ്രഹരിക്കുകയും ക്രൂശിക്കുകയും ചെയ്യും. എന്നാല്‍ മൂന്നാം ദിവസം അവന്‍ ഉയിര്‍പ്പിക്കപ്പെടും."}]}, {"type": "mc", "q": "വലത്തും ഇടത്തും ഇരിക്കാനുള്ള വരം ആർക്കുള്ളത്?", "options": ["ആദ്യം അപേക്ഷിച്ച രണ്ടു സഹോദരന്മാർക്കു", "എല്ലാം ഉപേക്ഷിച്ചവർക്കു മാത്രം", "പിതാവ് ആർക്കുവേണ്ടി സജ്ജമാക്കിയോ അവർക്കു", "പാനപാത്രം കുടിക്കാൻ സമ്മതിച്ചവർക്കു മാത്രം"], "answer": 2, "refs": ["20:23"], "id": 13, "evidence": [{"ref": "20:23", "text": "അവന്‍ അവരോടു പറഞ്ഞു: എന്റെ പാനപാത്രം തീര്‍ച്ചയായും നിങ്ങള്‍ കുടിക്കും. എന്നാല്‍, എന്റെ വലത്തുവശത്തും ഇടത്തുവശത്തും ഇരിക്കാനുള്ള വരം നിങ്ങള്‍ക്കു നല്‍കേണ്ടതു ഞാനല്ല; അത് എന്റെ പിതാവ് ആര്‍ക്കുവേണ്ടി സജ്ജമാക്കിയിരിക്കുന്നുവോ അവര്‍ക്കുള്ളതാണ്."}]}, {"type": "mc", "q": "ഭാര്യയെ ഉപേക്ഷിക്കുന്നതിനെക്കുറിച്ചുള്ള ഫരിസേയരുടെ ചോദ്യത്തിലെ കാരണപരിധി?", "options": ["പരസംഗംമൂലം മാത്രം", "ഹൃദയകാഠിന്യംമൂലം മാത്രം", "ഏതെങ്കിലും കാരണത്താൽ", "ഉപേക്ഷാപത്രം ഇല്ലാത്തതിനാൽ"], "answer": 2, "refs": ["19:3"], "evidence": [{"ref": "19:3", "text": "ഫരിസേയര്‍ അടുത്തുചെന്ന് അവനെ പരീക്ഷിച്ചുകൊണ്ടു ചോദിച്ചു: ഏതെങ്കിലും കാരണത്താല്‍ ഒരുവന്‍ ഭാര്യയെ ഉപേക്ഷിക്കുന്നത് നിയമാനുസൃതമാണോ?"}], "id": 14}, {"type": "mc", "q": "വിവാഹത്തെക്കുറിച്ചുള്ള മറുപടിയിൽ സ്രഷ്ടാവിന്റെ പ്രവൃത്തിക്ക് പറഞ്ഞ കാലസൂചന?", "options": ["മോശയുടെ കാലംമുതൽ", "ആദിമുതലേ", "പുനർജീവിതംമുതൽ", "നിയമം ലഭിച്ചതുമുതൽ"], "answer": 1, "refs": ["19:4"], "evidence": [{"ref": "19:4", "text": "അവന്‍ മറുപടി പറഞ്ഞു: സ്രഷ്ടാവ് ആദിമുതലേ അവരെ പുരുഷനും സ്ത്രീയുമായി സൃഷ്ടിച്ചു എന്നും,"}], "id": 15}, {"type": "mc", "q": "പുരുഷൻ പിതാവിനെയും മാതാവിനെയും വിട്ടശേഷം ചെയ്യുന്നതായി പറയുന്നത്?", "options": ["പന്ത്രണ്ടു ഗോത്രങ്ങളെ വിധിക്കും", "സ്വർഗരാജ്യത്തിനായി ഉപേക്ഷിക്കും", "ഭാര്യയോടു ചേർന്നിരിക്കും", "ശിശുക്കളെ സ്വീകരിക്കും"], "answer": 2, "refs": ["19:5"], "evidence": [{"ref": "19:5", "text": "ഇക്കാരണത്താല്‍ പുരുഷന്‍ പിതാവിനെയും മാതാവിനെയും വിട്ട് ഭാര്യയോടു ചേര്‍ന്നിരിക്കും; അവര്‍ ഇരുവരും ഏകശരീരമായിത്തീരും എന്ന് അവിടുന്ന് അരുളിച്ചെയ്തിട്ടുണ്ടെന്നും നിങ്ങള്‍ വായിച്ചിട്ടില്ലേ?"}], "id": 16}, {"type": "mc", "q": "വിവാഹം ചെയ്യാതിരിക്കുന്നതാണ് ഭേദമെന്ന അഭിപ്രായം പ്രകടിപ്പിച്ചത്?", "options": ["ഫരിസേയർ", "ആ യുവാവ്", "ജനക്കൂട്ടം", "ശിഷ്യന്മാർ"], "answer": 3, "refs": ["19:10"], "evidence": [{"ref": "19:10", "text": "ശിഷ്യന്‍മാര്‍ അവനോടു പറഞ്ഞു: ഭാര്യാഭര്‍തൃബന്ധം ഇത്തരത്തിലുള്ളതെങ്കില്‍, വിവാഹം ചെയ്യാതിരിക്കുന്നതാണല്ലോ ഭേദം."}], "id": 17}, {"type": "mc", "q": "ശിശുക്കളെ കൊണ്ടുവന്നവരോട് ശിഷ്യന്മാർ ചെയ്തത്?", "options": ["മിണ്ടാതിരിക്കാൻ ആവശ്യപ്പെട്ടു", "പ്രമാണങ്ങൾ അനുസരിക്കാൻ പറഞ്ഞു", "തടയരുതെന്ന് നിർദേശിച്ചു", "ശകാരിച്ചു"], "answer": 3, "refs": ["19:13"], "evidence": [{"ref": "19:13", "text": "യേശു കൈകള്‍വച്ചു പ്രാര്‍ഥിക്കുന്നതിനുവേണ്ടി ചിലര്‍ ശിശുക്കളെ അവന്റെ അടുത്തുകൊണ്ടുവന്നു. ശിഷ്യന്‍മാര്‍ അവരെ ശകാരിച്ചു."}], "id": 18}, {"type": "mc", "q": "ശിശുക്കളുടെമേൽ കൈകൾവച്ചശേഷം യേശു ചെയ്തത്?", "options": ["ഗലീലിയിലേക്കു മടങ്ങി", "അവിടെനിന്നു പോയി", "അവരെ സമീപിച്ചു", "ജനക്കൂട്ടത്തെ വിളിച്ചു"], "answer": 1, "refs": ["19:15"], "evidence": [{"ref": "19:15", "text": "അവന്‍ അവരുടെമേല്‍ കൈകള്‍വച്ചശേഷം അവിടെനിന്നു പോയി."}], "id": 19}, {"type": "mc", "q": "നിത്യജീവനെക്കുറിച്ചുള്ള ചോദ്യത്തിന്റെ കൃത്യമായ രൂപം?", "options": ["എന്തു പ്രമാണമാണ് ഉപേക്ഷിക്കേണ്ടത്?", "എന്തു നന്മയാണ് പ്രവർത്തിക്കേണ്ടത്?", "എത്ര പ്രാവശ്യമാണ് ക്ഷമിക്കേണ്ടത്?", "ഏതു കൽപനയാണ് അതിപ്രധാനമായത്?"], "answer": 1, "refs": ["19:16"], "evidence": [{"ref": "19:16", "text": "ഒരാള്‍ അവനെ സമീപിച്ചു ചോദിച്ചു: ഗുരോ, നിത്യജീവന്‍ പ്രാപിക്കാന്‍ ഞാന്‍ എന്തു നന്‍മയാണു പ്രവര്‍ത്തിക്കേണ്ടത്?(ലൂക്കാ"}], "id": 20}, {"type": "mc", "q": "യുവാവ് സങ്കടത്തോടെ തിരിച്ചുപോയതിന്റെ പറഞ്ഞിരിക്കുന്ന കാരണം?", "options": ["നിത്യജീവൻ ആഗ്രഹിച്ചില്ലായിരുന്നു", "വളരെയേറെ സമ്പത്തുണ്ടായിരുന്നു", "പ്രമാണങ്ങൾ അനുസരിച്ചിട്ടില്ലായിരുന്നു", "ഭാര്യയെ ഉപേക്ഷിച്ചിരുന്നു"], "answer": 1, "refs": ["19:22"], "evidence": [{"ref": "19:22", "text": "ഈ വചനം കേട്ട് ആയുവാവ് സങ്കടത്തോടെ തിരിച്ചുപോയി; അവന് വളരെയേറെ സമ്പത്തുണ്ടായിരുന്നു."}], "id": 21}, {"type": "mc", "q": "ഒട്ടകത്തെക്കുറിച്ചുള്ള താരതമ്യത്തിൽ കടക്കേണ്ടത്?", "options": ["മുന്തിരിത്തോട്ടത്തിന്റെ കവാടത്തിലൂടെ", "ഇടുങ്ങിയ കവാടത്തിലൂടെ", "സ്വർഗരാജ്യത്തിന്റെ വാതിലിലൂടെ", "സൂചിക്കുഴയിലൂടെ"], "answer": 3, "refs": ["19:24"], "evidence": [{"ref": "19:24", "text": "വീണ്ടും ഞാന്‍ നിങ്ങളോടു പറയുന്നു, ധനവാന്‍ സ്വര്‍ഗരാജ്യത്തില്‍ പ്രവേശിക്കുന്നതിനെക്കാള്‍ എളുപ്പം ഒട്ടകം സൂചിക്കുഴയിലൂടെ കടക്കുന്നതാണ്."}], "id": 22}, {"type": "mc", "q": "വീട്ടുടമസ്ഥൻ ആദ്യം ജോലിക്കാരെ വിളിക്കാൻ പുറപ്പെട്ട സമയം?", "options": ["മൂന്നാം മണിക്കൂറിൽ", "പതിനൊന്നാം മണിക്കൂറിൽ", "ആറാം മണിക്കൂറിൽ", "അതിരാവിലെ"], "answer": 3, "refs": ["20:1"], "evidence": [{"ref": "20:1", "text": "സ്വര്‍ഗരാജ്യം, തന്റെ മുന്തിരിത്തോട്ടത്തിലേക്കു ജോലിക്കാരെ വിളിക്കാന്‍ അതിരാവിലെ പുറപ്പെട്ട വീട്ടുടമസ്ഥനു സദൃശം."}], "id": 23}, {"type": "mc", "q": "മൂന്നാം മണിക്കൂറിനു ശേഷം പ്രത്യേകം ജോഡിയായി പറയുന്ന സമയങ്ങൾ?", "options": ["ആറാം മണിക്കൂറും ഒമ്പതാം മണിക്കൂറും", "മൂന്നാം മണിക്കൂറും ഒമ്പതാം മണിക്കൂറും", "ഒമ്പതാം മണിക്കൂറും പതിനൊന്നാം മണിക്കൂറും", "ആറാം മണിക്കൂറും പതിനൊന്നാം മണിക്കൂറും"], "answer": 0, "refs": ["20:5"], "evidence": [{"ref": "20:5", "text": "ആറാം മണിക്കൂറിലും ഒമ്പതാം മണിക്കൂറിലും പുറത്തേക്കിറങ്ങിയപ്പോഴും അവന്‍ ഇതുപോലെതന്നെചെയ്തു."}], "id": 24}, {"type": "mc", "q": "ആദ്യം വന്നവർ കൂലി ലഭിക്കുന്നതിനു മുമ്പ് കരുതിയത്?", "options": ["തങ്ങൾക്കു കൂടുതൽ ലഭിക്കും", "എല്ലാവർക്കും അര ദനാറ ലഭിക്കും", "തങ്ങൾക്കു കൂലി ലഭിക്കില്ല", "അവസാനം വന്നവർക്കു കൂടുതൽ ലഭിക്കും"], "answer": 0, "refs": ["20:10"], "evidence": [{"ref": "20:10", "text": "തങ്ങള്‍ക്കു കൂടുതല്‍ ലഭിക്കുമെന്ന് ആദ്യം വന്നവര്‍ വിചാരിച്ചു. എന്നാല്‍, അവര്‍ക്കും ഓരോ ദനാറ തന്നെ കിട്ടി."}], "id": 25}, {"type": "mc", "q": "അന്ധന്മാരോട് ജനക്കൂട്ടം മിണ്ടാതിരിക്കാൻ പറഞ്ഞപ്പോൾ അവരുടെ പ്രതികരണം?", "options": ["കൂടുതൽ ഉച്ചത്തിൽ നിലവിളിച്ചു", "യേശുവിന്റെ അടുത്തേക്കു മൗനമായി പോയി", "ശിഷ്യന്മാരുടെ സഹായം ചോദിച്ചു", "വഴിയരികിൽനിന്ന് മാറിനിന്നു"], "answer": 0, "refs": ["20:31"], "evidence": [{"ref": "20:31", "text": "മിണ്ടാതിരിക്കാന്‍ പറഞ്ഞുകൊണ്ട് ജനക്കൂട്ടം അവരെ ശാസിച്ചു. അവരാകട്ടെ, കര്‍ത്താവേ, ദാവീദിന്റെ പുത്രാ, ഞങ്ങളില്‍ കനിയണമേ എന്ന് കൂടുതല്‍ ഉച്ചത്തില്‍ നിലവിളിച്ചു പറഞ്ഞു."}], "id": 26}, {"type": "fill", "q": "അവന്‍ പറഞ്ഞു: നിങ്ങളുടെ ________ നിമിത്തമാണ് ഭാര്യയെ ഉപേക്ഷിക്കാന്‍ മോശ നിങ്ങള്‍ക്ക് അനുമതി നല്‍കിയത്. ആദിമുതലേ അങ്ങനെയായിരുന്നില്ല. (19:8)", "answer": "ഹൃദയകാഠിന്യം", "refs": ["19:8"], "id": 27, "evidence": [{"ref": "19:8", "text": "അവന്‍ പറഞ്ഞു: നിങ്ങളുടെ ഹൃദയകാഠിന്യം നിമിത്തമാണ് ഭാര്യയെ ഉപേക്ഷിക്കാന്‍ മോശ നിങ്ങള്‍ക്ക് അനുമതി നല്‍കിയത്. ആദിമുതലേ അങ്ങനെയായിരുന്നില്ല."}], "options": ["അജ്ഞത", "ഹൃദയകാഠിന്യം", "അസൂയ", "അൽപവിശ്വാസം"], "optionAnswer": 1}, {"type": "fill", "q": "യേശു പറഞ്ഞു: നീ പൂര്‍ണനാകാന്‍ ആഗ്രഹിക്കുന്നെങ്കില്‍, പോയി നിനക്കുള്ളതെല്ലാം വിറ്റ് ദരിദ്രര്‍ക്കുകൊടുക്കുക. അപ്പോള്‍ സ്വര്‍ഗത്തില്‍ നിനക്കു ________. പിന്നെ വന്ന് എന്നെ അനുഗമിക്കുക. (19:21)", "answer": "നിക്‌ഷേപമുണ്ടാകും", "refs": ["19:21"], "id": 28, "evidence": [{"ref": "19:21", "text": "യേശു പറഞ്ഞു: നീ പൂര്‍ണനാകാന്‍ ആഗ്രഹിക്കുന്നെങ്കില്‍, പോയി നിനക്കുള്ളതെല്ലാം വിറ്റ് ദരിദ്രര്‍ക്കുകൊടുക്കുക. അപ്പോള്‍ സ്വര്‍ഗത്തില്‍ നിനക്കു നിക്‌ഷേപമുണ്ടാകും. പിന്നെ വന്ന് എന്നെ അനുഗമിക്കുക."}], "options": ["സിംഹാസനമുണ്ടാകും", "പ്രതിഫലമുണ്ടാകും", "നിക്‌ഷേപമുണ്ടാകും", "മഹത ള്ളവരുടേതാണ്", "പ്രമാണങ്ങൾ അനുസരിച്ചവരുടേതാണ്"], "optionAnswer": 2, "refs": ["19:14"], "evidence": [{"ref": "19:14", "text": "എന്നാല്‍, അവന്‍ പറഞ്ഞു: ശിശുക്കളെ എന്റെ അടുത്തുവരാന്‍ അനുവദിക്കുവിന്‍; അവരെ തടയരുത്. എന്തെന്നാല്‍, സ്വര്‍ഗരാജ്യം അവരെപ്പോലെയുള്ളവരുടേതാണ്."}], "id": 36}, {"type": "fill", "q": "യേശു ________: മനുഷ്യര്‍ക്ക് ഇത് അസാധ്യമാണ്; എന്നാല്‍, ദൈവത്തിന് എല്ലാം സാധ്യമാണ്. (19:26)", "answer": "അവരെ നോക്കിപ്പറഞ്ഞു", "options": ["അവരെ സമീപിച്ചുപറഞ്ഞു", "അവരെ സ്പർശിച്ചുപറഞ്ഞു", "അവരെ നോക്കിപ്പറഞ്ഞു", "അവരെ വിളിച്ചുപറഞ്ഞു"], "optionAnswer": 2, "refs": ["19:26"], "evidence": [{"ref": "19:26", "text": "യേശു അവരെ നോക്കിപ്പറഞ്ഞു: മനുഷ്യര്‍ക്ക് ഇത് അസാധ്യമാണ്; എന്നാല്‍, ദൈവത്തിന് എല്ലാം സാധ്യമാണ്."}], "id": 37}, {"type": "fill", "q": "അപ്പോള്‍ പത്രോസ് പറഞ്ഞു: ഇതാ, ഞങ്ങള്‍ ________ നിന്നെ അനുഗമിച്ചിരിക്കുന്നു. ഞങ്ങള്‍ക്കെന്താണു ലഭിക്കുക? (19:27)", "answer": "എല്ലാം ഉപേക്ഷിച്ച്", "options": ["പ്രമാണങ്ങൾ അനുസരിച്ച്", "എല്ലാം വിറ്റ്", "കുരിശുമെടുത്ത്", "എല്ലാം ഉപേക്ഷിച്ച്"], "optionAnswer": 3, "refs": ["19:27"], "evidence": [{"ref": "19:27", "text": "അപ്പോള്‍ പത്രോസ് പറഞ്ഞു: ഇതാ, ഞങ്ങള്‍ എല്ലാം ഉപേക്ഷിച്ച് നിന്നെ അനുഗമിച്ചിരിക്കുന്നു. ഞങ്ങള്‍ക്കെന്താണു ലഭിക്കുക?"}], "id": 38}, {"type": "fill", "q": "ദിവസം ഒരു ദനാറ വീതം വേതനം നല്‍കാമെന്ന ________ അവന്‍ അവരെ മുന്തിരിത്തോട്ടത്തിലേക്ക് അയച്ചു. (20:2)", "answer": "കരാറില്‍", "options": ["അപേക്ഷയിൽ", "കരാറില്‍", "കൽപനയിൽ", "വിശ്വാസത്തിൽ"], "optionAnswer": 1, "refs": ["20:2"], "evidence": [{"ref": "20:2", "text": "ദിവസം ഒരു ദനാറ വീതം വേതനം നല്‍കാമെന്ന കരാറില്‍ അവന്‍ അവരെ മുന്തിരിത്തോട്ടത്തിലേക്ക് അയച്ചു."}], "id": 39}, {"type": "fill", "q": "ഇതാ! നമ്മള്‍ ജറുസലെമിലേക്കുപോകുന്നു. മനുഷ്യപുത്രന്‍ പ്രധാനപുരോഹിതന്‍മാര്‍ക്കും ________ ഏല്‍പിക്കപ്പെടും. (20:18)", "answer": "നിയമജ്ഞന്‍മാര്‍ക്കും", "options": ["നിയമജ്ഞന്‍മാര്‍ക്കും", "ഫരിസേയർക്കും", "സദുക്കായർക്കും", "പ്രമാണികൾക്കും"], "optionAnswer": 0, "refs": ["20:18"], "evidence": [{"ref": "20:18", "text": "ഇതാ! നമ്മള്‍ ജറുസലെമിലേക്കുപോകുന്നു. മനുഷ്യപുത്രന്‍ പ്രധാനപുരോഹിതന്‍മാര്‍ക്കും നിയമജ്ഞന്‍മാര്‍ക്കും ഏല്‍പിക്കപ്പെടും."}], "id": 40}, {"type": "match", "q": "ചോദ്യവും മറുപടിയും യോജിപ്പിക്കുക.", "rows": [["ഇനിയും എന്താണ് എനിക്കു കുറവ്?", "നിനക്കുള്ളതെല്ലാം വിറ്റ് ദരിദ്രർക്കു കൊടുക്കുക"], ["നിങ്ങൾ ദിവസം മുഴുവൻ അലസരായി നിൽക്കുന്നതെന്ത്?", "ഞങ്ങളെ ആരും വേലയ്ക്കു വിളിക്കാത്തതുകൊണ്ട്"], ["പാനപാത്രം കുടിക്കാൻ കഴിയുമോ?", "ഞങ്ങൾക്കു കഴിയും"], ["ഞാൻ നിങ്ങൾക്ക് എന്തുചെയ്യണം?", "ഞങ്ങൾക്കു കണ്ണുകൾ തുറന്നു കിട്ടണം"]], "refs": ["19:20", "19:21", "20:6", "20:7", "20:22", "20:32", "20:33"], "id": 41, "evidence": [{"ref": "19:20", "text": "ആയുവാവ് ചോദിച്ചു: ഇവയെല്ലാം ഞാന്‍ അനുസരിച്ചിട്ടുണ്ട്; ഇനിയും എന്താണ് എനിക്കു കുറവ്?"}, {"ref": "19:21", "text": "യേശു പറഞ്ഞു: നീ പൂര്‍ണനാകാന്‍ ആഗ്രഹിക്കുന്നെങ്കില്‍, പോയി നിനക്കുള്ളതെല്ലാം വിറ്റ് ദരിദ്രര്‍ക്കുകൊടുക്കുക. അപ്പോള്‍ സ്വര്‍ഗത്തില്‍ നിനക്കു നിക്‌ഷേപമുണ്ടാകും. പിന്നെ വന്ന് എന്നെ അനുഗമിക്കുക."}, {"ref": "20:6", "text": "ഏകദേശം പതിനൊന്നാം മണിക്കൂറില്‍ അവന്‍ പുറത്തേക്കിറങ്ങിയപ്പോഴും അവിടെ ചിലര്‍ നില്‍ക്കുന്നതുകണ്ട് അവരോടു ചോദിച്ചു: നിങ്ങള്‍ ദിവസം മുഴുവന്‍ അലസരായി നില്‍ക്കുന്നതെന്ത്?"}, {"ref": "20:7", "text": "ഞങ്ങളെ ആരും വേലയ്ക്കു വിളിക്കാത്തതുകൊണ്ട് എന്ന് അവര്‍ മറുപടി നല്‍കി. അവന്‍ പറഞ്ഞു: നിങ്ങളും മുന്തിരിത്തോട്ടത്തിലേക്കു ചെല്ലുവിന്‍."}, {"ref": "20:22", "text": "യേശു മറുപടി നല്‍കി: നിങ്ങള്‍ ചോദിക്കുന്നതെന്താണെന്നു നിങ്ങള്‍ അറിയുന്നില്ല. ഞാന്‍ കുടിക്കാന്‍ പോകുന്ന പാനപാത്രം കുടിക്കാന്‍ നിങ്ങള്‍ക്കു കഴിയുമോ? അവര്‍ പറഞ്ഞു: ഞങ്ങള്‍ക്കു കഴിയും."}, {"ref": "20:32", "text": "യേശു അവിടെ നിന്ന് അവരെ വിളിച്ചു ചോദിച്ചു: ഞാന്‍ നിങ്ങള്‍ക്ക് എന്തുചെയ്യണമെന്നാണ് നിങ്ങള്‍ ആഗ്രഹിക്കുന്നത്?"}, {"ref": "20:33", "text": "അവര്‍ പറഞ്ഞു: കര്‍ത്താവേ, ഞങ്ങള്‍ക്കു കണ്ണുകള്‍ തുറന്നു കിട്ടണം."}]}, {"type": "match", "q": "വിശേഷണവും അതിനുള്ള നിർദേശമോ പ്രതിഫലമോ യോജിപ്പിക്കുക.", "rows": [["ജീവനിൽ പ്രവേശിക്കാൻ അഭിലഷിക്കുന്നവൻ", "പ്രമാണങ്ങൾ അനുസരിക്കുക"], ["യേശുവിനെ അനുഗമിച്ച പന്ത്രണ്ടുപേർ", "പന്ത്രണ്ടു സിംഹാസനങ്ങളിൽ ഇരിക്കും"], ["വലിയവനാകാൻ ആഗ്രഹിക്കുന്നവൻ", "ശുശ്രൂഷകനായിരിക്കണം"], ["ഒന്നാമനാകാൻ ആഗ്രഹിക്കുന്നവൻ", "ദാസനായിരിക്കണം"]], "refs": ["19:17", "19:28", "20:27"], "id": 42, "evidence": [{"ref": "19:17", "text": "അവന്‍ പറഞ്ഞു: നന്‍മയെപ്പറ്റി നീ എന്നോടു ചോദിക്കുന്നതെന്തിന്? നല്ലവന്‍ ഒരുവന്‍ മാത്രം. ജീവനില്‍ പ്രവേശിക്കാന്‍ അഭിലഷിക്കുന്നെങ്കില്‍ പ്രമാണങ്ങള്‍ അനുസരിക്കുക."}, {"ref": "19:28", "text": "യേശു അവരോടു പറഞ്ഞു: സത്യമായി ഞാന്‍ നിങ്ങളോടു പറയുന്നു, പുനര്‍ജീവിതത്തില്‍ മനുഷ്യപുത്രന്‍ തന്റെ മഹത്വത്തിന്റെ സിംഹാസനത്തില്‍ ഉപവിഷ്ടനാകുമ്പോള്‍, എന്നെ അനുഗമിച്ച നിങ്ങള്‍ ഇസ്രായേലിന്റെ പന്ത്രണ്ടുഗോത്രങ്ങളെ വിധിച്ചുകൊണ്ട് പന്ത്രണ്ടു സിംഹാസനങ്ങളില്‍ ഇരിക്കും."}, {"ref": "20:27", "text": "നിങ്ങളില്‍ വലിയവനാകാന്‍ ആഗ്രഹിക്കുന്നവന്‍ നിങ്ങളുടെ ശുശ്രൂഷകനും നിങ്ങളില്‍ ഒന്നാമനാകാന്‍ ആഗ്രഹിക്കുന്നവന്‍ നിങ്ങളുടെ ദാസനുമായിരിക്കണം."}]}, {"type": "match", "q": "മുന്തിരിത്തോട്ട ഉപമയിൽ സമയവും അതിനോടു ചേർന്ന വിശദാംശവും യോജിപ്പിക്കുക.", "rows": [["മൂന്നാം മണിക്കൂർ", "ചന്തസ്ഥലത്ത് അലസരായി നിൽക്കുന്നതു കണ്ടു"], ["ഏകദേശം പതിനൊന്നാം മണിക്കൂർ", "ദിവസം മുഴുവൻ അലസരായി നിൽക്കുന്നതെന്ത് എന്നു ചോദിച്ചു"], ["വൈകുന്നേരം", "കാര്യസ്ഥനോട് കൂലി കൊടുക്കാൻ പറഞ്ഞു"], ["ആദ്യം വന്നവർ കൂലി വാങ്ങുമ്പോൾ", "വീട്ടുടമസ്ഥനെതിരേ പിറുപിറുത്തു"]], "refs": ["20:3", "20:6", "20:8", "20:11"], "evidence": [{"ref": "20:3", "text": "മൂന്നാം മണിക്കൂറില്‍ അവന്‍ പുറത്തേക്കിറങ്ങിയപ്പോള്‍ ചിലര്‍ ചന്തസ്ഥലത്ത് അലസരായി നില്‍ക്കുന്നതുകണ്ട് അവരോടു പറഞ്ഞു:"}, {"ref": "20:6", "text": "ഏകദേശം പതിനൊന്നാം മണിക്കൂറില്‍ അവന്‍ പുറത്തേക്കിറങ്ങിയപ്പോഴും അവിടെ ചിലര്‍ നില്‍ക്കുന്നതുകണ്ട് അവരോടു ചോദിച്ചു: നിങ്ങള്‍ ദിവസം മുഴുവന്‍ അലസരായി നില്‍ക്കുന്നതെന്ത്?"}, {"ref": "20:8", "text": "വൈകുന്നേരമായപ്പോള്‍ മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമസ്ഥന്‍ കാര്യസ്ഥനോടു പറഞ്ഞു: ജോലിക്കാരെ വിളിച്ച് അവസാനം വന്നവര്‍ക്കു തുടങ്ങി ആദ്യം വന്നവര്‍ക്കുവരെ കൂലി കൊടുക്കുക."}, {"ref": "20:11", "text": "അതു വാങ്ങുമ്പോള്‍ അവര്‍ വീട്ടുടമസ്ഥനെതിരേ പിറുപിറുത്തു-"}], "id": 43}, {"type": "match", "q": "ഒരേപോലുള്ള ചോദ്യങ്ങളും അവ ചോദിക്കുന്ന വ്യക്തിയും യോജിപ്പിക്കുക.", "rows": [["ഞങ്ങൾക്കെന്താണു ലഭിക്കുക?", "പത്രോസ്"], ["ഇനിയും എന്താണ് എനിക്കു കുറവ്?", "യുവാവ്"], ["നിനക്ക് എന്താണു വേണ്ടത്?", "സെബദീപുത്രന്മാരുടെ മാതാവിനോട് യേശു"], ["ഞാൻ നിങ്ങൾക്ക് എന്തുചെയ്യണമെന്നാണ് ആഗ്രഹിക്കുന്നത്?", "രണ്ട് അന്ധന്മാരോട് യേശു"]], "refs": ["19:27", "19:20", "20:21", "20:32"], "evidence": [{"ref": "19:27", "text": "അപ്പോള്‍ പത്രോസ് പറഞ്ഞു: ഇതാ, ഞങ്ങള്‍ എല്ലാം ഉപേക്ഷിച്ച് നിന്നെ അനുഗമിച്ചിരിക്കുന്നു. ഞങ്ങള്‍ക്കെന്താണു ലഭിക്കുക?"}, {"ref": "19:20", "text": "ആയുവാവ് ചോദിച്ചു: ഇവയെല്ലാം ഞാന്‍ അനുസരിച്ചിട്ടുണ്ട്; ഇനിയും എന്താണ് എനിക്കു കുറവ്?"}, {"ref": "20:21", "text": "അവന്‍ അവളോടു ചോദിച്ചു: നിനക്ക് എന്താണു വേണ്ടത്? അവള്‍ പറഞ്ഞു: നിന്റെ രാജ്യത്തില്‍ എന്റെ ഈ രണ്ടു പുത്രന്‍മാരില്‍ ഒരുവന്‍ നിന്റെ വലത്തുവശത്തും അപരന്‍ ഇടത്തുവശത്തും ഇരിക്കുന്നതിനു കല്‍പിക്കണമേ!"}, {"ref": "20:32", "text": "യേശു അവിടെ നിന്ന് അവരെ വിളിച്ചു ചോദിച്ചു: ഞാന്‍ നിങ്ങള്‍ക്ക് എന്തുചെയ്യണമെന്നാണ് നിങ്ങള്‍ ആഗ്രഹിക്കുന്നത്?"}], "id": 44}, {"type": "tf", "q": "19-ാം അധ്യായത്തിന്റെ അവസാനത്തിൽ മുമ്പന്മാരെയാണ് ആദ്യം പറയുന്നത്; 20-ാം അധ്യായത്തിലെ മുന്തിരിത്തോട്ട ഉപമയുടെ സമാപനത്തിൽ പിമ്പന്മാരെയാണ് ആദ്യം പറയുന്നത്.", "answer": true, "refs": ["19:30", "20:16"], "id": 45, "evidence": [{"ref": "19:30", "text": "എന്നാല്‍, മുമ്പന്‍മാര്‍ പലരും പിമ്പന്‍മാരും പിമ്പന്‍മാര്‍ മുമ്പന്‍മാരുമാകും."}, {"ref": "20:16", "text": "ഇപ്രകാരം, പിമ്പന്‍മാര്‍ മുമ്പന്‍മാരും മുമ്പന്‍മാര്‍ പിമ്പന്‍മാരുമാകും."}]}, {"type": "tf", "q": "രണ്ടു സഹോദരന്മാരോടുള്ള അമർഷം രേഖപ്പെടുത്തുന്നത് ബാക്കി പതിനൊന്നുപേരുടേതാണ്.", "answer": false, "refs": ["20:24"], "id": 46, "evidence": [{"ref": "20:24", "text": "ഇതു കേട്ടപ്പോള്‍ ബാക്കി പത്തുപേര്‍ക്കും ആ രണ്ടു സഹോദരന്‍മാരോട് അമര്‍ഷംതോന്നി."}]}, {"type": "tf", "q": "രണ്ട് അന്ധന്മാരുടെ നിലവിളി ജറീക്കോയിലേക്കു പ്രവേശിക്കുമ്പോഴാണ് രേഖപ്പെടുത്തിയിരിക്കുന്നത്.", "answer": false, "refs": ["20:29", "20:30"], "id": 47, "evidence": [{"ref": "20:29", "text": "അവന്‍ ജറീക്കോയില്‍നിന്നുയാത്ര പുറപ്പെട്ടപ്പോള്‍ ഒരു വലിയ ജനക്കൂട്ടം അവനെ അനുഗമിച്ചു."}, {"ref": "20:30", "text": "യേശു ആ വഴി കടന്നുപോകുന്നെന്നു കേട്ടപ്പോള്‍, വഴിയരികിലിരുന്ന രണ്ട് അന്ധന്‍മാര്‍ ഉച്ചത്തില്‍ നിലവിളിച്ചു: കര്‍ത്താവേ, ദാവീദിന്റെ പുത്രാ, ഞങ്ങളില്‍ കനിയണമേ!"}]}, {"type": "tf", "q": "പന്ത്രണ്ട $('question-jump').innerHTML=quiz.questions.map((item,i)=>{const response=responses[i],state=response?(response.correct?'ശരിയായ ഉത്തരം':'തെറ്റായ ഉത്തരം'):'പരിശോധിച്ചിട്ടില്ല';return `<button type="button" data-jump="${i}" class="${response?(response.correct?'done-correct':'done-wrong'):''}" ${i===current?'aria-current="step"':''} aria-label="ചോദ്യം ${i+1}, ${state}">${i+1}${response?(response.correct?' ✓':' ✕'):''}</button>`;}).join('');$('question-jump').querySelectorAll('button').forEach(button=>button.onclick=()=>jumpTo(Number(button.dataset.jump)));
$('type').textContent=labels[q.type];$('question-title').textContent=`${current+1}. ${q.q}`;$('notice').textContent='';
if(q.type==='mc'||q.type==='fill'||q.type==='tf'){const opts=q.type==='tf'?['ശരി','തെറ്റ്']:q.options;$('controls').innerHTML='<fieldset style="border:0;padding:0;margin:0"><legend>നിങ്ങളുടെ ഉത്തരം തിരഞ്ഞെടുക്കുക</legend>'+opts.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${String(a)===String(i)?'checked':''} ${r?'disabled':''}><span>${q.type!=='tf'?String.fromCharCode(65+i)+'. ':''}${esc(o)}</span></label>`).join('')+'</fieldset>';
}else{const order=q.rows.map((_,i)=>i).sort((x,y)=>((x*3+1)%q.rows.length)-((y*3+1)%q.rows.length));if(order.every((x,i)=>x===i))order.reverse();$('controls').innerHTML=q.rows.map((row,i)=>`<div class="match-row"><label for="match-${i}">${i+1}. ${esc(row[0])}</label><select id="match-${i}" ${r?'disabled':''}><option value="">തിരഞ്ഞെടുക്കുക</option>${order.map(j=>`<option value="${j}" ${a&&String(a[i])===String(j)?'selected':''}>${esc(q.rows[j][1])}</option>`).join('')}</select></div>`).join('');}
$('feedback').innerHTML=r?feedback(q,r):'';$('prev').disabled=current===0;$('next').disabled=current===total-1;$('controls').querySelectorAll('input,select').forEach(control=>{control.oninput=answerSelected;control.onchange=answerSelected;if(q.type==='match')control.onblur=answerSelected;});
if(count===total)showResults();else{$('results').hidden=true;$('results').innerHTML='';}}
function feedback(q,r){const parts=q.type==='match'?'<div>'+q.rows.map((row,i)=>`<p>${i+1}. ${esc(row[0])}: ${r.value[i]===i?'ശരിയാണ്':'തെറ്റാണ്'}</p>`).join('')+'</div>':'';
return `<div tabindex="-1" class="feedback ${r.correct?'':'wrong'}"><div class="feedback-heading"><span class="status-icon" aria-hidden="true">${r.correct?'✓':'✕'}</span><strong>${r.correct?'ശരിയാണ് — 1 മാർക്ക്':'തെറ്റാണ് — 0 മാർക്ക്'}</strong></div>${parts}<p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,r.value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div><details><summary>വചനാധാരം കാണുക</summary>${q.evidence.map(e=>`<div class="evidence"><strong>${esc(e.label||'മത്തായി '+e.ref)}</strong><p>${esc(e.text)}</p></div>`).join('')}</details></div>`;}
function check(){if(responses[current])return;saveDraft();const q=quiz.questions[current],a=drafts[current];if(a===null||(q.type==='match'&&a.some(x=>x===''))){$('notice').textContent=q.type==='match'?'എല്ലാ കൂട്ടുകളും തിരഞ്ഞെടുക്കുക.':'ആദ്യം നിങ്ങളുടെ ഉത്തരം നൽകുക.';return;}
let value,correct;if(q.type==='mc'){value=Number(a);correct=value===q.answer;}else if(q.type==='tf'){value=a==='0';correct=value===q.answer;}else if(q.type==='fill'){value=Number(a);correct=value===q.optionAnswer;}else{value=a.map(Number);correct=value.every((x,i)=>x===i);}
responses[current]={value,correct};render();const target=$('feedback').firstElementChild;requestAnimationFrame(()=>{if(!target.isConnected)return;target.focus({preventScroll:true});target.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});target.classList.add(correct?'celebrate':'try-again');});}
function showResults(){const n=responses.filter(x=>x.correct).length;$('results').hidden=false;$('results').innerHTML=`<h2 id="results-title">ക്വിസ് പൂർത്തിയായി</h2><p><strong>നിങ്ങളുടെ സ്കോർ: ${n} / ${total}</strong></p><p>ശരിയായ ഉത്തരങ്ങൾ: ${n}<br>തെറ്റായ ഉത്തരങ്ങൾ: ${total-n}<br>ശതമാനം: ${Math.round(n/total*100)}%</p><h3>ഉത്തരങ്ങൾ പരിശോധിക്കാം</h3>`+quiz.questions.map((q,i)=>`<div class="review"><h3>${i+1}. ${esc(q.q)}</h3><p>${responses[i].correct?'ശരിയാണ്':'തെറ്റാണ്'}</p><p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,responses[i].value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div></div>`).join('');}
function jumpTo(index){if(!Number.isInteger(index)||index<0||index>=total)return;saveDraft();current=index;render();$('question-title').focus({preventScroll:true});$('question-panel').scrollIntoView({block:'start'});}function move(step){jumpTo(current+step);}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reset').onclick=()=>{current=0;responses=quiz.questions.map(()=>null);drafts=quiz.questions.map(()=>null);render();$('question-title').focus();window.scrollTo(0,0);};render();
</script></body></html>
