const quiz={"range": "26-27", "title": "പീഡാനുഭവം, മരണം, സംസ്കാരം", "questions": [{"type": "mc", "q": "തിരുനാൾ ദിവസം പിടികൂടേണ്ടെന്ന തീരുമാനത്തിനു പറഞ്ഞ കാരണം?", "options": ["ജനങ്ങൾ ബഹളമുണ്ടാക്കും", "ദേശാധിപതി സമ്മതിക്കില്ല", "സാക്ഷികൾ ലഭിക്കില്ല", "ശിഷ്യന്മാർ പ്രതിരോധിക്കും"], "answer": 0, "refs": ["26:5"], "id": 1, "evidence": [{"ref": "26:5", "text": "അവര്‍ പറഞ്ഞു: തിരുനാള്‍ ദിവസം വേണ്ടാ; ജനങ്ങള്‍ ബഹളമുണ്ടാക്കും."}]}, {"type": "mc", "q": "ശിരസ്സിൽ സുഗന്ധതൈലം ഒഴിച്ചതു കണ്ടു പാഴ്‌ചെലവിനെക്കുറിച്ച് പറഞ്ഞവർ?", "options": ["പ്രധാനപുരോഹിതന്മാർ", "ജനപ്രമാണികൾ", "ശിഷ്യന്മാർ", "പരിചാരകന്മാർ"], "answer": 2, "refs": ["26:7", "26:8"], "id": 2, "evidence": [{"ref": "26:7", "text": "വിലയേറിയ സുഗന്ധതൈലം നിറച്ച ഒരു വെണ്‍കല്‍പാത്രവുമായി ഒരു സ്ത്രീ അവനെ സമീപിച്ചു. അവന്‍ ഭക്ഷണത്തിനിരിക്കുമ്പോള്‍, അവള്‍ തൈലം അവന്റെ ശിരസ്‌സില്‍ ഒഴിച്ചു."}, {"ref": "26:8", "text": "ഇതു കണ്ട ശിഷ്യന്‍മാര്‍ കോപത്തോടെ പറഞ്ഞു: എന്തിന് ഈ പാഴ്‌ചെലവ്?"}]}, {"type": "mc", "q": "പെസഹാ ഒരുക്കേണ്ട സ്ഥലം ശിഷ്യന്മാർ അന്വേഷിച്ചത് എപ്പോൾ?", "options": ["പെസഹായ്ക്കു രണ്ടു ദിവസം മുമ്പ്", "പെസഹായുടെ വൈകുന്നേരം", "ഒരുക്കദിനത്തിന്റെ പിറ്റേന്ന്", "പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഒന്നാം ദിവസം"], "answer": 3, "refs": ["26:17"], "id": 3, "evidence": [{"ref": "26:17", "text": "പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഒന്നാം ദിവസം ശിഷ്യന്‍മാര്‍ യേശുവിന്റെ അടുത്തുവന്നു ചോദിച്ചു: നിനക്കു പെസഹാ എവിടെ ഒരുക്കണമെന്നാണ് നീ ആഗ്രഹിക്കുന്നത്?"}]}, {"type": "mc", "q": "ഒറ്റിക്കൊടുക്കലിനെക്കുറിച്ചുള്ള ചോദ്യത്തിൽ മറ്റുള്ളവരുടെയും യൂദാസിന്റെയും സംബോധനകൾ യഥാക്രമം?", "options": ["സ്‌നേഹിതാ; ഗുരോ", "കർ‍ത്താവേ; സ്‌നേഹിതാ", "കർ‍ത്താവേ; ഗുരോ", "ഗുരോ; കർത്താവേ"], "answer": 2, "refs": ["26:22", "26:25"], "id": 4, "evidence": [{"ref": "26:22", "text": "അവര്‍ അതീവ ദുഃഖിതരായി; കര്‍ത്താവേ, അതു ഞാന്‍ അല്ലല്ലോ എന്ന് ഓരോരുത്തരും അവനോടു ചോദിക്കാന്‍ തുടങ്ങി."}, {"ref": "26:25", "text": "അവനെ ഒറ്റിക്കൊടുക്കാനിരുന്ന യൂദാസ് അവനോടു ചോദിച്ചു: ഗുരോ, അതു ഞാനോ? അവന്‍ പറഞ്ഞു: നീ പറഞ്ഞുകഴിഞ്ഞു."}]}, {"type": "mc", "q": "പാനപാത്രം എടുത്തശേഷം കൊടുക്കുന്നതിനു മുമ്പ് ചെയ്തത്?", "options": ["കൃതജ്ഞതാസ്തോത്രം ചെയ്തു", "അപ്പത്തെപ്പോലെ മുറിച്ചു", "സ്തോത്രഗീതം ആലപിച്ചു", "കമിഴ്ന്നുവീണു പ്രാർഥിച്ചു"], "answer": 0, "refs": ["26:27"], "id": 5, "evidence": [{"ref": "26:27", "text": "അനന്തരം പാനപാത്രമെടുത്ത് കൃതജ്ഞതാസ്‌തോത്രം ചെയ്ത് അവര്‍ക്കുകൊടുത്തുകൊണ്ടു പറഞ്ഞു: നിങ്ങളെല്ലാവരും ഇതില്‍നിന്നു പാനം ചെയ്യുവിന്‍."}]}, {"type": "mc", "q": "ഒരു മണിക്കൂർ ഉണർന്നിരിക്കാനാകാത്തതിനെക്കുറിച്ച് നേരിട്ടു ചോദിച്ചത് ആരോട്?", "options": ["യാക്കോബിനോട്", "പത്രോസിനോട്", "യൂദാസിനോട്", "യോഹന്നാനോട്"], "answer": 1, "refs": ["26:40"], "id": 6, "evidence": [{"ref": "26:40", "text": "അനന്തരം അവന്‍ ശിഷ്യന്‍മാരുടെ അടുത്തേക്കുവന്നു. അപ്പോള്‍ അവര്‍ ഉറങ്ങുന്നതു കണ്ടു. അവന്‍ പത്രോസിനോടു ചോദിച്ചു: എന്നോടുകൂടെ ഒരു മണിക്കൂര്‍ ഉണര്‍ന്നിരിക്കാന്‍ നിങ്ങള്‍ക്കു കഴിഞ്ഞില്ലേ?"}]}, {"type": "mc", "q": "അയച്ചുതരാവുന്ന ദൂതന്മാരുടെ വ്യൂഹങ്ങളെക്കുറിച്ചുള്ള കൃത്യമായ സംഖ്യാവിവരണം?", "options": ["പതിനൊന്നു വ്യൂഹങ്ങൾ", "പന്ത്രണ്ടു വ്യൂഹങ്ങൾ മാത്രം", "പന്ത്രണ്ടിലേറെ വ്യൂഹങ്ങൾ", "പതിനായിരം വ്യൂഹങ്ങൾ"], "answer": 2, "refs": ["26:53"], "id": 7, "evidence": [{"ref": "26:53", "text": "എനിക്ക് എന്റെ പിതാവിനോട് അപേക്ഷിക്കാന്‍ കഴിയുകയില്ലെന്നും ഉടന്‍ തന്നെ അവിടുന്ന് എനിക്കു തന്റെ ദൂതന്‍മാരുടെ പന്ത്രണ്ടിലേറെ വ്യൂഹങ്ങളെ അയച്ചുതരുകയില്ലെന്നും നീ വിചാരിക്കുന്നുവോ?"}]}, {"type": "mc", "q": "അവസാനം ദേവാലയത്തെക്കുറിച്ച് സാക്ഷ്യം പറഞ്ഞവരുടെ എണ്ണം?", "options": ["ഒരാൾ", "മൂന്നുപേർ", "പന്ത്രണ്ടുപേർ", "രണ്ടുപേർ"], "answer": 3, "refs": ["26:61"], "id": 8, "evidence": [{"ref": "26:61", "text": "അവസാനം രണ്ടുപേര്‍ മുന്നോട്ടുവന്ന്, ഇപ്രകാരം പറഞ്ഞു: ഈ ദേവാലയം നശിപ്പിക്കാനും മൂന്നു ദിവസംകൊണ്ടു നിര്‍മിക്കാനും എനിക്കു സാധിക്കും എന്ന് ഇവന്‍ പറഞ്ഞിട്ടുണ്ട്."}]}, {"type": "mc", "q": "രണ്ടാമത്തെ പരിചാരിക പത്രോസിനെ കണ്ട സ്ഥലം?", "options": ["ദേവാലയം", "കവാടം", "മുറ്റം", "കൊട്ടാരത്തിനുള്ളിൽ"], "answer": 1, "refs": ["26:71"], "id": 9, "evidence": [{"ref": "26:71", "text": "അവന്‍ കവാടത്തിലേക്കു പോയപ്പോള്‍ മറ്റൊരു പരിചാരിക അവനെക്കണ്ടു. അവള്‍ അടുത്തു നിന്നവരോടു പറഞ്ഞു: ഈ മനുഷ്യനും നസറായനായ യേശുവിന്റെ കൂടെയായിരുന്നു."}]}, {"type": "mc", "q": "യൂദാസ് പണം മടക്കിനൽകിയത് ആരെ ഏൽപിച്ചാണ്?", "options": ["പ്രമാണിമാരെയും നിയമജ്ഞരെയും", "പ്രധാനപുരോഹിതന്മാരെയും പ്രമാണിമാരെയും", "പ്രധാനപുരോഹിതന്മാരെയും ഫരിസേയരെയും", "ഫരിസേയരെയും സദുക്കായരെയും"], "answer": 1, "refs": ["27:3"], "id": 10, "evidence": [{"ref": "27:3", "text": "അവനെ ഒറ്റിക്കൊടുത്ത യൂദാസ് അവന്‍ ശിക്ഷയ്ക്കു വിധിക്കപ്പെട്ടു എന്നറിഞ്ഞപ്പോള്‍ പശ്ചാത്തപിച്ച് ആ മുപ്പതുവെള്ളിനാണയങ്ങള്‍ പ്രധാനപുരോഹിതന്‍മാരെയും പ്രമാണിമാരെയും ഏല്‍പിച്ചുകൊണ്ടു പറഞ്ഞു:"}]}, {"type": "mc", "q": "ഗോൽഗോഥായിൽ ആദ്യം കുടിക്കാൻ കൊടുത്തത്?", "options": ["വെള്ളം കലർത്തിയ വീഞ്ഞ്", "കയ്പുകലർത്തിയ വെള്ളം", "വിനാഗിരിയിൽ മുക്കിയ നീർപ്പഞ്ഞി", "കയ്പുകലർത്തിയ വീഞ്ഞ്"], "answer": 3, "refs": ["27:34"], "id": 11, "evidence": [{"ref": "27:34", "text": "അവര്‍ അവനു കയ്പുകലര്‍ത്തിയ വീഞ്ഞ് കുടിക്കാന്‍ കൊടുത്തു. അവന്‍ അതു രുചിച്ചുനോക്കിയെങ്കിലും കുടിക്കാന്‍ ഇഷ്ടപ്പെട്ടില്ല."}]}, {"type": "mc", "q": "ഉയിർപ്പിക്കപ്പെട്ട വിശുദ്ധർ വിശുദ്ധനഗരത്തിൽ പ്രവേശിച്ച് പ്രത്യക്ഷപ്പെട്ടത് എപ്പോൾ?", "options": ["യേശുവിന്റെ പുനരുത്ഥാനത്തിനുശേഷം", "യേശു ജീവൻ വെടിഞ്ഞ ഉടനെ", "തിരശ്ശീല കീറിയ ഉടനെ", "യേശുവിന്റെ സംസ്കാരത്തിനു മുമ്പ്"], "answer": 0, "refs": ["27:53"], "id": 12, "evidence": [{"ref": "27:53", "text": "അവന്റെ പുനരുത്ഥാനത്തിനുശേഷം, അവര്‍ ശവകുടീരങ്ങളില്‍നിന്നു പുറത്തുവന്ന് വിശുദ്ധനഗരത്തില്‍ പ്രവേശിച്ച് പലര്‍ക്കും പ്രത്യക്ഷപ്പെട്ടു."}]}, {"type": "mc", "q": "കല്ലറയ്ക്ക് കാവൽ ആവശ്യപ്പെടാൻ പീലാത്തോസിന്റെ അടുത്തെത്തിയ രണ്ടു വിഭാഗങ്ങൾ?", "options": ["നിയമജ്ഞരും ശ്രേഷ്ഠന്മാരും", "പ്രധാനപുരോഹിതന്മാരും ഫരിസേയരും", "പ്രധാനപുരോഹിതന്മാരും നിയമജ്ഞരും", "ഫരിസേയരും സദുക്കായരും"], "answer": 1, "refs": ["27:62"], "id": 13, "evidence": [{"ref": "27:62", "text": "പിറ്റേദിവസം, അതായത്, ഒരുക്കദിനത്തിന്റെ പിറ്റേന്ന്, പ്രധാന പുരോഹിതന്‍മാരും ഫരിസേയരും പീലാത്തോസിന്റെ അടുക്കല്‍ ഒരുമിച്ചു കൂടി."}]}, {"type": "fill", "q": "അവന്‍ പറഞ്ഞു: നിങ്ങള്‍ പട്ടണത്തില്‍ പോയി ഇന്നയാളുടെ അടുത്തു ചെന്ന് പറയുക: ഗുരു പറയുന്നു, എന്റെ സമയം ________; ഞാന്‍ എന്റെ ശിഷ്യന്‍മാരോടുകൂടെ നിന്റെ വീട്ടില്‍ പെസഹാ ആചരിക്കും. (26:18)", "answer": "സമാഗതമായി", "refs": ["26:18"], "id": 14, "evidence": [{"ref": "26:18", "text": "അവന്‍ പറഞ്ഞു: നിങ്ങള്‍ പട്ടണത്തില്‍ പോയി ഇന്നയാളുടെ അടുത്തു ചെന്ന് പറയുക: ഗുരു പറയുന്നു, എന്റെ സമയം സമാഗതമായി; ഞാന്‍ എന്റെ ശിഷ്യന്‍മാരോടുകൂടെ നിന്റെ വീട്ടില്‍ പെസഹാ ആചരിക്കും."}], "options": ["അവസാനമായി", "സമാഗതമായി", "നിറവേറി", "കടന്നുപോയി"], "optionAnswer": 1}, {"type": "fill", "q": "അവന്‍ വീണ്ടും വന്നപ്പോള്‍ അവര്‍ ഉറങ്ങുന്നതു കണ്ടു. അവരുടെ കണ്ണുകള്‍ ________. (26:43)", "answer": "നിദ്രാഭാരമുള്ളവയായിരുന്നു", "refs": ["26:43"], "id": 15, "evidence": [{"ref": "26:43", "text": "അവന്‍ വീണ്ടും വന്നപ്പോള്‍ അവര്‍ ഉറങ്ങുന്നതു കണ്ടു. അവരുടെ കണ്ണുകള്‍ നിദ്രാഭാരമുള്ളവയായിരുന്നു."}], "options": ["വിസ്മയഭരിതമായിരുന്നു", "ദുഃഖഭാരമുള്ളവയായിരുന്നു", "നിദ്രാഭാരമുള്ളവയായിരുന്നു", "ഭയവിഹ്വലമായിരുന്നു"], "optionAnswer": 2}, {"type": "fill", "q": "യേശു അവനോടു ചോദിച്ചു: ________, നീ എന്തിനാണു വന്നത്? അപ്പോള്‍ അവര്‍ മുന്നോട്ടു വന്ന് യേശുവിനെ പിടിച്ചു. (26:50)", "answer": "സ്‌നേഹിതാ", "refs": ["26:50"], "id": 16, "evidence": [{"ref": "26:50", "text": "യേശു അവനോടു ചോദിച്ചു: സ്‌നേഹിതാ, നീ എന്തിനാണു വന്നത്? അപ്പോള്‍ അവര്‍ മുന്നോട്ടു വന്ന് യേശുവിനെ പിടിച്ചു."}], "options": ["സേവകാ", "സഹോദരാ", "ഗുരോ", "സ്‌നേഹിതാ"], "optionAnswer": 3}, {"type": "fill", "q": "യേശു അവനോടു പറഞ്ഞു: നീ പറഞ്ഞുവല്ലോ; എന്നാല്‍, ഞാന്‍ നിന്നോടു പറയുന്നു, ഇപ്പോള്‍ മുതല്‍ മനുഷ്യപുത്രന്‍ ________ ഉപവിഷ്ടനായിരിക്കുന്നതും വാനമേഘങ്ങളില്‍ വരുന്നതും നിങ്ങള്‍ കാണും. (26:64)", "answer": "ശക്തിയുടെ വലത്തുഭാഗത്ത്", "refs": ["26:64"], "id": 17, "evidence": [{"ref": "26:64", "text": "യേശു അവനോടു പറഞ്ഞു: നീ പറഞ്ഞുവല്ലോ; എന്നാല്‍, ഞാന്‍ നിന്നോടു പറയുന്നു, ഇപ്പോള്‍ മുതല്‍ മനുഷ്യപുത്രന്‍ ശക്തിയുടെ വലത്തുഭാഗത്ത് ഉപവിഷ്ടനായിരിക്കുന്നതും വാനമേഘങ്ങളില്‍ വരുന്നതും നിങ്ങള്‍ കാണും."}], "options": ["മഹത്വത്തിന്റെ ഇടത്തുഭാഗത്ത്", "ദൂതന്മാരുടെ വലത്തുഭാഗത്ത്", "പിതാവിന്റെ ഇടത്തുഭാഗത്ത്", "ശക്തിയുടെ വലത്തുഭാഗത്ത്"], "optionAnswer": 3}, {"type": "fill", "q": "________ ഒറ്റിക്കൊടുത്ത് ഞാന്‍ പാപം ചെയ്തിരിക്കുന്നു. അവര്‍ അവനോടു പറഞ്ഞു: അതിനു ഞങ്ങള്‍ക്കെന്ത്? അതു നിന്റെ കാര്യമാണ്. (27:4)", "answer": "നിഷ്‌ക ി; ഭൂമി കുലുങ്ങി; പാറകള്‍ പിളര്‍ന്നു; ശവകുടീരങ്ങള്‍ തുറക്കപ്പെട്ടു."}]}, {"type": "tf", "q": "യേശുവിനെ സംസ്കരിച്ച കല്ലറ പാറയിൽ വെട്ടിയുണ്ടാക്കിയ ജോസഫിന്റെ പുതിയ കല്ലറയായിരുന്നു.", "answer": true, "refs": ["27:60"], "id": 25, "evidence": [{"ref": "27:60", "text": "പാറയില്‍വെട്ടിയുണ്ടാക്കിയ തന്റെ പുതിയ കല്ലറയില്‍ സംസ്‌കരിച്ചു. കല്ലറയുടെ വാതില്‍ക്കല്‍ ഒരു വലിയ കല്ലുരുട്ടിവച്ചിട്ട് അവന്‍ പോയി."}]}]};
const total=quiz.questions.length;
let current=0, responses=quiz.questions.map(()=>null), drafts=quiz.questions.map(()=>null);
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.normalize('NFC').trim().replace(/\s+/g,' ').replace(/\u200c|\u200d/g,'').replace(/ണ്/g,'ൺ').replace(/ന്/g,'ൻ').replace(/ര്/g,'ർ').replace(/ല്/g,'ൽ').replace(/ള്/g,'ൾ').replace(/ക്/g,'ൿ');
const labels={mc:'ശരിയായത് തിരഞ്ഞെടുക്കുക',fill:'വിട്ടുപോയ ഭാഗത്തിന് ശരിയായത് തിരഞ്ഞെടുക്കുക',match:'കൂട്ടിയിണക്കുക',tf:'ശരിയോ തെറ്റോ?'};
function right(q){return q.type==='mc'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.type==='tf'?(q.answer?'ശരി':'തെറ്റ്'):q.type==='match'?q.rows.map(r=>r[0]+' → '+r[1]).join('\n'):q.answer;}
function userText(q,a){return q.type==='mc'?String.fromCharCode(65+a)+'. '+q.options[a]:q.type==='tf'?(a?'ശരി':'തെറ്റ്'):q.type==='match'?q.rows.map((r,i)=>r[0]+' → '+q.rows[a[i]][1]).join('\n'):q.type==='fill'?q.options[a]:a;}
function saveDraft(){const q=quiz.questions[current];if(responses[current])return;drafts[current]=q.type==='match'?q.rows.map((_,i)=>$('match-'+i).value):document.querySelector('input[name="answer"]:checked')?.value??null;}
function answerSelected(){if(responses[current])return;saveDraft();const q=quiz.questions[current],a=drafts[current];if(q.type==='match'){const selected=a.filter(x=>x!=='').length;$('notice').textContent=selected<q.rows.length?`കൂട്ടിയിണക്കിയത്: ${selected} / ${q.rows.length}`:'';if(selected!==q.rows.length)return;}if(a!==null)check();}
function render(){const q=quiz.questions[current],r=responses[current],a=drafts[current];const count=responses.filter(Boolean).length,score=responses.filter(x=>x?.correct).length;
$('position').textContent=`ചോദ്യം ${current+1} / ${total}`;$('score').textContent=`നിങ്ങളുടെ സ്കോർ: ${score} / ${total}`;$('remaining').textContent=`ബാക്കി: ${total-count}`;$('progress').max=total;$('progress').value=count;$('checked-count').textContent=`പരിശോധിച്ചത്: ${count} / ${total}`;
$('question-jump').innerHTML=quiz.questions.map((item,i)=>{const response=responses[i],state=response?(response.correct?'ശരിയായ ഉത്തരം':'തെറ്റായ ഉത്തരം'):'പരിശോധിച്ചിട്ടില്ല';return `<button type="button" data-jump="${i}" class="${response?(response.correct?'done-correct':'done-wrong'):''}" ${i===current?'aria-current="step"':''} aria-label="ചോദ്യം ${i+1}, ${state}">${i+1}${response?(response.correct?' ✓':' ✕'):''}</button>`;}).join('');$('question-jump').querySelectorAll('button').forEach(button=>button.onclick=()=>jumpTo(Number(button.dataset.jump)));
$('type').textContent=labels[q.type];$('question-title').textContent=`${current+1}. ${q.q}`;$('notice').textContent='';
if(q.type==='mc'||q.type==='fill'||q.type==='tf'){const opts=q.type==='tf'?['ശരി','തെറ്റ്']:q.options;$('controls').innerHTML='<fieldset style="border:0;padding:0;margin:0"><legend>നിങ്ങളുടെ ഉത്തരം തിരഞ്ഞെടുക്കുക</legend>'+opts.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${String(a)===String(i)?'checked':''} ${r?'disabled':''}><span>${q.type!=='tf'?String.fromCharCode(65+i)+'. ':''}${esc(o)}</span></label>`).join('')+'</fieldset>';
}else{const order=q.rows.map((_,i)=>i).sort((x,y)=>((x*3+1)%q.rows.length)-((y*3+1)%q.rows.length));if(order.every((x,i)=>x===i))order.reverse();$('controls').innerHTML=q.rows.map((row,i)=>`<div class="match-row"><label for="match-${i}">${i+1}. ${esc(row[0])}</label><select id="match-${i}" ${r?'disabled':''}><option value="">തിരഞ്ഞെടുക്കുക</option>${order.map(j=>`<option value="${j}" ${a&&String(a[i])===String(j)?'selected':''}>${esc(q.rows[j][1])}</option>`).join('')}</select></div>`).join('');}
$('feedback').innerHTML=r?feedback(q,r):'';$('prev').disabled=current===0;$('next').disabled=current===total-1;$('controls').querySelectorAll('input,select').forEach(control=>{control.oninput=answerSelected;control.onchange=answerSelected;if(q.type==='match')control.onblur=answerSelected;});
if(count===total)showResults();else{$('results').hidden=true;$('results').innerHTML='';}}
function feedback(q,r){const parts=q.type==='match'?'<div>'+q.rows.map((row,i)=>`<p>${i+1}. ${esc(row[0])}: ${r.value[i]===i?'ശരിയാണ്':'തെറ്റാണ്'}</p>`).join('')+'</div>':'';
return `<div tabindex="-1" class="feedback ${r.correct?'':'wrong'}"><div class="feedback-heading"><span class="status-icon" aria-hidden="true">${r.correct?'✓':'✕'}</span><strong>${r.correct?'ശരിയാണ് — 1 മാർക്ക്':'തെറ്റാണ് — 0 മാർക്ക്'}</strong></div>${parts}<p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,r.value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div><details><summary>വചനാധാരം കാണുക</summary>${q.evidence.map(e=>`<div class="evidence"><strong>${esc(e.label||'മത്തായി '+e.ref)}</strong><p>${esc(e.text)}</p></div>`).join('')}</details></div>`;}
function check(){if(responses[current])return;saveDraft();const q=quiz.questions[current],a=drafts[current];if(a===null||(q.type==='match'&&a.some(x=>x===''))){$('notice').textContent=q.type==='match'?'എല്ലാ കൂട്ടുകളും തിരഞ്ഞെടുക്കുക.':'ആദ്യം നിങ്ങളുടെ ഉത്തരം നൽകുക.';return;}
let value,correct;if(q.type==='mc'){value=Number(a);correct=value===q.answer;}else if(q.type==='tf'){value=a==='0';correct=value===q.answer;}else if(q.type==='fill'){value=Number(a);correct=value===q.optionAnswer;}else{value=a.map(Number);correct=value.every((x,i)=>x===i);}
responses[current]={value,correct};render();const target=$('feedback').firstElementChild;requestAnimationFrame(()=>{if(!target.isConnected)return;target.focus({preventScroll:true});target.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});target.classList.add(correct?'celebrate':'try-again');});}
function showResults(){const n=responses.filter(x=>x.correct).length;$('results').hidden=false;$('results').innerHTML=`<h2 id="results-title">ക്വിസ് പൂർത്തിയായി</h2><p><strong>നിങ്ങളുടെ സ്കോർ: ${n} / ${total}</strong></p><p>ശരിയായ ഉത്തരങ്ങൾ: ${n}<br>തെറ്റായ ഉത്തരങ്ങൾ: ${total-n}<br>ശതമാനം: ${Math.round(n/total*100)}%</p><h3>ഉത്തരങ്ങൾ പരിശോധിക്കാം</h3>`+quiz.questions.map((q,i)=>`<div class="review"><h3>${i+1}. ${esc(q.q)}</h3><p>${responses[i].correct?'ശരിയാണ്':'തെറ്റാണ്'}</p><p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,responses[i].value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div></div>`).join('');}
function jumpTo(index){if(!Number.isInteger(index)||index<0||index>=total)return;saveDraft();current=index;render();$('question-title').focus({preventScroll:true});$('question-panel').scrollIntoView({block:'start'});}function move(step){jumpTo(current+step);}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reset').onclick=()=>{current=0;responses=quiz.questions.map(()=>null);drafts=quiz.questions.map(()=>null);render();$('question-title').focus();window.scrollTo(0,0);};render();
</script></body></html>
