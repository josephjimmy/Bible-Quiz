'use strict';
const quiz={"range": "21-23", "title": "ജറുസലെമിലെ യേശുവും മതനേതാക്കളുമായുള്ള ഏറ്റുമുട്ടലും", "questions": [{"type": "mc", "q": "രണ്ടു ശിഷ്യന്മാരെ അയച്ചപ്പോൾ യേശു എത്തിയിരുന്നത് എവിടെ?", "options": ["ഗലീലിയിലെ നസറത്ത്", "ജറുസലെമിനുള്ളിലെ ദേവാലയം", "ഒലിവുമലയ്ക്കരികെയുള്ള ബഥ്ഫഗെ", "ബഥാനിയായിലെ ഭവനം"], "answer": 2, "refs": ["21:1"], "id": 1, "evidence": [{"ref": "21:1", "text": "അവര്‍ ജറുസലെമിനെ സമീപിക്കവേ, ഒലിവുമലയ്ക്കരികെയുള്ള ബഥ്ഫഗെയിലെത്തി. അപ്പോള്‍ യേശു തന്റെ രണ്ടു ശിഷ്യന്‍മാരെ ഇപ്രകാരം നിര്‍ദേശിച്ചയച്ചു:"}]}, {"type": "mc", "q": "തട്ടിമറിച്ച മേശകളും ഇരിപ്പിടങ്ങളും യഥാക്രമം ആരുടേതായിരുന്നു?", "options": ["നാണയമാറ്റക്കാരുടേത്; പ്രാവുവിൽപനക്കാരുടേത്", "പ്രാവുവിൽപനക്കാരുടേത്; നാണയമാറ്റക്കാരുടേത്", "നാണയമാറ്റക്കാരുടേത്; കൃഷിക്കാരുടേത്", "കൃഷിക്കാരുടേത്; നാണയമാറ്റക്കാരുടേത്"], "answer": 0, "refs": ["21:12"], "id": 2, "evidence": [{"ref": "21:12", "text": "യേശു ദേവാലയത്തില്‍ പ്രവേശിച്ച് അവിടെ ക്രയവിക്രയം ചെയ്തുകൊണ്ടിരുന്നവരെയെല്ലാം പുറത്താക്കി. നാണയമാറ്റക്കാരുടെ മേശകളും പ്രാവുവില്‍പനക്കാരുടെ ഇരിപ്പിടങ്ങളും അവന്‍ തട്ടിമറിച്ചിട്ടു."}]}, {"type": "mc", "q": "ബഥാനിയായിൽ താമസിച്ചതിനു ശേഷം പ്രഭാതത്തിൽ എങ്ങോട്ടു പോകുമ്പോഴാണ് വിശന്നത്?", "options": ["ബഥ്ഫഗെയിലേക്ക്", "ഒലിവുമലയിലേക്ക്", "ഗലീലിയിലേക്ക്", "നഗരത്തിലേക്ക്"], "answer": 3, "refs": ["21:17", "21:18"], "id": 3, "evidence": [{"ref": "21:17", "text": "അനന്തരം അവന്‍ അവരെ വിട്ട് നഗരത്തില്‍നിന്ന് ബഥാനിയായിലേക്കു പോയി അവിടെ താമസിച്ചു."}, {"ref": "21:18", "text": "പ്രഭാതത്തില്‍ നഗരത്തിലേക്കു പോകുമ്പോള്‍ അവനു വിശന്നു."}]}, {"type": "mc", "q": "യോഹന്നാന്റെ ജ്ഞാനസ്നാനം മനുഷ്യരിൽനിന്നാണെന്നു പറയാൻ അവർ മടിച്ചതെന്തുകൊണ്ട്?", "options": ["ജനക്കൂട്ടത്തെ ഭയപ്പെട്ടതിനാൽ", "ദേശാധിപതിയെ ഭയപ്പെട്ടതിനാൽ", "സദുക്കായരെ ഭയപ്പെട്ടതിനാൽ", "യേശുവിനെ ഭയപ്പെട്ടതിനാൽ"], "answer": 0, "refs": ["21:26"], "id": 4, "evidence": [{"ref": "21:26", "text": "മനുഷ്യരില്‍നിന്ന് എന്നു പറഞ്ഞാലോ! നാം ജനക്കൂട്ടത്തെ ഭയപ്പെടുന്നു. എന്തെന്നാല്‍, എല്ലാവരും യോഹന്നാനെ ഒരു പ്രവാചകനായി പരിഗണിക്കുന്നു."}]}, {"type": "mc", "q": "രണ്ടു പുത്രന്മാരുടെ ഉപമയിൽ POC രേഖപ്പെടുത്തുന്ന ക്രമം?", "options": ["ഒന്നാമൻ പോകാമെന്നു പറഞ്ഞു പോയി; രണ്ടാമൻ നിരസിച്ചു പോയില്ല", "ഒന്നാമൻ നിരസിച്ചു പിന്നെ പോയി; രണ്ടാമൻ പോകാമെന്നു പറഞ്ഞു പോയില്ല", "ഒന്നാമൻ നിരസിച്ചു പോയില്ല; രണ്ടാമൻ പോകാമെന്നു പറഞ്ഞു പോയി", "ഒന്നാമൻ പോകാമെന്നു പറഞ്ഞു പോയില്ല; രണ്ടാമൻ നിരസിച്ചു പിന്നെ പോയി"], "answer": 3, "refs": ["21:29", "21:30"], "id": 5, "evidence": [{"ref": "21:29", "text": "ഞാന്‍ പോകാം എന്ന് അവന്‍ പറഞ്ഞു; എങ്കിലും പോയില്ല."}, {"ref": "21:30", "text": "അവന്‍ രണ്ടാമന്റെ അടുത്തുചെന്ന് ഇതുതന്നെ പറഞ്ഞു. അവനാകട്ടെ, എനിക്കു മനസ്‌സില്ല എന്നു പറഞ്ഞു; എങ്കിലും പിന്നീടു പശ്ചാത്തപിച്ച് അവന്‍ പോയി."}]}, {"type": "mc", "q": "മുന്തിരിത്തോട്ടം ഏൽപിക്കുന്നതിനു മുമ്പുള്ള നിർമാണങ്ങളുടെ ക്രമം?", "options": ["വേലി → ഗോപുരം → മുന്തിരിച്ചക്ക്", "ഗോപുരം → വേലി → മുന്തിരിച്ചക്ക്", "മുന്തിരിച്ചക്ക് → ഗോപുരം → വേലി", "വേലി → മുന്തിരിച്ചക്ക് → ഗോപുരം"], "answer": 3, "refs": ["21:33"], "id": 6, "evidence": [{"ref": "21:33", "text": "മറ്റൊരു ഉപമ കേട്ടുകൊള്ളുക. ഒരു വീട്ടുടമസ്ഥന്‍ ഒരു മുന്തിരിത്തോട്ടം നട്ടുപിടിപ്പിച്ചു. അതിനുചുറ്റും വേലികെട്ടി. അതില്‍ ഒരു മുന്തിരിച്ചക്കു സ്ഥാപിക്കുകയും ഗോപുരം നിര്‍മിക്കുകയും ചെയ്തു. അനന്തരം അതു കൃഷിക്കാരെ ഏല്‍പിച്ചിട്ട് അവന്‍ പോയി."}]}, {"type": "mc", "q": "അവകാശിയായ പുത്രനെ കൃഷിക്കാർ എവിടെവച്ചാണ് കൊന്നത്?", "options": ["മുന്തിരിത്തോട്ടത്തിന്റെ ഗോപുരത്തിൽ", "മുന്തിരിച്ചക്കിന്റെ സമീപത്ത്", "മുന്തിരിത്തോട്ടത്തിനു വെളിയിൽ", "മുന്തിരിത്തോട്ടത്തിനുള്ളിൽ"], "answer": 2, "refs": ["21:39"], "id": 7, "evidence": [{"ref": "21:39", "text": "അവര്‍ അവനെ പിടിച്ച് മുന്തിരിത്തോട്ടത്തിനു വെളിയിലേക്കെറിഞ്ഞുകൊന്നുകളഞ്ഞു."}]}, {"type": "mc", "q": "വിവാഹവിരുന്ന് വകവയ്ക്കാതെ പോയ രണ്ടുപേരുടെ ലക്ഷ്യങ്ങൾ?", "options": ["ദേവാലയവും സിനഗോഗും", "വയലും വ്യാപാരവും", "വയലും സിനഗോഗും", "വ്യാപാരവും ദേവാലയവും"], "answer": 1, "refs": ["22:5"], "id": 8, "evidence": [{"ref": "22:5", "text": "എന്നാല്‍, ക്ഷണിക്കപ്പെട്ടവര്‍ അതു വകവയ്ക്കാതെ ഒരുവന്‍ വയലിലേക്കും, വേറൊരുവന്‍ വ്യാപാരത്തിനും പൊയ്ക്കളഞ്ഞു."}]}, {"type": "mc", "q": "സദുക്കായരുടെ തെറ്റിന് കാരണം മനസ്സിലാക്കാത്ത രണ്ടു കാര്യങ്ങൾ?", "options": ["വിശുദ്ധലിഖിതങ്ങളും ദൈവത്തിന്റെ ശക്തിയും", "പുനരുത്ഥാനവും ന്യായവിധിയും", "ദൈവരാജ്യവും ദൈവത്തിന്റെ അധികാരവും", "നിയമവും പ്രവാചകന്മാരും"], "answer": 0, "refs": ["22:29"], "id": 9, "evidence": [{"ref": "22:29", "text": "യേശു മറുപടി പറഞ്ഞു: വിശുദ്ധലിഖിതങ്ങളോ ദൈവത്തിന്റെ ശക്തിയോ മനസ്‌സിലാക്കാത്തതിനാല്‍ നിങ്ങള്‍ക്കു തെറ്റുപറ്റിയിരിക്കുന്നു."}]}, {"type": "mc", "q": "അതിപ്രധാന കൽപനയെക്കുറിച്ച് പരീക്ഷിക്കാൻ ചോദിച്ചത് ആരാണ്?", "options": ["ഒരു സദുക്കായൻ", "ഒരു നിയമപണ്ഡിതൻ", "ഒരു പ്രധാനപുരോഹിതൻ", "ഒരു ജനപ്രമാണി"], "answer": 1, "refs": ["22:35"], "id": 10, "evidence": [{"ref": "22:35", "text": "അവരില്‍ ഒരു നിയമപണ്ഡിതന്‍ അവനെ പരീക്ഷിക്കാന്‍ ചോദിച്ചു:"}]}, {"type": "mc", "q": "വീതിയും നീളവും കൂട്ടുന്നവ യഥാക്രമം?", "options": ["ഇരിപ്പിടങ്ങൾ; വസ്ത്രങ്ങൾ", "വസ്ത്രത്തിന്റെ തൊങ്ങലുകൾ; നെറ്റിപ്പട്ടകൾ", "നെറ്റിപ്പട്ടകൾ; വസ്ത്രത്തിന്റെ തൊങ്ങലുകൾ", "വസ്ത്രങ്ങൾ; ഇരിപ്പിടങ്ങൾ"], "answer": 2, "refs": ["23:5"], "id": 11, "evidence": [{"ref": "23:5", "text": "മറ്റുള്ളവര്‍ കാണുന്നതിനുവേണ്ടിയാണ്അവര്‍ തങ്ങളുടെ പ്രവൃത്തികളെല്ലാം ചെയ്യുന്നത്. അവര്‍ തങ്ങളുടെ നെറ്റിപ്പട്ടകള്‍ക്കു വീതിയും വസ്ത്രത്തിന്റെ തൊങ്ങലുകള്‍ക്കു നീളവും കൂട്ടുന്നു;"}]}, {"type": "mc", "q": "നിയമത്തിലെ ഗൗരവമേറിയ കാര്യങ്ങളുടെ കൃത്യമായ പട്ടിക?", "options": ["നീതി, കാരുണ്യം, വിശുദ്ധി", "നീതി, കാരുണ്യം, വിശ്വസ്തത", "നീതി, സ്നേഹം, വിശ്വസ്തത", "കാരുണ്യം, വിശ്വാസം, പ്രത്യാശ"], "answer": 1, "refs": ["23:23"], "id": 12, "evidence": [{"ref": "23:23", "text": "കപടനാട്യക്കാരായ നിയമജ്ഞരേ, ഫരിസേയരേ, നിങ്ങള്‍ക്കു ദുരിതം! നിങ്ങള്‍ തുളസി, ചതകുപ്പ, ജീരകം എന്നിവയ്ക്കു ദശാംശം കൊടുക്കുകയും നിയമത്തിലെ ഗൗരവമേറിയ കാര്യങ്ങളായ നീതി, കാരുണ്യം, വിശ്വസ്തത എന്നിവ അവഗണിക്കുകയും ചെയ്യുന്നു. ഇവയാണു നിങ്ങള്‍ ചെയ്യേണ്ടിയിരുന്നത് - മറ്റുള്ളവ അവഗണിക്കാതെതന്നെ."}]}, {"type": "mc", "q": "സഖറിയായുടെ വധസ്ഥലമായി പറയുന്ന രണ്ടു കാര്യങ്ങൾക്കിടയിലെ സ്ഥലം?", "options": ["നഗരത്തിനും ഒലിവുമലയ്ക്കും മധ്യേ", "ദേവാലയത്തിനും ബലിപീഠത്തിനും മധ്യേ", "ബലിപീഠത്തിനും സിനഗോഗിനും മധ്യേ", "ദേവാലയത്തിനും ഗോപുരത്തിനും മധ്യേ"], "answer": 1, "refs": ["23:35"], "id": 13, "evidence": [{"ref": "23:35", "text": "അങ്ങനെ, നിരപരാധനായ ആബേലിന്റെ രക്തം മുതല്‍ ദേവാലയത്തിനും ബലിപീഠത്തിനും മധ്യേ വച്ചു നിങ്ങള്‍ വധിച്ച ബറാക്കിയായുടെ പുത്രനായ സഖറിയായുടെ രക്തംവരെ, ഭൂമിയില്‍ ചൊരിയപ്പെട്ട എല്ലാ നീതിമാന്‍മാരുടെയും രക്തം നിങ്ങളുടെമേല്‍ പതിക്കും."}]}, {"type": "fill", "q": "അവര്‍ അവനോടു പറഞ്ഞു: ഇവരെന്താണു പറയുന്നതെന്ന് നീ കേള്‍ക്കുന്നില്ലേ? യേശു പ്രതിവചിച്ചു: ഉവ്വ്; ശിശുക്കളുടെയും മുലകുടിക്കുന്നവരുടെയും ________ നീ സ്തുതി ഒരുക്കി എന്ന് നിങ്ങള്‍ ഒരിക്കലും വായിച്ചിട്ടില്ലേ? (21:16)", "answer": "അധരങ്ങളില്‍", "refs": ["21:16"], "id": 14, "evidence": [{"ref": "21:16", "text": "അവര്‍ അവനോടു പറഞ്ഞു: ഇവരെന്താണു പറയുന്നതെന്ന് നീ കേള്‍ക്കുന്നില്ലേ? യേശു പ്രതിവചിച്ചു: ഉവ്വ്; ശിശുക്കളുടെയും മുലകുടിക്കുന്നവരുടെയും അധരങ്ങളില്‍ നീ സ്തുതി ഒരുക്കി എന്ന് നിങ്ങള്‍ ഒരിക്കലും വായിച്ചിട്ടില്ലേ?"}], "options": ["അധരങ്ങളില്‍", "ഹൃദയങ്ങളിൽ", "വാക്കുകളിൽ", "കരങ്ങളിൽ"], "optionAnswer": 0}, {"type": "fill", "q": "ഈ കല്ലില്‍ വീഴുന്നവന്‍ തകര്‍ന്നുപോകും. ഇത് ആരുടെമേല്‍ വീഴുന്നുവോ, അവനെ അതു ________. (21:44)", "answer": "ധൂളിയാക്കും", "refs": ["21:44"], "id": 15, "evidence": [{"ref": "21:44", "text": "ഈ കല്ലില്‍ വീഴുന്നവന്‍ തകര്‍ന്നുപോകും. ഇത് ആരുടെമേല്‍ വീഴുന്നുവോ, അവനെ അതു ധൂളിയാക്കും."}], "options": ["തകർത്തുകളയും", "ധൂളിയാക്കും", "നശിപ്പിക്കും", "പിളർക്കും"], "optionAnswer": 1}, {"type": "fill", "q": "അവന്‍ പറഞ്ഞു: നീ നിന്റെ ദൈവമായ കര്‍ത്താവിനെ പൂര്‍ണ ഹൃദയത്തോടും പൂര്‍ണാത്മാവോടും ________ സ്‌നേഹിക്കുക. (22:37)", "answer": "പൂര്‍ണമനസ്‌സോടുംകൂടെ", "refs": ["22:37"], "id": 16, "evidence": [{"ref": "22:37", "text": "അവന്‍ പറഞ്ഞു: നീ നിന്റെ ദൈവമായ കര്‍ത്താവിനെ പൂര്‍ണ ഹൃദയത്തോടും പൂര്‍ണാത്മാവോടും പൂര്‍ണമനസ്‌സോടുംകൂടെ സ്‌നേഹിക്കുക."}], "options": ["പൂർണചിത്തത്തോടുംകൂടെ", "പൂർണശക്തിയോടുംകൂടെ", "പൂർണവിശ്വാസത്തോടുംകൂടെ", "പൂര്‍ണമനസ്‌സോടുംകൂടെ"], "optionAnswer": 3}, {"type": "fill", "q": "ഈ രണ്ടു കല്‍പനകളില്‍ സമസ്ത നിയമവുംപ്രവാചകന്‍മാരും ________. (22:40)", "answer": "അധിഷ്ഠിതമായിരിക്കുന്നു", "refs": ["22:40"], "id": 17, "evidence": [{"ref": "22:40", "text": "ഈ രണ്ടു കല്‍പനകളില്‍ സമസ്ത നിയമവുംപ്രവാചകന്‍മാരും അധിഷ്ഠിതമായിരിക്കുന്നു."}], "options": ["അധിഷ്ഠിതമായിരിക്കുന്നു", "വെളിപ്പെട്ടിരിക്കുന്നു", "പൂർത്തിയായിരിക്കുന്നു", "അവസാനിച്ചിരിക്കുന്നു"], "optionAnswer": 0}, {"type": "fill", "q": "കപടനാട്യക്കാരായ നിയമജ്ഞരേ, ഫരിസേയരേ, നിങ്ങള്‍ക്കു ദുരിതം! ഒരുവനെ നിങ്ങളുടെ മതത്തില്‍ ചേര്‍ക്കാന്‍ നിങ്ങള്‍ കടലും കരയും ചുറ്റി സഞ്ചരിക്കുന്നു. ചേര്‍ന്നു കഴിയുമ്പോള്‍ നിങ്ങള്‍ അവനെ നിങ്ങളുടെ ________ നരകസന്തതിയാക്കിത്തീര്‍ക്കുന്നു. (23:15)", "answer": "ഇരട്ടി", "refs": ["23:15"], "id": 18, "evidence": [{"ref": "23:15", "text": "കപടനാട്യക്കാരായ നിയമജ്ഞരേ, ഫരിസേയരേ, നിങ്ങള്‍ക്കു ദുരിതം! ഒരുവനെ നിങ്ങളുടെ മതത്തില്‍ ചേര്‍ക്കാന്‍ നിങ്ങള്‍ കടലും കരയും ചുറ്റി സഞ്ചരിക്കുന്നു. ചേര്‍ന്നു കഴിയുമ്പോള്‍ നിങ്ങള്‍ അവനെ നിങ്ങളുടെ ഇരട്ടി നരകസന്തതിയാക്കിത്തീര്‍ക്കുന്നു."}], "options": ["ഇരട്ടി", "മൂന്നിരട്ടി", "പത്തിരട്ടി", "നൂറിരട്ടി"], "optionAnswer": 0}, {"type": "fill", "q": "കപടനാട്യക്കാരായ നിയമജ്ഞരേ, ഫരിസേയരേ, നിങ്ങള്‍ക്കു ദുരിതം! നിങ്ങള്‍ പാനപാത്രത്തിന്റെയും ഭക്ഷണപാത്രത്തിന്റെയും പുറംവെടിപ്പാക്കുന്നു; എന്നാല്‍, അവയുടെ ഉള്ള് ________ നിറഞ്ഞിരിക്കുന്നു. (23:25)", "answer": "കവര്‍ച്ചയും ആര്‍ത്തിയുംകൊണ്ട്", "refs": ["23:25"], "id": 19, "evidence": [{"ref": "23:25", "text": "കപടനാട്യക്കാരായ നിയമജ്ഞരേ, ഫരിസേയരേ, നിങ്ങള്‍ക്കു ദുരിതം! നിങ്ങള്‍ പാനപാത്രത്തിന്റെയും ഭക്ഷണപാത്രത്തിന്റെയും പുറംവെടിപ്പാക്കുന്നു; എന്നാല്‍, അവയുടെ ഉള്ള് കവര്‍ച്ചയും ആര്‍ത്തിയുംകൊണ്ട് നിറഞ്ഞിരിക്കുന്നു."}], "options": ["അധർ‍മവും അസൂയയുംകൊണ്ട്", "കാപട്യവും അനീതിയുംകൊണ്ട്", "കവര്‍ച്ചയും ആര്‍ത്തിയുംകൊണ്ട്", "അസ്ഥികളും മാലിന്യങ്ങളുംകൊണ്ട്"], "optionAnswer": 2}, {"type": "fill", "q": "ഇതാ, നിങ്ങളുടെ ഭവനം ________. (23:38)", "answer": "പരിത്യക്തവും ശൂന്യവുമായിത്തീര്‍ന്നിരിക്കുന്നു", "refs": ["23:38"], "id": 20, "evidence": [{"ref": "23:38", "text": "ഇതാ, നിങ്ങളുടെ ഭവനം പരിത്യക്തവും ശൂന്യവുമായിത്തീര്‍ന്നിരിക്കുന്നു."}], "options": ["പരിത്യക്തവും തകർന്നതുമായിത്തീർന്നിരിക്കുന്നു", "പരിത്യക്തവും അശുദ്ധവുമായിത്തീർന്നിരിക്കുന്നു", "പരിത്യക്തവും ശൂന്യവുമായിത്തീര്‍ന്നിരിക്കുന്നു", "നശിച്ചതും ശൂന്യവുമായിത്തീർന്നിരിക്കുന്നു"], "optionAnswer": 2}, {"type": "match", "q": "ചോദ്യം അല്ലെങ്കിൽ പ്രസ്താവന ആരോടുള്ളതെന്ന് യോജിപ്പിക്കുക.", "rows": [["എന്തധികാരത്താലാണ് നീ ഇതൊക്കെ ചെയ്യുന്നത്?", "യേശുവിനോട് പ്രധാനപുരോഹിതന്മാരും ജനപ്രമാണികളും"], ["യോഹന്നാന്റെ ജ്ഞാനസ്നാനം എവിടെ നിന്നായിരുന്നു?", "അധികാരം ചോദിച്ചവരോട് യേശു"], ["നിയമത്തിലെ അതിപ്രധാനമായ കൽപന ഏതാണ്?", "യേശുവിനോട് നിയമപണ്ഡിതൻ"], ["അവൻ ആരുടെ പുത്രനാണ്?", "ഫരിസേയരോട് യേശു"]], "refs": ["21:23", "21:25", "22:35", "22:36", "22:41", "22:42"], "id": 21, "evidence": [{"ref": "21:23", "text": "അവന്‍ ദേവാലയത്തിലെത്തി പഠിപ്പിച്ചുകൊണ്ടിരിക്കുമ്പോള്‍ പ്രധാനപുരോഹിതന്‍മാരും ജനപ്രമാണികളും അവനെ സമീപിച്ചുചോദിച്ചു: എന്തധികാരത്താലാണ് നീ ഇതൊക്കെ ചെയ്യുന്നത്? നിനക്ക് ഈ അധികാരം നല്‍കിയത് ആരാണ്?"}, {"ref": "21:25", "text": "യോഹന്നാന്റെ ജ്ഞാനസ്‌നാനം എവിടെ നിന്നായിരുന്നു? സ്വര്‍ഗത്തില്‍ നിന്നോ മനുഷ്യരില്‍നിന്നോ? അവര്‍ പരസ്പരം ആലോചിച്ചു; സ്വര്‍ഗത്തില്‍ നിന്ന് എന്നു നാം പറഞ്ഞാല്‍, പിന്നെ എന്തുകൊണ്ട് നിങ്ങള്‍ അവനെ വിശ്വസിച്ചില്ല എന്ന് അവന്‍ ചോദിക്കും."}, {"ref": "22:35", "text": "അവരില്‍ ഒരു നിയമപണ്ഡിതന്‍ അവനെ പരീക്ഷിക്കാന്‍ ചോദിച്ചു:"}, {"ref": "22:36", "text": "ഗുരോ, നിയമത്തിലെ അതിപ്രധാനമായ കല്‍പന ഏതാണ്?"}, {"ref": "22:41", "text": "ഫരിസേയര്‍ ഒരുമിച്ചുകൂടിയപ്പോള്‍ യേശു അവരോടു ചോദിച്ചു:"}, {"ref": "22:42", "text": "നിങ്ങള്‍ ക്രിസ്തുവിനെപ്പറ്റി എന്തു വിചാരിക്കുന്നു? അവന്‍ ആരുടെ പുത്രനാണ്? ദാവീദിന്റെ, എന്ന് അവര്‍ പറഞ്ഞു."}]}, {"type": "match", "q": "ആണയിടുന്ന കാര്യവും അതുമായി ബന്ധിപ്പിക്കുന്നതും യോജിപ്പിക്കുക.", "rows": [["ബലിപീഠം", "അതും അതിന്മേലുള്ള എല്ലാ വസ്തുക്കളും"], ["ദേവാലയം", "അതും അതിൽ വസിക്കുന്നവനും"], ["സ്വർഗം", "ദൈവത്തിന്റെ സിംഹാസനവും അതിൽ ഇരിക്കുന്നവനും"], ["ബലിപീഠത്തിലെ കാഴ്ചവസ്തു", "അതിനെ പവിത്രമാക്കുന്ന ബലിപീഠം വലുത്"]], "refs": ["23:20", "23:21", "23:22", "23:19"], "id": 22, "evidence": [{"ref": "23:20", "text": "ബലിപീഠത്തെക്കൊണ്ട് ആണയിടുന്നവന്‍ അതിനെക്കൊണ്ടും അതിന്‍മേലുള്ള എല്ലാ വസ്തുക്കളെക്കൊണ്ടും ആണയിടുന്നു."}, {"ref": "23:21", "text": "ദേവാലയത്തെക്കൊണ്ട് ആണയിടുന്നവന്‍ അതിനെക്കൊണ്ടും അതില്‍ വസിക്കുന്നവനെക്കൊണ്ടും ആണയിടുന്നു."}, {"ref": "23:22", "text": "സ്വര്‍ഗത്തെക്കൊണ്ട് ആണയിടുന്നവന്‍ function render(){const q=quiz.questions[current],r=responses[current],a=drafts[current];const count=responses.filter(Boolean).length,score=responses.filter(x=>x?.correct).length;
$('position').textContent=`ചോദ്യം ${current+1} / ${total}`;$('score').textContent=`നിങ്ങളുടെ സ്കോർ: ${score} / ${total}`;$('remaining').textContent=`ബാക്കി: ${total-count}`;$('progress').max=total;$('progress').value=count;$('checked-count').textContent=`പരിശോധിച്ചത്: ${count} / ${total}`;
$('question-jump').innerHTML=quiz.questions.map((item,i)=>{const response=responses[i],state=response?(response.correct?'ശരിയായ ഉത്തരം':'തെറ്റായ ഉത്തരം'):'പരിശോധിച്ചിട്ടില്ല';return `<button type="button" data-jump="${i}" class="${response?(response.correct?'done-correct':'done-wrong'):''}" ${i===current?'aria-current="step"':''} aria-label="ചോദ്യം ${i+1}, ${state}">${i+1}${response?(response.correct?' ✓':' ✕'):''}</button>`;}).join('');$('question-jump').querySelectorAll('button').forEach(button=>button.onclick=()=>jumpTo(Number(button.dataset.jump)));
$('type').textContent=labels[q.type];$('question-title').textContent=`${current+1}. ${q.q}`;$('notice').textContent='';
if(q.type==='mc'||q.type==='fill'||q.type==='tf'){const opts=q.type==='tf'?['ശരി','തെറ്റ്']:q.options;$('controls').innerHTML='<fieldset style="border:0;padding:0;margin:0"><legend>നിങ്ങളുടെ ഉത്തരം തിരഞ്ഞെടുക്കുക</legend>'+opts.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${String(a)===String(i)?'checked':''} ${r?'disabled':''}><span>${q.type!=='tf'?String.fromCharCode(65+i)+'. ':''}${esc(o)}</span></label>`).join('')+'</fieldset>';
}else{const order=q.rows.map((_,i)=>i).sort((x,y)=>((x*3+1)%q.rows.length)-((y*3+1)%q.rows.length));if(order.every((x,i)=>x===i))order.reverse();$('controls').innerHTML=q.rows.map((row,i)=>`<div class="match-row"><label for="match-${i}">${i+1}. ${esc(row[0])}</label><select id="match-${i}" ${r?'disabled':''}><option value="">തിരഞ്ഞെടുക്കുക</option>${order.map(j=>`<option value="${j}" ${a&&String(a[i])===String(j)?'selected':''}>${esc(q.rows[j][1])}</option>`).join('')}</select></div>`).join('');}
$('feedback').innerHTML=r?feedback(q,r):'';$('prev').disabled=current===0;$('next').disabled=current===total-1;$('controls').querySelectorAll('input,select').forEach(control=>{control.oninput=answerSelected;control.onchange=answerSelected;if(q.type==='match')control.onblur=answerSelected;});
if(count===total)showResults();else{$('results').hidden=true;$('results').innerHTML='';}}
function feedback(q,r){const parts=q.type==='match'?'<div>'+q.rows.map((row,i)=>`<p>${i+1}. ${esc(row[0])}: ${r.value[i]===i?'ശരിയാണ്':'തെറ്റാണ്'}</p>`).join('')+'</div>':'';
return `<div tabindex="-1" class="feedback ${r.correct?'':'wrong'}"><div class="feedback-heading"><span class="status-icon" aria-hidden="true">${r.correct?'✓':'✕'}</span><strong>${r.correct?'ശരിയാണ് — 1 മാർക്ക്':'തെറ്റാണ് — 0 മാർക്ക്'}</strong></div>${parts}<p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,r.value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div><details><summary>വചനാധാരം കാണുക</summary>${q.evidence.map(e=>`<div class="evidence"><strong>${esc(e.label||'മത്തായി '+e.ref)}</strong><p>${esc(e.text)}</p></div>`).join('')}</details></div>`;}
function check(){if(responses[current])return;saveDraft();const q=quiz.questions[current],a=drafts[current];if(a===null||(q.type==='match'&&a.some(x=>x===''))){$('notice').textContent=q.type==='match'?'എല്ലാ കൂട്ടുകളും തിരഞ്ഞെടുക്കുക.':'ആദ്യം നിങ്ങളുടെ ഉത്തരം നൽകുക.';return;}
let value,correct;if(q.type==='mc'){value=Number(a);correct=value===q.answer;}else if(q.type==='tf'){value=a==='0';correct=value===q.answer;}else if(q.type==='fill'){value=Number(a);correct=value===q.optionAnswer;}else{value=a.map(Number);correct=value.every((x,i)=>x===i);}
responses[current]={value,correct};render();const target=$('feedback').firstElementChild;requestAnimationFrame(()=>{if(!target.isConnected)return;target.focus({preventScroll:true});target.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});target.classList.add(correct?'celebrate':'try-again');});}
function showResults(){const n=responses.filter(x=>x.correct).length;$('results').hidden=false;$('results').innerHTML=`<h2 id="results-title">ക്വിസ് പൂർത്തിയായി</h2><p><strong>നിങ്ങളുടെ സ്കോർ: ${n} / ${total}</strong></p><p>ശരിയായ ഉത്തരങ്ങൾ: ${n}<br>തെറ്റായ ഉത്തരങ്ങൾ: ${total-n}<br>ശതമാനം: ${Math.round(n/total*100)}%</p><h3>ഉത്തരങ്ങൾ പരിശോധിക്കാം</h3>`+quiz.questions.map((q,i)=>`<div class="review"><h3>${i+1}. ${esc(q.q)}</h3><p>${responses[i].correct?'ശരിയാണ്':'തെറ്റാണ്'}</p><p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,responses[i].value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div></div>`).join('');}
function jumpTo(index){if(!Number.isInteger(index)||index<0||index>=total)return;saveDraft();current=index;render();$('question-title').focus({preventScroll:true});$('question-panel').scrollIntoView({block:'start'});}function move(step){jumpTo(current+step);}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reset').onclick=()=>{current=0;responses=quiz.questions.map(()=>null);drafts=quiz.questions.map(()=>null);render();$('question-title').focus();window.scrollTo(0,0);};render();
</script></body></html>
