'use strict';
const quiz={"range": "28", "title": "ഉത്ഥാനവും മഹാദൗത്യവും", "questions": [{"type": "mc", "q": "ശവകുടീരം സന്ദർശിക്കാൻ വന്ന സമയം കൃത്യമായി ഏത്?", "options": ["സാബത്തിനുശേഷം ആഴ്ചയുടെ ഒന്നാം ദിവസം രാവിലെ", "സാബത്തിനു മുമ്പ് ഒരുക്കദിനത്തിൽ രാവിലെ", "സാബത്തിനു മുമ്പ് ഒരുക്കദിനത്തിൽ വൈകുന്നേരം", "സാബത്തിനുശേഷം ആഴ്ചയുടെ ഒന്നാം ദിവസം വൈകുന്നേരം"], "answer": 0, "refs": ["28:1"], "id": 1, "evidence": [{"ref": "28:1", "text": "സാബത്തിനുശേഷം ആഴ്ചയുടെ ഒന്നാം ദിവസം രാവിലെ മഗ്ദലേനമറിയവും മറ്റേ മറിയവും ശവകുടീരം സന്ദര്‍ശിക്കാന്‍ വന്നു."}]}, {"type": "mc", "q": "ദൂതന്റെ പ്രവൃത്തികളുടെ ക്രമം?", "options": ["കല്ലുരുട്ടിമാറ്റി → ഇറങ്ങിവന്നു → അതിന്മേൽ ഇരുന്നു", "ഇറങ്ങിവന്നു → അതിന്മേൽ ഇരുന്നു → കല്ലുരുട്ടിമാറ്റി", "അതിന്‍മേൽ ഇരുന്നു → കല്ലുരുട്ടിമാറ്റി → ഇറങ്ങിവന്നു", "ഇറങ്ങിവന്നു → കല്ലുരുട്ടിമാറ്റി → അതിന്മേൽ ഇരുന്നു"], "answer": 3, "refs": ["28:2"], "id": 2, "evidence": [{"ref": "28:2", "text": "അപ്പോള്‍ വലിയ ഒരു ഭൂകമ്പം ഉണ്ടായി. കര്‍ത്താവിന്റെ ദൂതന്‍ സ്വര്‍ഗത്തില്‍ നിന്നിറങ്ങിവന്ന്, കല്ലുരുട്ടിമാറ്റി, അതിന്‍മേല്‍ ഇരുന്നു."}]}, {"type": "mc", "q": "കാവൽക്കാർ വിറപൂണ്ടതിന്റെ കാരണം എന്തായി വ്യക്തമാക്കുന്നു?", "options": ["സ്ത്രീകളെക്കുറിച്ചുള്ള ഭയം", "ഭൂകമ്പത്തെക്കുറിച്ചുള്ള ഭയം", "ദൂതനെക്കുറിച്ചുള്ള ഭയം", "ശിഷ്യന്മാരെക്കുറിച്ചുള്ള ഭയം"], "answer": 2, "refs": ["28:4"], "id": 3, "evidence": [{"ref": "28:4", "text": "അവനെക്കുറിച്ചുള്ള ഭയം നിമിത്തം കാവല്‍ക്കാര്‍ വിറപൂണ്ട് മരിച്ചവരെപ്പോലെയായി."}]}, {"type": "mc", "q": "ദൂതൻ സ്ത്രീകൾ അന്വേഷിക്കുന്ന യേശുവിനെ എങ്ങനെ വിശേഷിപ്പിച്ചു?", "options": ["ക്രൂശിക്കപ്പെട്ട യേശു", "ഗലീലിക്കാരനായ യേശു", "നസറായനായ യേശു", "ഉയിർപ്പിക്കപ്പെട്ട യേശു"], "answer": 0, "refs": ["28:5"], "id": 4, "evidence": [{"ref": "28:5", "text": "ദൂതന്‍ സ്ത്രീകളോടു പറഞ്ഞു: ഭയപ്പെടേണ്ടാ; ക്രൂശിക്കപ്പെട്ട യേശുവിനെയാണു നിങ്ങള്‍ അന്വേഷിക്കുന്നതെന്ന് എനിക്കറിയാം."}]}, {"type": "mc", "q": "ശിഷ്യന്മാർക്ക് വിവരം അറിയിക്കാൻ പറയുന്നതിനു മുമ്പുള്ള നിർദേശം?", "options": ["പട്ടണത്തിലെ കാവൽക്കാരെ വിളിക്കുവിൻ", "ഗലീലിയിലെ മലയിലേക്ക് പോകുവിൻ", "അവൻ കിടന്ന സ്ഥലം വന്നുകാണുവിൻ", "അവന്റെ പാദങ്ങളിൽ കെട്ടിപ്പിടിക്കുവിൻ"], "answer": 2, "refs": ["28:7"], "id": 5, "evidence": [{"ref": "28:7", "text": "അവന്‍ കിടന്ന സ്ഥലം വന്നുകാണുവിന്‍. വേഗം പോയി അവന്റെ ശിഷ്യന്‍മാരോട്, അവന്‍ മരിച്ചവരുടെയിടയില്‍നിന്ന് ഉയിര്‍പ്പിക്കപ്പെട്ടെന്നും നിങ്ങള്‍ക്കു മുമ്പേ ഗലീലിയിലേക്കു പോകുന്നെന്നും അവിടെവച്ച് നിങ്ങള്‍ അവനെ കാണുമെന്നും പറയുവിന്‍. ഇതാ, ഇക്കാര്യം ഞാന്‍ നിങ്ങളോടു പറഞ്ഞിരിക്കുന്നു."}]}, {"type": "mc", "q": "ദൂതന്റെ സന്ദേശത്തിലെ ഗലീലിയിലേക്കുള്ള യാത്രയുടെ വിശദാംശം?", "options": ["നിങ്ങൾക്കു മുമ്പേ പോകുന്നു", "നിങ്ങൾ എത്തുന്നതുവരെ പോകുന്നില്ല", "നിങ്ങൾക്കു പിന്നാലെ പോകുന്നു", "നിങ്ങളോടൊപ്പം പോകുന്നു"], "answer": 0, "refs": ["28:7"], "id": 6, "evidence": [{"ref": "28:7", "text": "അവന്‍ കിടന്ന സ്ഥലം വന്നുകാണുവിന്‍. വേഗം പോയി അവന്റെ ശിഷ്യന്‍മാരോട്, അവന്‍ മരിച്ചവരുടെയിടയില്‍നിന്ന് ഉയിര്‍പ്പിക്കപ്പെട്ടെന്നും നിങ്ങള്‍ക്കു മുമ്പേ ഗലീലിയിലേക്കു പോകുന്നെന്നും അവിടെവച്ച് നിങ്ങള്‍ അവനെ കാണുമെന്നും പറയുവിന്‍. ഇതാ, ഇക്കാര്യം ഞാന്‍ നിങ്ങളോടു പറഞ്ഞിരിക്കുന്നു."}]}, {"type": "mc", "q": "സ്ത്രീകൾ വിവരം അറിയിക്കാൻ ഓടിയതിനു പിന്നാലെ സംഭവിച്ചത്?", "options": ["ശിഷ്യന്മാർ ഗലീലിയിലേക്ക് പുറപ്പെട്ടു", "പ്രധാനപുരോഹിതന്മാർ കൂടിയാലോചിച്ചു", "കാവൽക്കാർ വന്ന് വഴി തടഞ്ഞു", "യേശു എതിരേ വന്ന് അഭിവാദനം ചെയ്തു"], "answer": 3, "refs": ["28:8", "28:9"], "id": 7, "evidence": [{"ref": "28:8", "text": "അവര്‍ കല്ലറവിട്ട് ഭയത്തോടും വലിയ സന്തോഷത്തോടും കൂടെ ശിഷ്യന്‍മാരെ വിവരം അറിയിക്കാന്‍ ഓടി."}, {"ref": "28:9", "text": "അപ്പോള്‍ യേശു എതിരേ വന്ന് അവരെ അഭിവാദനംചെയ്തു. അവര്‍ അവനെ സമീപിച്ച് പാദങ്ങളില്‍ കെട്ടിപ്പിടിച്ച് ആരാധിച്ചു."}]}, {"type": "mc", "q": "സംഭവിച്ചതെല്ലാം അറിയിക്കാൻ കാവൽക്കാരിൽ ചിലർ ചെന്ന സ്ഥലം?", "options": ["മറ്റേ മറിയത്തിന്റെ ഭവനം", "പട്ടണം", "ഗലീലിയിലെ മല", "ശവകുടീരം"], "answer": 1, "refs": ["28:11"], "id": 8, "evidence": [{"ref": "28:11", "text": "അവര്‍ പോയപ്പോള്‍ കാവല്‍ക്കാരില്‍ ചിലര്‍ പട്ടണത്തില്‍ ചെന്ന് സംഭവിച്ചതെല്ലാംപ്രധാനപുരോഹിതന്‍മാരെ അറിയിച്ചു."}]}, {"type": "mc", "q": "പടയാളികൾക്കു പണം നൽകുന്നതിനു മുമ്പ് ആരുമായി കൂടിയാലോചിച്ചു?", "options": ["ദേശാധിപതിയുമായി", "നിയമജ്ഞരുമായി", "ഫരിസേയരുമായി", "പ്രമാണികളുമായി"], "answer": 3, "refs": ["28:12"], "id": 9, "evidence": [{"ref": "28:12", "text": "അവരും പ്രമാണികളും കൂടിയാലോചിച്ചതിനുശേഷം പടയാളികള്‍ക്കുവേണ്ടത്ര പണംകൊടുത്തിട്ടു പറഞ്ഞു:"}]}, {"type": "mc", "q": "പടയാളികളോട് പറയാൻ നിർദേശിച്ച വ്യാജകഥയിലെ സമയവും അവസ്ഥയും?", "options": ["രാവിലെ, ഞങ്ങൾ ഉറങ്ങിയപ്പോൾ", "രാത്രിയിൽ, ഞങ്ങൾ ഉണർന്നിരിക്കുമ്പോൾ", "രാത്രിയിൽ, ഞങ്ങൾ ഉറങ്ങിയപ്പോൾ", "രാവിലെ, ഞങ്ങൾ പട്ടണത്തിലായപ്പോൾ"], "answer": 2, "refs": ["28:13"], "id": 10, "evidence": [{"ref": "28:13", "text": "ഞങ്ങള്‍ ഉറങ്ങിയപ്പോള്‍ രാത്രിയില്‍ അവന്റെ ശിഷ്യന്‍മാര്‍ വന്ന് അവനെ മോഷ്ടിച്ചുകൊണ്ടുപോയി എന്നുപറയുവിന്‍."}]}, {"type": "mc", "q": "പണം വാങ്ങിയവരുടെ തുടർനടപടി എന്തായി പറയുന്നു?", "options": ["ശിഷ്യന്മാരെ പിന്തുടർന്നു", "നിർദേശമനുസരിച്ചു പ്രവർത്തിച്ചു", "ദേശാധിപതിയെ വിവരം അറിയിച്ചു", "പ്രമാണികളുമായി വീണ്ടും ആലോചിച്ചു"], "answer": 1, "refs": ["28:15"], "id": 11, "evidence": [{"ref": "28:15", "text": "അവര്‍ പണം വാങ്ങി, നിര്‍ദേശമനുസരിച്ചു പ്രവര്‍ത്തിച്ചു. ഇത് ഇന്നും യഹൂദരുടെയിടയില്‍ പ്രചാരത്തിലിരിക്കുന്നു."}]}, {"type": "mc", "q": "അധികാരത്തെക്കുറിച്ചുള്ള വചനത്തിനു തൊട്ടുമുമ്പ് യേശു ചെയ്തത്?", "options": ["അവരെ സ്പർശിച്ചു", "മലയിലേക്ക് അവരെ അയച്ചു", "അവരെ സമീപിച്ചു", "അവരോടൊപ്പം ഇരുന്നു"], "answer": 2, "refs": ["28:18"], "id": 12, "evidence": [{"ref": "28:18", "text": "യേശു അവരെ സമീപിച്ച്, അരുളിച്ചെയ്തു: സ്വര്‍ഗത്തിലും ഭൂമിയിലുമുള്ള എല്ലാ അധികാരവും എനിക്കു നല്‍കപ്പെട്ടിരിക്കുന്നു."}]}, {"type": "mc", "q": "ജ്ഞാനസ്നാനം, പഠിപ്പിക്കൽ, സാന്നിധ്യവാഗ്ദാനം എന്നിവയുടെ കൃത്യമായ ക്രമം?", "options": ["അനുസരിക്കാൻ പഠിപ്പിക്കൽ → ജ്ഞാനസ്നാനം → കൂടെയുണ്ടാകുമെന്ന വാഗ്ദാനം", "നാമത്തിൽ ജ്ഞാനസ്നാനം → കൽപിച്ചവ അനുസരിക്കാൻ പഠിപ്പിക്കൽ → കൂടെയുണ്ടാകുമെന്ന വാഗ്ദാനം", "കൂടെയുണ്ടാകുമെന്ന വാഗ്ദാനം → ജ്ഞാനസ്നാനം → പഠിപ്പിക്കൽ", "ജ്ഞാനസ്നാനം → കൂടെയുണ്ടാകുമെന്ന വാഗ്ദാനം → പഠിപ്പിക്കൽ"], "answer": 1, "refs": ["28:20"], "id": 13, "evidence": [{"ref": "28:20", "text": "പിതാവിന്റെയും പുത്രന്റെയും പരിശുദ്ധാത്മാവിന്റെയും നാമത്തില്‍ അവര്‍ക്കു ജ്ഞാനസ്‌നാനം നല്‍കുവിന്‍. ഞാന്‍ നിങ്ങളോടു കല്‍പിച്ചവയെല്ലാം അനുസരിക്കാന let current=0, responses=quiz.questions.map(()=>null), drafts=quiz.questions.map(()=>null);
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.normalize('NFC').trim().replace(/\s+/g,' ').replace(/\u200c|\u200d/g,'').replace(/ണ്/g,'ൺ').replace(/ന്/g,'ൻ').replace(/ര്/g,'ർ').replace(/ല്/g,'ൽ').replace(/ള്/g,'ൾ').replace(/ക്/g,'ൿ');
const labels={mc:'ശരിയായത് തിരഞ്ഞെടുക്കുക',fill:'വിട്ടുപോയ ഭാഗത്തിന് ശരിയായത് തിരഞ്ഞെടുക്കുക',match:'കൂട്ടിയിണക്കുക',tf:'ശരിയോ തെറ്റോ?'};
function right(q){return q.type==='mc'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.type==='tf'?(q.answer?'ശരി':'തെറ്റ്'):q.type==='match'?q.rows.map(r=>r[0]+' → '+r[1]).join('\n'):q.answer;}
function userText(q,a){return q.type==='mc'?String.fromCharCode(65+a)+'. '+q.options[a]:q.type==='tf'?(a?'ശരി':'തെറ്റ്'):q.type==='match'?q.rows.map((r,i)=>r[0]+' → '+q.rows[a[i]][1]).join('\n'):q.type==='fill'?q.options[a]:a;}
function saveDraft(){const q=quiz.questions[current];if(responses[current])return;drafts[current]=q.type==='match'?q.rows.map((_,i)=>$('match-'+i).value):document.querySelector('input[name="answer"]:checked')?.value??null;}
function answerSelected(){if(responses[current])return;saveDraft();const q=quiz.questions[current],a=drafts[current];if(q.type==='match'){const selected=a.filter(x=>x!=='').length;$('notice').textContent=selected<q.rows.length?`കൂട്ടിയിണക്കിയത്: ${selected} / ${q.rows.length}`:'';if(selected!==q.rows.length)return;}if(a!==null)check();}
function render(){const q=quiz.questions[current],r=responses[current],a=drafts[current];const count=responses.filter(Boolean).length,score=responses.filter(x=>x?.correct).length;
$('position').textContent=`ചോദ്യം ${current+1} / ${total}`;$('score').textContent=`നിങ്ങളുടെ സ്കോർ: ${score} / ${total}`;$('remaining').textContent=`ബാക്കി: ${total-count}`;$('progress').max=total;$('progress').value=count;$('checked-count').textContent=`പരിശോധിച്ചത്: ${count} / ${total}`;
$('question-jump').innerHTML=quiz.questions.map((item,i)=>{const response=responses[i],state=response?(response.correct?'ശരിയായ ഉത്തരം':'തെറ്റായ ഉത്തരം'):'പരിശോധിച്ചിട്ടില്ല';return `<button type="button" data-jump="${i}" class="${response?(response.correct?'done-correct':'done-wrong'):''}" ${i===current?'aria-current="step"':''} aria-label="ചോദ്യം ${i+1}, ${state}">${i+1}${response?(response.correct?' ✓':' ✕'):''}</button>`;}).join('');$('question-jump').querySelectorAll('button').forEach(button=>button.onclick=()=>jumpTo(Number(button.dataset.jump)));
$('type').textContent=labels[q.type];$('question-title').textContent=`${current+1}. ${q.q}`;$('notice').textContent='';
if(q.type==='mc'||q.type==='fill'||q.type==='tf'){const opts=q.type==='tf'?['ശരി','തെറ്റ്']:q.options;$('controls').innerHTML='<fieldset style="border:0;padding:0;margin:0"><legend>നിങ്ങളുടെ ഉത്തരം തിരഞ്ഞെടുക്കുക</legend>'+opts.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${String(a)===String(i)?'checked':''} ${r?'disabled':''}><span>${q.type!=='tf'?String.fromCharCode(65+i)+'. ':''}${esc(o)}</span></label>`).join('')+'</fieldset>';
}else{const order=q.rows.map((_,i)=>i).sort((x,y)=>((x*3+1)%q.rows.length)-((y*3+1)%q.rows.length));if(order.every((x,i)=>x===i))order.reverse();$('controls').innerHTML=q.rows.map((row,i)=>`<div class="match-row"><label for="match-${i}">${i+1}. ${esc(row[0])}</label><select id="match-${i}" ${r?'disabled':''}><option value="">തിരഞ്ഞെടുക്കുക</option>${order.map(j=>`<option value="${j}" ${a&&String(a[i])===String(j)?'selected':''}>${esc(q.rows[j][1])}</option>`).join('')}</select></div>`).join('');}
$('feedback').innerHTML=r?feedback(q,r):'';$('prev').disabled=current===0;$('next').disabled=current===total-1;$('controls').querySelectorAll('input,select').forEach(control=>{control.oninput=answerSelected;control.onchange=answerSelected;if(q.type==='match')control.onblur=answerSelected;});
if(count===total)showResults();else{$('results').hidden=true;$('results').innerHTML='';}}
function feedback(q,r){const parts=q.type==='match'?'<div>'+q.rows.map((row,i)=>`<p>${i+1}. ${esc(row[0])}: ${r.value[i]===i?'ശരിയാണ്':'തെറ്റാണ്'}</p>`).join('')+'</div>':'';
return `<div tabindex="-1" class="feedback ${r.correct?'':'wrong'}"><div class="feedback-heading"><span class="status-icon" aria-hidden="true">${r.correct?'✓':'✕'}</span><strong>${r.correct?'ശരിയാണ് — 1 മാർക്ക്':'തെറ്റാണ് — 0 മാർക്ക്'}</strong></div>${parts}<p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,r.value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div><details><summary>വചനാധാരം കാണുക</summary>${q.evidence.map(e=>`<div class="evidence"><strong>${esc(e.label||'മത്തായി '+e.ref)}</strong><p>${esc(e.text)}</p></div>`).join('')}</details></div>`;}
function check(){if(responses[current])return;saveDraft();const q=quiz.questions[current],a=drafts[current];if(a===null||(q.type==='match'&&a.some(x=>x===''))){$('notice').textContent=q.type==='match'?'എല്ലാ കൂട്ടുകളും തിരഞ്ഞെടുക്കുക.':'ആദ്യം നിങ്ങളുടെ ഉത്തരം നൽകുക.';return;}
let value,correct;if(q.type==='mc'){value=Number(a);correct=value===q.answer;}else if(q.type==='tf'){value=a==='0';correct=value===q.answer;}else if(q.type==='fill'){value=Number(a);correct=value===q.optionAnswer;}else{value=a.map(Number);correct=value.every((x,i)=>x===i);}
responses[current]={value,correct};render();const target=$('feedback').firstElementChild;requestAnimationFrame(()=>{if(!target.isConnected)return;target.focus({preventScroll:true});target.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});target.classList.add(correct?'celebrate':'try-again');});}
function showResults(){const n=responses.filter(x=>x.correct).length;$('results').hidden=false;$('results').innerHTML=`<h2 id="results-title">ക്വിസ് പൂർത്തിയായി</h2><p><strong>നിങ്ങളുടെ സ്കോർ: ${n} / ${total}</strong></p><p>ശരിയായ ഉത്തരങ്ങൾ: ${n}<br>തെറ്റായ ഉത്തരങ്ങൾ: ${total-n}<br>ശതമാനം: ${Math.round(n/total*100)}%</p><h3>ഉത്തരങ്ങൾ പരിശോധിക്കാം</h3>`+quiz.questions.map((q,i)=>`<div class="review"><h3>${i+1}. ${esc(q.q)}</h3><p>${responses[i].correct?'ശരിയാണ്':'തെറ്റാണ്'}</p><p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,responses[i].value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div></div>`).join('');}
function jumpTo(index){if(!Number.isInteger(index)||index<0||index>=total)return;saveDraft();current=index;render();$('question-title').focus({preventScroll:true});$('question-panel').scrollIntoView({block:'start'});}function move(step){jumpTo(current+step);}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reset').onclick=()=>{current=0;responses=quiz.questions.map(()=>null);drafts=quiz.questions.map(()=>null);render();$('question-title').focus();window.scrollTo(0,0);};render();
</script></body></html>
