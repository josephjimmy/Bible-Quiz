'use strict';
const quiz={"range": "24-25", "title": "അന്ത്യകാലവും മനുഷ്യപുത്രന്റെ ആഗമനവും", "questions": [{"type": "mc", "q": "ആഗമനത്തിന്റെയും യുഗാന്തത്തിന്റെയും അടയാളം ചോദിക്കുമ്പോൾ യേശു ഇരുന്നത് എവിടെ?", "options": ["ദേവാലയത്തിൽ", "ജറുസലെമിന്റെ കവാടത്തിൽ", "ബഥാനിയായിൽ", "ഒലിവുമലയിൽ"], "answer": 3, "refs": ["24:3"], "id": 1, "evidence": [{"ref": "24:3", "text": "അവന്‍ ഒലിവുമലയില്‍ ഇരിക്കുമ്പോള്‍ ശിഷ്യന്‍മാര്‍ തനിച്ച് അവനെ സമീപിച്ചു പറഞ്ഞു: ഇതെല്ലാം എപ്പോള്‍ സംഭവിക്കുമെന്നും നിന്റെ ആഗമനത്തിന്റെയും യുഗാന്തത്തിന്റെയും അടയാളമെന്താണെന്നും ഞങ്ങള്‍ക്കു പറഞ്ഞുതരണമേ!"}]}, {"type": "mc", "q": "യുദ്ധങ്ങളും കിംവദന്തികളും കേൾക്കുന്നതിനെക്കുറിച്ചുള്ള കൃത്യമായ വിലയിരുത്തൽ?", "options": ["ഇനിയും അവസാനമായിട്ടില്ല", "അപ്പോഴാണ് അന്ത്യം ആഗതമാകുന്നത്", "ആകാശശക്തികൾ ഇളകിക്കഴിഞ്ഞു", "അവ സംഭവിക്കേണ്ടതില്ല"], "answer": 0, "refs": ["24:6"], "id": 2, "evidence": [{"ref": "24:6", "text": "നിങ്ങള്‍യുദ്ധങ്ങളെപ്പറ്റി കേള്‍ക്കും; അവയെപ്പറ്റിയുള്ള കിംവദന്തികളും. എന്നാല്‍, നിങ്ങള്‍ അസ്വസ്ഥരാകരുത്. കാരണം, ഇതെല്ലാം സംഭവിക്കേണ്ടതാണ്. എന്നാല്‍, ഇനിയും അവസാനമായിട്ടില്ല."}]}, {"type": "mc", "q": "രാജ്യത്തിന്റെ സുവിശേഷം ലോകമെങ്ങും പ്രസംഗിക്കപ്പെടുന്നത് എന്തിനായി?", "options": ["എല്ലാ ജനതകളുടെയും സാക്ഷ്യത്തിനായി", "ദൂതന്മാരുടെ ആഗമനത്തിനായി", "വ്യാജപ്രവാചകന്മാരുടെ വിധിക്കായി", "തെരഞ്ഞെടുക്കപ്പെട്ടവരുടെ പലായനത്തിനായി"], "answer": 0, "refs": ["24:14"], "id": 3, "evidence": [{"ref": "24:14", "text": "എല്ലാ ജനതകളുടെയും സാക്ഷ്യത്തിനായി രാജ്യത്തിന്റെ ഈ സുവിശേഷം ലോകമെങ്ങും പ്രസംഗിക്കപ്പെടും. അതിനുശേഷം അന്ത്യം ആഗതമാകും."}]}, {"type": "mc", "q": "പലായനം ആകാതിരിക്കാൻ പ്രാർഥിക്കേണ്ട രണ്ടു സാഹചര്യങ്ങൾ?", "options": ["ശീതകാലവും രാത്രിയും", "ശീതകാലവും സാബത്തും", "വേനൽക്കാലവും സാബത്തും", "വേനൽക്കാലവും രാത്രിയും"], "answer": 1, "refs": ["24:20"], "id": 4, "evidence": [{"ref": "24:20", "text": "നിങ്ങളുടെ പലായനം ശീതകാലത്തോ സാബത്തിലോ ആകാതിരിക്കാന്‍ പ്രാര്‍ഥിക്കുവിന്‍."}]}, {"type": "mc", "q": "ദിവസങ്ങൾ പരിമിതപ്പെടുത്തുന്നത് ആരെപ്രതി?", "options": ["സർവജനങ്ങളെയും പ്രതി", "തെരഞ്ഞെടുക്കപ്പെട്ടവരെപ്രതി", "ഗർഭിണികളെപ്രതി", "ശിഷ്യന്മാരെ മാത്രം പ്രതി"], "answer": 1, "refs": ["24:22"], "id": 5, "evidence": [{"ref": "24:22", "text": "ആദിവസങ്ങള്‍ പരിമിതപ്പെടുത്തിയില്ലായിരുന്നെങ്കില്‍, ഒരുവനും രക്ഷപെടുകയില്ലായിരുന്നു. എന്നാല്‍, തെരഞ്ഞെടുക്കപ്പെട്ടവരെ പ്രതി ആദിവസങ്ങള്‍ പരിമിതപ്പെടുത്തും."}]}, {"type": "mc", "q": "പീഡനങ്ങൾക്കുശേഷം ആകാശത്തിലെ സംഭവങ്ങളുടെ പറഞ്ഞിരിക്കുന്ന ക്രമം?", "options": ["നക്ഷത്രങ്ങൾ നിപതിക്കും → സൂര്യൻ ഇരുളും → ചന്ദ്രൻ പ്രകാശം തരില്ല → ആകാശശക്തികൾ ഇളകും", "സൂര്യൻ ഇരുളും → ചന്ദ്രൻ പ്രകാശം തരില്ല → നക്ഷത്രങ്ങൾ നിപതിക്കും → ആകാശശക്തികൾ ഇളകും", "സൂര്യൻ ഇരുളും → നക്ഷത്രങ്ങൾ നിപതിക്കും → ആകാശശക്തികൾ ഇളകും → ചന്ദ്രൻ പ്രകാശം തരില്ല", "ചന്ദ്രൻ പ്രകാശം തരില്ല → സൂര്യൻ ഇരുളും → ആകാശശക്തികൾ ഇളകും → നക്ഷത്രങ്ങൾ നിപതിക്കും"], "answer": 1, "refs": ["24:29"], "id": 6, "evidence": [{"ref": "24:29", "text": "അക്കാലത്തെ പീഡനങ്ങള്‍ക്കുശേഷം പൊടുന്നനെ സൂര്യന്‍ ഇരുണ്ടുപോകും. ചന്ദ്രന്‍ പ്രകാശം തരുകയില്ല. നക്ഷത്രങ്ങള്‍ ആകാശത്തില്‍നിന്നു നിപതിക്കും. ആകാശ ശക്തികള്‍ ഇളകുകയും ചെയ്യും."}]}, {"type": "mc", "q": "തെരഞ്ഞെടുക്കപ്പെട്ടവരെ കൂട്ടാൻ ദൂതന്മാരെ അയയ്ക്കുന്നത് എന്തിനോടുകൂടെ?", "options": ["മിന്നൽപ്പിണരോടുകൂടെ", "വലിയ ഭൂകമ്പത്തോടുകൂടെ", "വലിയ കാഹളധ്വനിയോടുകൂടെ", "ആർപ്പുവിളിയോടുകൂടെ"], "answer": 2, "refs": ["24:31"], "id": 7, "evidence": [{"ref": "24:31", "text": "വലിയ കാഹളധ്വനിയോടുകൂടെ തന്റെ ദൂതന്‍മാരെ അവന്‍ അയയ്ക്കും. അവര്‍ ആകാശത്തിന്റെ ഒരറ്റം മുതല്‍ മറ്റേ അറ്റംവരെ നാലുദിക്കുകളിലുംനിന്ന് അവന്റെ തെരഞ്ഞെടുക്കപ്പെട്ടവരെ ഒരുമിച്ചുകൂട്ടും."}]}, {"type": "mc", "q": "നോഹ പേടകത്തിൽ പ്രവേശിച്ച ദിവസംവരെ ചെയ്തവയുടെ പട്ടികയിൽ ഇല്ലാത്തത്?", "options": ["വ്യാപാരം ചെയ്തു", "വിവാഹം ചെയ്തു", "വിവാഹം ചെയ്തുകൊടുത്തു", "തിന്നും കുടിച്ചും കഴിഞ്ഞു"], "answer": 0, "refs": ["24:38"], "id": 8, "evidence": [{"ref": "24:38", "text": "നോഹ പേടകത്തില്‍ പ്രവേശിച്ച ദിവസംവരെ, അവര്‍ തിന്നും കുടിച്ചും വിവാഹം ചെയ്തും ചെയ്തുകൊടുത്തും കഴിഞ്ഞുപോന്നു."}]}, {"type": "mc", "q": "വിശ്വസ്തനും വിവേകിയുമായ ഭൃത്യന് നൽകിയ ചുമതല?", "options": ["യജമാനന്റെ പണം പലിശയ്ക്ക് നൽകുക", "ഭവനത്തിന്റെ വാതിൽ രാത്രിയിൽ അടയ്ക്കുക", "ഭവനത്തിലുള്ളവർക്ക് കൃത്യസമയത്ത് ഭക്ഷണം കൊടുക്കുക", "വിളക്കുകൾക്കായി എണ്ണ കരുതുക"], "answer": 2, "refs": ["24:45"], "id": 9, "evidence": [{"ref": "24:45", "text": "തന്റെ ഭവനത്തിലുള്ളവര്‍ക്ക് കൃത്യസമയത്തു ഭക്ഷണം കൊടുക്കാന്‍യജമാനന്‍ നിയോഗിച്ചവിശ്വസ്തനും വിവേകിയുമായ ഭൃത്യന്‍ ആരാണ്?"}]}, {"type": "mc", "q": "മണവാളനെ എതിരേൽക്കാനുള്ള ആർപ്പുവിളി ഉണ്ടായത് എപ്പോൾ?", "options": ["അതിരാവിലെ", "ആറാം മണിക്കൂറിൽ", "അർധരാത്രിയിൽ", "വൈകുന്നേരം"], "answer": 2, "refs": ["25:6"], "id": 10, "evidence": [{"ref": "25:6", "text": "അര്‍ധരാത്രിയില്‍, ഇതാ, മണവാളന്‍! പുറത്തുവന്ന് അവനെ എതിരേല്‍ക്കുവിന്‍! എന്ന് ആര്‍പ്പുവിളിയുണ്ടായി."}]}, {"type": "mc", "q": "താലന്ത് നൽകുന്നതിന്റെ അടിസ്ഥാനമായി വ്യക്തമാക്കുന്നത്?", "options": ["ഓരോരുത്തന്റെയും അപേക്ഷ", "ഓരോരുത്തന്റെയും കഴിവ്", "ഓരോരുത്തന്റെയും അധ്വാനം", "ഓരോരുത്തന്റെയും വിശ്വസ്തത"], "answer": 1, "refs": ["25:15"], "id": 11, "evidence": [{"ref": "25:15", "text": "അവന്‍ ഓരോരുത്തന്റെയും കഴിവനുസരിച്ച് ഒരുവന് അഞ്ചു താലന്തും മറ്റൊരുവന് രണ്ടും വേറൊരുവന് ഒന്നും കൊടുത്തശേഷംയാത്ര പുറപ്പെട്ടു."}]}, {"type": "mc", "q": "ഒരു താലന്ത് കിട്ടിയവൻ പണം ആരുടെ പക്കൽ നിക്ഷേപിക്കേണ്ടതായിരുന്നു?", "options": ["അഞ്ചു താലന്ത് കിട്ടിയവന്റെ പക്കൽ", "വിൽപനക്കാരുടെ പക്കൽ", "കാര്യസ്ഥന്റെ പക്കൽ", "പണവ്യാപാരികളുടെ പക്കൽ"], "answer": 3, "refs": ["25:27"], "id": 12, "evidence": [{"ref": "25:27", "text": "എന്റെ നാണയം നീ പണവ്യാപാരികളുടെ പക്കല്‍ നിക്‌ഷേപിക്കേണ്ടതായിരുന്നു. ഞാന്‍ വന്ന് എന്റെ പണം പലിശ സഹിതം വാങ്ങുമായിരുന്നു."}]}, {"type": "mc", "q": "ഇടത്തുള്ളവർ പോകേണ്ട നിത്യാഗ്നി ആർക്കുവേണ്ടി സജ്ജമാക്കിയത്?", "options": ["ദുഷ്ടനും മടിയനുമായ ഭൃത്യന്മാർക്കും", "കപടനാട്യക്കാർക്കും വ്യാജപ്രവാചകന്മാർക്കും", "വിവേകശൂന്യകൾക്കും കള്ളക്രിസ്തുമാർക്കും", "പിശാചിനും അവന്റെ ദൂതന്മാർക്കും"], "answer": 3, "refs": ["25:41"], "id": 13, "evidence": [{"ref": "25:41", "text": "അനന്തരം അവന്‍ തന്റെ ഇടത്തു ഭാഗത്തുള്ളവരോടു പറയും: ശപിക്കപ്പെട്ടവരേ, നിങ്ങള്‍ എന്നില്‍ നിന്നകന്ന് പിശാചിനും അവന്റെ ദൂതന്‍മാര്‍ക്കുമായി സജ്ജമാക്കിയിരിക്കുന്ന നിത്യാഗ്‌നിയിലേക്കു പോകുവിന്‍."}]}, {"type": "fill", "q": "ഇതെല്ലാം ________ ആരംഭം മാത്രമാണ്. (24:8)", "answer": "ഈറ്റുനോവി if(count===total)showResults();else{$('results').hidden=true;$('results').innerHTML='';}}
function feedback(q,r){const parts=q.type==='match'?'<div>'+q.rows.map((row,i)=>`<p>${i+1}. ${esc(row[0])}: ${r.value[i]===i?'ശരിയാണ്':'തെറ്റാണ്'}</p>`).join('')+'</div>':'';
return `<div tabindex="-1" class="feedback ${r.correct?'':'wrong'}"><div class="feedback-heading"><span class="status-icon" aria-hidden="true">${r.correct?'✓':'✕'}</span><strong>${r.correct?'ശരിയാണ് — 1 മാർക്ക്':'തെറ്റാണ് — 0 മാർക്ക്'}</strong></div>${parts}<p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,r.value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div><details><summary>വചനാധാരം കാണുക</summary>${q.evidence.map(e=>`<div class="evidence"><strong>${esc(e.label||'മത്തായി '+e.ref)}</strong><p>${esc(e.text)}</p></div>`).join('')}</details></div>`;}
function check(){if(responses[current])return;saveDraft();const q=quiz.questions[current],a=drafts[current];if(a===null||(q.type==='match'&&a.some(x=>x===''))){$('notice').textContent=q.type==='match'?'എല്ലാ കൂട്ടുകളും തിരഞ്ഞെടുക്കുക.':'ആദ്യം നിങ്ങളുടെ ഉത്തരം നൽകുക.';return;}
let value,correct;if(q.type==='mc'){value=Number(a);correct=value===q.answer;}else if(q.type==='tf'){value=a==='0';correct=value===q.answer;}else if(q.type==='fill'){value=Number(a);correct=value===q.optionAnswer;}else{value=a.map(Number);correct=value.every((x,i)=>x===i);}
responses[current]={value,correct};render();const target=$('feedback').firstElementChild;requestAnimationFrame(()=>{if(!target.isConnected)return;target.focus({preventScroll:true});target.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});target.classList.add(correct?'celebrate':'try-again');});}
function showResults(){const n=responses.filter(x=>x.correct).length;$('results').hidden=false;$('results').innerHTML=`<h2 id="results-title">ക്വിസ് പൂർത്തിയായി</h2><p><strong>നിങ്ങളുടെ സ്കോർ: ${n} / ${total}</strong></p><p>ശരിയായ ഉത്തരങ്ങൾ: ${n}<br>തെറ്റായ ഉത്തരങ്ങൾ: ${total-n}<br>ശതമാനം: ${Math.round(n/total*100)}%</p><h3>ഉത്തരങ്ങൾ പരിശോധിക്കാം</h3>`+quiz.questions.map((q,i)=>`<div class="review"><h3>${i+1}. ${esc(q.q)}</h3><p>${responses[i].correct?'ശരിയാണ്':'തെറ്റാണ്'}</p><p><strong>നിങ്ങളുടെ ഉത്തരം:</strong></p><div class="answer">${esc(userText(q,responses[i].value))}</div><p><strong>ശരിയായ ഉത്തരം:</strong></p><div class="answer">${esc(right(q))}</div></div>`).join('');}
function jumpTo(index){if(!Number.isInteger(index)||index<0||index>=total)return;saveDraft();current=index;render();$('question-title').focus({preventScroll:true});$('question-panel').scrollIntoView({block:'start'});}function move(step){jumpTo(current+step);}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reset').onclick=()=>{current=0;responses=quiz.questions.map(()=>null);drafts=quiz.questions.map(()=>null);render();$('question-title').focus();window.scrollTo(0,0);};render();
</script></body></html>
